# The nine STM activities — the observatory's canonical comparison axis.
#
# Source: "Recommendations for a Classification of AI Use in Academic Manuscript
# Preparation", STM Association Task and Finish Group on AI Labelling Terminology
# for Research Content Declaration, September 2025.
# URL: https://s3.eu-west-2.amazonaws.com/stm.offloadmedia/wp-content/uploads/2025/04/23020709/STM_AI_Classification_Recs_19_Sept2025-1.pdf
# Retrieved and text-extracted locally 2026-08-21. Titles below are VERBATIM.
#
# WHY THIS IS THE AXIS LIST:
# The group that wrote it is staffed by Springer Nature (x2), Elsevier, Wiley,
# Taylor & Francis, CUP, BMJ, ACS and IEEE. It instructs publishers to decide,
# per activity, what is permitted and what must be declared — which is precisely
# the shape of Springer Nature's risk tiers and Wiley's per-task matrix.
# It then explicitly declines to harmonise the answers. Same grid, different
# answers by design. We record how differently the grid gets filled in.
#
# Scope limit, verbatim from the document — and the reason we add axis 10:
#   "This classification addresses only the use of AI assistance for the
#    preparation of manuscripts intended for publication"
#   and, under what it does NOT aim to do:
#   "Classify uses of AI in research processes."

source:
  title: Recommendations for a Classification of AI Use in Academic Manuscript Preparation
  body: STM Association Task and Finish Group on AI Labelling Terminology for Research Content Declaration
  date: 2025-09
  url: https://s3.eu-west-2.amazonaws.com/stm.offloadmedia/wp-content/uploads/2025/04/23020709/STM_AI_Classification_Recs_19_Sept2025-1.pdf
  retrieved: 2026-08-21
  provenance: raw_bytes

activities:
  - id: 1
    key: language_refinement
    plain: Using AI to polish your language
    title: Refinement, correction, editing or formatting the manuscript to improve clarity of language
    note_2023: "2023 STM Guidelines recommend that disclosure is not necessary for this use of automated tools."
    excludes: Using AI tools to generate text from prompts or generate summaries of text

  - id: 2
    key: writing_drafting
    plain: Using AI to draft manuscript text
    title: Writing or drafting manuscript content
    excludes: Use of simple spelling and grammar checkers

  - id: 3
    key: data_presentation
    plain: Using AI to format the data you report
    title: Refining or formatting of data reported in the manuscript
    excludes: Using AI tools to visualise data sets (activity 6) or data manipulation

  - id: 4
    key: illustrative_images
    plain: AI-generated illustrative figures
    title: Generation, refinement, correction, editing or formatting of images, diagrams or other figures for illustrative purposes only
    excludes: Visualisation of actual data or research outputs

  - id: 5
    key: translation
    plain: Using AI to translate your manuscript
    title: Translation of manuscript text for the purpose of publishing
    excludes: Translation of materials as part of the research process, unrelated to manuscript preparation

  - id: 6
    key: data_visualisation
    plain: AI-generated charts of your real data
    title: Generation, refinement, correction, editing or formatting of visualisations of research data or results
    excludes: Use of traditional statistical software (such as STATA, SAS, and R) to visualise data

  - id: 7
    key: code_presentation
    plain: Using AI to tidy code you report
    title: Refinement or formatting of code reported in the submitted manuscript
    excludes: Using AI tools to generate new code for use in research processes

  - id: 8
    key: reference_gathering
    plain: Using AI to find references
    title: Assisting with gathering references
    excludes: Using AI tools to generate plausible-sounding references that do not exist

  - id: 9
    key: passing_off
    plain: Presenting AI output as original data
    title: Presentation of any kind of content generated by AI tools as though it were original research data/results from non-machine sources
    note_2023: "2023 STM Guidelines recommend prohibiting this use of AI tools."

# ─────────────────────────────────────────────────────────────────────────────
# AXES STM EXCLUDES BY CONSTRUCTION.
# Not part of the STM grid. We track them because the exclusion is the finding:
# the field's only shared taxonomy draws its boundary to exclude exactly the
# workflows that now produce results, and the questions authors most need answered.
extended_axes:
  - key: research_process_ai
    plain: Using AI to run the research itself
    title: AI used in the research process itself — analysis, code execution, agentic workflows
    why: Explicitly outside STM scope. Wiley addresses it; almost nobody else does.

  - key: reviewer_use
    plain: Using AI when you peer-review
    title: Use of AI by peer reviewers
    why: Widest divergence of any axis, and reversing. Not a manuscript-preparation activity.

  - key: publisher_own_use
    plain: The publisher running AI on your manuscript
    title: The publisher's or editor's own AI use on submitted manuscripts
    why: ICMJE section V.C now obliges journals to disclose this. Makes the asymmetry measurable.

  - key: detection_screening
    plain: Being screened by AI detectors
    title: Whether AI-text or integrity screening is run, and whether authors are told
    why: Near-universal silence. One publisher admits it. None denies it.

  - key: due_process
    plain: Knowing why you were flagged, and appealing
    title: Threshold for review, notification of the author, and route of appeal
    why: No policy found anywhere grants any of the three.

  - key: audit_trail
    plain: Keeping prompts and session records
    title: Prompts, model versions, session records retained as evidence
    why: The requirement agentic work needs. ISTIC 3.0 has it; English-language policy does not.

  - key: content_licensing
    plain: Your paper licensed for AI training
    title: Licensing of author content for AI training, and author consent
    why: Does not follow the publisher hierarchy — content is sublicensed between publishers.
