name: verify

# Two jobs, deliberately separate.
#
# `validate` gates every change. It now also re-checks every quote against the
# stored copy of the page it came from — the check that was missing when eight
# quotes shipped attributed to pages that did not contain them.
#
# `monitor` runs monthly, NEVER edits a record, and COMMITS the fetched hashes
# back. Without that commit the previous version compared every scheduled run
# against a frozen baseline and could not detect drift at all.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 1 * *"     # 06:00 UTC, first of the month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema pypdf
      - name: Test monitoring failure paths
        run: python3 -m unittest discover -s tests -v
      - name: Validate records, schema and every quote
        run: python3 tools/validate.py
      - name: Build site
        run: python3 tools/build.py
      - name: Fail if the build produced nothing
        run: test -s docs/index.html && test -s docs/data.json

  monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # to commit the new hashes
      issues: write          # to open the review queue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema pypdf

      - name: Fetch and hash every source
        id: fetch
        shell: bash
        run: |
          set -o pipefail
          code=0
          python3 tools/fetch.py 2>&1 | tee /tmp/fetch.txt || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # The monitor's own commit is pushed with GITHUB_TOKEN, which does not
      # trigger the validate job. On 2026-09-01 it committed text extracts that
      # held raw PDF bytes instead of words, and nothing noticed for ten days.
      # What the monitor commits must pass the same gate as a human commit.
      - name: Quote gate on the refetched extracts
        id: gate
        shell: bash
        run: |
          set -o pipefail
          code=0
          python3 tools/validate.py 2>&1 | tee /tmp/gate.txt || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # diff.py exits 2 when items await adjudication. An exit code is the
      # mechanism; grepping stdout was brittle and `| tee` swallowed crashes.
      - name: Build the review queue
        id: diff
        shell: bash
        run: |
          set -o pipefail
          code=0
          python3 tools/diff.py 2>&1 | tee /tmp/review.txt || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Persist the hash chain
        shell: bash
        run: |
          git config user.name  "policy-monitor"
          git config user.email "policy-monitor@users.noreply.github.com"
          git add -A snapshots
          git diff --cached --quiet || git commit -m "monitor: refresh source hashes $(date -u +%Y-%m-%d)"
          git push

      - name: Open a review issue for drift, failed retrieval or missing live checks
        if: steps.diff.outputs.code != '0' || steps.gate.outputs.code != '0' || steps.fetch.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh label create review-queue --color FBCA04 \
            --description "A tracked policy page changed and needs a human" 2>/dev/null || true
          { cat /tmp/review.txt; echo; echo '## Fetch and live coverage'; echo '```'; cat /tmp/fetch.txt; echo '```'; echo '## Quote gate'; echo '```'; cat /tmp/gate.txt; echo '```'; } > /tmp/issue.md
          gh issue create \
            --title "Policy review needed — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/issue.md \
            --label review-queue

      - name: Fail the monitor when review or repair is needed
        if: always()
        env:
          FETCH_CODE: ${{ steps.fetch.outputs.code }}
          GATE_CODE: ${{ steps.gate.outputs.code }}
          DIFF_CODE: ${{ steps.diff.outputs.code }}
        run: test "$FETCH_CODE" = 0 && test "$GATE_CODE" = 0 && test "$DIFF_CODE" = 0
