- axis: data_visualisation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - dedicated_section
  - figure_caption
  rationale: accountability
  conditions: Permitted where the underlying data, methods or computational outputs can be inspected and
    verified, the processing has had human review, and the output accurately represents the evidence.
    Authors remain responsible for ensuring that the use does not infringe copyright, licensing or other
    intellectual property rights. Producing data or figures as if empirical is not permitted. Disclosure names model and purpose, in
    an AI Declaration and in the caption or legend. Non-generative machine learning tools that analyse,
    improve, combine, restore, segment or enhance existing visual content may be permitted where the
    underlying material remains attributable and the changes do not misrepresent the original content.
    Such use should be disclosed for editorial assessment.
  evidence:
  - source: manuscript-preparation
    quote: Examples may include the creation of charts from datasets, visualisation of computational outputs,
      diagrams derived from author-developed content, scientific images created from attributable data
      sources, or figures generated using code that has been reviewed and verified by the author.
