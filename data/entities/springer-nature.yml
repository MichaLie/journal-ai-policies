policies:
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: The Nature Portfolio framework applies to reviewers. Green uses are permitted, and amber
    uses are permitted with human oversight, verification and disclosure. Green uses are declared by describing
    the use; amber uses by describing how AI was used and confirming independent judgement. In both
    cases the reviewer takes accountability for all content in the report. Reviewers must independently
    verify all outputs and ensure conclusions and recommendations are their own. Generating full review reports,
    producing accept/reject recommendations, delegating critique to AI and uploading manuscripts to public
    or unsecured tools are not permitted. Limited use of manuscript content may be acceptable in secure
    or institutionally approved tools, depending on their data policies.
  evidence:
  - source: nature-portfolio-ai
    quote: 'The same framework applies across all roles: authors, reviewers and editors.'
    quote_provenance: raw_bytes
  - source: nature-portfolio-ai
    quote: Permitted. Disclosure enhances trust and transparency and clearly demonstrates human accountability.
    quote_provenance: raw_bytes
  - source: nature-portfolio-ai
    quote: Permitted with human oversight, verification, and transparency through disclosure.
    quote_provenance: raw_bytes
  - source: nature-portfolio-ai
    quote: May use AI to support peer review but must not upload manuscript content to unsecured or public
      AI tools
    quote_provenance: raw_bytes
  - source: nature-portfolio-ai
    quote: Delegating peer review to an LLM
    quote_provenance: raw_bytes
  - source: peer-review-ai
    quote: Describe use (e.g. language or structure support) and take accountability for all content in
      report
    quote_provenance: browser_dom
  - source: peer-review-ai
    quote: Describe how AI was used, confirm independent judgement and take accountability for all content
      in report
    quote_provenance: browser_dom
  - source: peer-review-ai
    quote: Uploading manuscripts to public/unsecured tools; generating full review reports; producing accept/reject
      recommendations; delegating critique to AI
    quote_provenance: browser_dom
  - source: peer-review-ai
    quote: Undermines confidentiality, independence, and accountability
    quote_provenance: browser_dom
  - source: peer-review-ai
    quote: Confidentiality risks may be reduced when using secure or institutionally approved AI tools.
    quote_provenance: browser_dom
  - source: peer-review-ai
    quote: Dependent on the data and privacy policies and settings of these tools limited use of manuscript
      content may be acceptable.
    quote_provenance: browser_dom
  - source: peer-review-ai
    quote: You must independently verify all outputs, make sure that you use your own discipline-specific
      expertise and ensure conclusions and recommendations are your own.
    quote_provenance: browser_dom
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: confidentiality
  conditions: Nature Portfolio journals occasionally use Springer Nature-developed or approved tools for accessory
    content, which the author and/or editor always edits and fact-checks. In the editorial process AI
    is used only to summarise, retrieve or highlight information; editors make all decisions. Editors
    should not upload manuscripts into public or open AI tools. Per-article declaration applies to substantive
    use beyond the listed tasks. The same risk framework applies to editors, who remain accountable for
    editorial decisions and oversight. The source lists the kinds of accessory content but does not name
    the tools or describe how they work.
  evidence:
  - source: nature-portfolio-ai
    quote: Nature Portfolio journals occasionally use artificial intelligence tools developed or approved
      by Springer Nature to support different tasks in the generation of accessory content or to support
      the editorial process.
    quote_provenance: raw_bytes
    evidence_role: supports
  - source: nature-portfolio-ai
    quote: 'Accessory content can include (but is not limited to): key points, glossary terms, editorial
      summaries, plain language summaries and social media posts.'
    quote_provenance: raw_bytes
  - source: nature-portfolio-ai
    quote: Accessory content is always edited and fact-checked by the author and/or editor to meet Nature
      Portfolio publication standards.
    quote_provenance: raw_bytes
  - source: nature-portfolio-ai
    quote: In the editorial process, artificial intelligence is only used to summarise, retrieve or highlight
      information. All decisions are made by editors.
    quote_provenance: raw_bytes
  - source: nature-portfolio-ai
    quote: Any substantive use of artificial intelligence beyond the above will be declared on an individual
      article basis.
    quote_provenance: raw_bytes
  - source: editor-guidance
    quote: Editors should also not upload manuscripts into public or open AI tools for assistance in evaluation.
    quote_provenance: browser_dom
  - source: nature-portfolio-ai
    quote: Confidentiality and data protection are mandatory Manuscripts, peer review reports, and sensitive
      data must not be shared with unsecured or public AI systems.
    quote_provenance: raw_bytes
  - source: nature-portfolio-ai
    quote: 'The same framework applies across all roles: authors, reviewers and editors.'
    quote_provenance: raw_bytes
  - source: nature-portfolio-ai
    quote: Remain accountable for editorial decisions and oversight
    quote_provenance: raw_bytes
- axis: language_refinement
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
