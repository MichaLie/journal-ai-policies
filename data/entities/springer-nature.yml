  rationale: accountability
  conditions: Grammar and language editing is green (low risk) in the author guidance. Outputs must be
    checked for accuracy and meaning, and the use is described with a confirmation of author accountability.
    Extensive copy editing is amber in the Nature Portfolio framework and is permitted with human oversight,
    verification and disclosure.
