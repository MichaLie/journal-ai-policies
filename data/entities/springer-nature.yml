- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: Green uses such as literature discovery, data cleaning and code scaffolding are declared
    by describing tool and purpose. Amber uses such as pattern identification, statistical modelling support
    and qualitative coding need a clear methodological description and validation steps. Generating hypotheses,
    analyses or conclusions without human oversight, fabricating data or references, and using sensitive
    or restricted data in public tools are not permitted.
  evidence:
  - source: research-use
    quote: AI may support your work, but you remain fully accountable for all research decisions, outputs,
      and conclusions.
    quote_provenance: browser_dom
  - source: research-use
    quote: Literature discovery, semantic search, summarising public literature; data cleaning, deduplication,
      quality checks; code scaffolding; project planning
    quote_provenance: browser_dom
  - source: research-use
    quote: Describe tool and purpose and take accountability
    quote_provenance: browser_dom
  - source: research-use
    quote: Identifying patterns in datasets; supporting statistical modelling; qualitative coding; generating
      explanatory summaries or comparisons
    quote_provenance: browser_dom
  - source: research-use
    quote: Provide clear methodological description and validation steps and take accountability
    quote_provenance: browser_dom
  - source: research-use
    quote: Generating hypotheses, analyses, or conclusions without human oversight; fabricating data or
      references; using sensitive or restricted data in public tools
    quote_provenance: browser_dom
- axis: detection_screening
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: confidentiality
  conditions: The editor guidance says tools claiming to detect generative AI are of uncertain accuracy
    and should be used with extreme caution. The editor and reviewer guidance both say that detectors
    that retain or train on uploaded content are inappropriate for unpublished manuscripts. Springer Nature
    does not expect editors to identify or investigate undisclosed AI use. The sources do not say whether
    Springer Nature itself screens submissions for AI use or whether authors are told of any screening.
  evidence:
  - source: editor-guidance
    quote: The accuracy and usefulness of such tools is far from definitive, and no tool is able to confirm
      whether the AI use was safe and policy compliant.
    quote_provenance: browser_dom
  - source: editor-guidance
    quote: Indeed, any such tools should be used with extreme caution, both in terms of the results they
      surface and the privacy and confidentiality frameworks within which they are being used
    quote_provenance: browser_dom
  - source: editor-guidance
    quote: Some enterprise and institutional versions of these AI detectors can retain and train on content
      uploaded to them; making them inappropriate for use with unpublished manuscripts as this would be
      a breach of confidentiality.
    quote_provenance: browser_dom
  - source: peer-review-ai
    quote: Some enterprise and institutional versions of these AI detectors can retain and train on content
      uploaded to them; making them inappropriate for use with unpublished manuscripts as this would be
      a breach of confidentiality.
    quote_provenance: browser_dom
  - source: editor-guidance
    quote: In practice, Springer Nature does not expect editors to identify or investigate undisclosed
      or unsafe uses of AI.
    quote_provenance: browser_dom
- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: The presence of an AI declaration does not indicate concern. Editors may seek clarification
    where a declaration lacks detail, where the declared use appears inconsistent with policy or with
    the manuscript or report, or where concerns arise regarding accountability, integrity, confidentiality
    or transparency. Where AI use is not declared, editors may need to investigate or request clarification.
    Editors intervene where accountability or transparency is unclear, and escalate to their publishing
    contact where integrity or policy boundaries are breached. The editor guidance says Springer Nature
    does not expect editors to identify or investigate undisclosed or unsafe uses of AI. Existing integrity,
    ethics and editorial governance processes apply. Triggers are stated (the conditions above). As a
    consequence, escalation to a publishing contact is stated; no rejection, correction or retraction
    for AI use is stated. On author contact, editors may request clarification, but the sources do not
    say from whom. No appeal route tied to AI concerns is stated.
  evidence:
  - source: editor-guidance
    quote: 'The presence of an AI declaration does not indicate concern. Editors may seek clarification
      where: A declaration lacks sufficient detail.'
    quote_provenance: browser_dom
  - source: editor-guidance
    quote: The declared use appears inconsistent with policy requirements or inconsistent with what is presented
      in the manuscript or peer review report.
    quote_provenance: browser_dom
  - source: editor-guidance
    quote: Concerns arise regarding accountability, integrity, confidentiality, or transparency.
    quote_provenance: browser_dom
  - source: nature-portfolio-ai
    quote: Existing research integrity, ethics, and editorial governance processes apply to all AI‑related
      concerns.
    quote_provenance: raw_bytes
  - source: manuscript-preparation
    quote: Where AI use is not declared, editors may need to investigate or request clarification, which
      can delay the review process and shift attention away from the manuscript’s contribution.
    quote_provenance: browser_dom
  - source: nature-portfolio-ai
    quote: Intervene where accountability or transparency is unclear
    quote_provenance: raw_bytes
  - source: nature-portfolio-ai
    quote: Escalate to their publishing contact where integrity or policy boundaries are breached
    quote_provenance: raw_bytes
  - source: editor-guidance
    quote: In practice, Springer Nature does not expect editors to identify or investigate undisclosed
      or unsafe uses of AI.
    quote_provenance: browser_dom
