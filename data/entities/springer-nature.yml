policies:
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - review_report
  rationale: accountability
  conditions: AI may support communication and exploration under human oversight. Reviewers retain independent
    expert judgement and must not delegate critique or disclose manuscript content to unsecured or public
    tools. The reviewer guidance specifies declaration in the report.
  evidence:
  - source: nature-portfolio-ai
    quote: Delegating peer review to an LLM
    quote_provenance: raw_bytes
  - source: peer-review-ai
    quote: Describe how AI was used, confirm independent judgement and take accountability for all content
      in report
    quote_provenance: browser_dom
- axis: publisher_own_use
  permission: permitted
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: unstated
  conditions: Ancillary support is described in the policy; substantive use beyond those listed activities
    is declared per article.
  evidence:
  - source: nature-portfolio-ai
    quote: Nature Portfolio journals occasionally use artificial intelligence tools developed or approved
      by Springer Nature to support different tasks in the generation of accessory content or to support
      the editorial process.
    quote_provenance: raw_bytes
    evidence_role: supports
  - source: nature-portfolio-ai
    quote: Any substantive use of artificial intelligence beyond the above will be declared on an individual
      article basis.
    quote_provenance: raw_bytes
- axis: translation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: Author guidance places translation in green with a declaration. This is more explicit than
    the umbrella green-tier wording.
  evidence:
  - source: manuscript-preparation
    quote: formatting; translation; summarising author-written text
    quote_provenance: browser_dom
  - source: manuscript-preparation
    quote: Clearly describe use and confirm author accountability
    quote_provenance: browser_dom
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: Drafting from author input is amber. Disclosure does not authorize replacement of scientific
    judgment.
  evidence:
  - source: manuscript-preparation
    quote: Generating outlines; drafting sections based on author input;
    quote_provenance: browser_dom
  - source: manuscript-preparation
    quote: Clearly describe use and confirm author accountability
    quote_provenance: browser_dom
- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: Grounded visual content is amber and must be labelled. Ungrounded generation is not covered
    by this permission.
  evidence:
  - source: manuscript-preparation
    quote: creating visual content with verifiable source data or material
    quote_provenance: browser_dom
  - source: manuscript-preparation
    quote: Clearly describe use and confirm author accountability
    quote_provenance: browser_dom
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: Research support under human accountability; the captured principle is not a task-by-task
    permission or a disclosure exemption.
  evidence:
  - source: research-use
    quote: AI may support your work, but you remain fully accountable for all research decisions, outputs,
      and conclusions.
    quote_provenance: browser_dom
- axis: detection_screening
  permission: discouraged
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: Detector use calls for extreme caution and confidentiality checks. This guidance is not
    a statement that routine screening occurs.
  evidence:
  - source: editor-guidance
    quote: The accuracy and usefulness of such tools is far from definitive, and no tool is able to confirm
      whether the AI use was safe and policy compliant.
    quote_provenance: browser_dom
- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: Explains when to seek clarification. Does not create a universal AI-specific appeal right.
  evidence:
  - source: editor-guidance
    quote: 'The presence of an AI declaration does not indicate concern. Editors may seek clarification
      where: A declaration lacks sufficient detail.'
    quote_provenance: browser_dom
coherence: []
