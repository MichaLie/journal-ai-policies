- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - dedicated_section
  - figure_caption
  rationale: accountability
  conditions: AI visual content is permitted only where it derives from verifiable data, source material,
    methods, computational outputs or author-developed content. Content created from text prompts or
    without verifiable source material is not permitted. Creating photorealistic images (deepfakes) is
    a red use in the Nature Portfolio framework. Authors remain responsible for ensuring that the use does
    not infringe copyright, licensing or other intellectual property rights. Disclosure goes in an AI
    Declaration in the manuscript and in the caption or legend.
  evidence:
  - source: manuscript-preparation
    quote: AI generated visual content that is not derived from independently verifiable data, source
      material, methods, computational outputs or author-developed content is considered opaque and is
      not permitted by Springer Nature policy.
    quote_provenance: browser_dom
  - source: manuscript-preparation
    quote: creating content from text prompts or without verifiable source data or material
    quote_provenance: browser_dom
  - source: manuscript-preparation
    quote: Specific disclosure should be provided within the caption or legend of the visual content.
    quote_provenance: browser_dom
  - source: manuscript-preparation
    quote: information about the AI system used, the purpose of its use, and the extent of its contribution
      should be provided in an AI Declaration in your manuscript.
    quote_provenance: browser_dom
  - source: nature-portfolio-ai
