- axis: illustrative_images
  permission: discouraged
  disclosure: required
  disclosure_location:
  - dedicated_section
  rationale: licensing
  conditions: Generative AI should be used for figures mainly to brainstorm and suggest image concepts.
    Direct creation of figures or artwork should be limited to demonstrating AI capabilities in specific
    contexts. Images duplicating copyrighted images, real people or identifiable products or brands must
    not be generated. Disclosure follows the general AI declaration, made in a separate statement at the
    end of the manuscript. No AI use is allowed in World Report and Perspectives.
  evidence:
  - source: info-for-authors
    quote: For figures, generative AI should be used primarily as a tool for brainstorming and suggesting
      image concepts. Its direct use in creating figures or artwork should be limited to demonstrations
      of its capabilities in specific contexts, such as academic articles.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: This caution is due to potential copyright issues associated with using images from the internet
      without proper attribution.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: Images that duplicate or refer to existing copyrighted images, real people, or others’ identifiable
      products or brands must not be generated, nor any likeness of an individual’s voice.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: for the use of AI tools we require a disclosure statement upon submission.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: Authors should disclose the use of AI tools for manuscript preparation in a separate AI declaration
      statement at the end of their manuscript upon submission and this statement will appear in the published
      work.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: Use of AI-assisted tools and generative AI is not allowed for the World Report and Perspectives
      sections.
    quote_provenance: raw_bytes
