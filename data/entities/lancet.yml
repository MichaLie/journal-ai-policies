notes: 'The Lancet''s Information for Authors (August 2026) gives general AI rules written for authors
  preparing a manuscript for an Elsevier journal, plus rules for named sections of The Lancet. AI use is
  not allowed in World Report and Perspectives; in Comments and Correspondence, AI may help only with
  grammar and spelling, must not be used to translate at submission, and a breach leads to rejection.
  Other AI use is declared in a separate statement at the end of the manuscript, editors may decide
  whether the use is appropriate, and AI tools should not be listed or cited as authors. Authors should
  also check an AI tool''s terms so that the tool gets only the right to provide the service to them,
  with no right to train on their material.'
