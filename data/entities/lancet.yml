policies:
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - dedicated_section
  rationale: accountability
  conditions: AI tools may support authors but must not substitute for their critical thinking, expertise
    and evaluation. AI tools should always be applied with human oversight and control. Authors are responsible
    and accountable for the contents of their work, including editing and adapting all material thoroughly
    so the manuscript represents their own original contribution and reflects their own analysis, interpretation,
    insights and ideas. Authors must check the terms and conditions of any AI tool to keep their data
    and inputs, including unpublished manuscripts, private and confidential. Use is declared in a separate
    AI declaration statement at the end of the manuscript, published with the work. No AI use is allowed
    in World Report and Perspectives. In Comments and Correspondence, AI must not be used to translate
    at submission, improve arguments, generate, reorder, shorten or summarise content, alter meaning,
    or generate, complete or verify references; a breach leads to rejection. For Comments linked to Research
    Articles, no confidential unpublished data relating to that Article should be input into any AI-assisted
    tool. The source describes Comments, Correspondence, World Report and Perspectives as spaces for human
    interpretation of science and medicine.
  evidence:
  - source: info-for-authors
    quote: Authors preparing a manuscript for an Elsevier journal can use AI tools to support them. However,
      these tools must never be used as a substitute for human critical thinking, expertise, and evaluation.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: AI tools should always be applied with human oversight and control.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: Ultimately, authors are responsible and accountable for the contents of their work.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: 'This includes accountability for:'
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: Editing and adapting all material thoroughly to ensure the manuscript represents the author’s
      authentic and original contribution and reflects their own analysis, interpretation, insights, and
      ideas.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: Authors must check the terms and conditions of any AI tool that they use to ensure that the
      privacy and confidentiality of their data and inputs, including their unpublished manuscripts, is
      maintained.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: Authors should disclose the use of AI tools for manuscript preparation in a separate AI declaration
      statement at the end of their manuscript upon submission and this statement will appear in the published
      work.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: Comments, Correspondence, World Report, and Perspectives are spaces in The Lancet for human
      interpretation of science and medicine.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: Use of AI-assisted tools and generative AI is not allowed for the World Report and Perspectives
      sections.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: 'AI-assisted tools must not be used to: translate Comments or Correspondence at the submission
      stage, in whole or in part; improve arguments; generate new content or sentences; reorder content;
      shorten or summarise content; alter'
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: meaning; or generate, complete, or verify references or citations.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: For Comments linked to Research Articles, no confidential unpublished data relating to the
      Article you are commenting on should be input into any AI-assisted tool.
    quote_provenance: raw_bytes
  - source: info-for-authors
    quote: Any breach of this policy will lead to rejection of your Comment or Correspondence.
    quote_provenance: raw_bytes
