policies:
- axis: language_refinement
  permission: permitted
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: unstated
  conditions: In writing, AI should only be used to improve readability and language. Language editing
    must be declared. Use is disclosed in the manuscript, and a statement is required in the published work.
  evidence:
  - source: ai-policy
    quote: Where used in the writing process, these technologies should only be used to improve readability
      and language of the work.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Use of AI in language editing must be declared.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Authors must disclose in the manuscript their use and a statement will be required in the published
      work.
    quote_provenance: raw_bytes
- axis: writing_drafting
  permission: discouraged
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: In writing, AI should only be used to improve readability and language. The work as a whole
    must not be primarily the result of the tool's generative capabilities. Use is disclosed in the
    manuscript. The published statement should give detail of which elements were generated by AI. Authors
    are responsible for all computer-generated material. Editors and reviewers judge whether the use is
    appropriate. From 3 February 2025, Biology Letters asks authors who use AI to mention in their AI
    statement all sections of the manuscript created, edited or influenced by AI.
  evidence:
  - source: ai-policy
    quote: Where used in the writing process, these technologies should only be used to improve readability
      and language of the work.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: The resulting work in its totality must be an accurate representation of the authors’ underlying
      work and novel intellectual contributions and is not primarily the result of the tool’s generative
      capabilities
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Editors and reviewers will judge if its use is appropriate.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Authors must disclose in the manuscript their use and a statement will be required in the published
      work.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: The statement should provide detail of which elements of the work were generated by AI and AI-assisted
      technologies.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: the authors accept responsibility for the veracity and correctness of all material in their
      work, including any computer-generated material
    quote_provenance: raw_bytes
  - source: biology-letters-announcement
    quote: As of 3 February 2025, we will be asking authors who use AI to provide in their AI statement;
    quote_provenance: raw_bytes
  - source: biology-letters-announcement
    quote: details of which elements of the work were generated by AI and AI-assisted technologies (specifically
      mentioning all sections of the manuscript created/edited/influenced by AI)
    quote_provenance: raw_bytes
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: Named legitimate uses are AI as a search engine to find suitable code or statistical techniques,
    and prediction of 3D protein structures. AI must not replace producing scientific insights, analysing
    and interpreting data, or drawing scientific conclusions. All AI use is disclosed in the manuscript.
    Editors and reviewers judge whether the use is appropriate. Authors accept responsibility for the
    veracity and correctness of all material, including any computer-generated material.
  evidence:
  - source: ai-policy
    quote: Editors and reviewers will judge if its use is appropriate.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: They may be used as a ‘search engine’ eg, to aid identification of suitable code or statistical
      techniques.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Use of AI to predict 3D protein structures is another example of legitimate use.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: They must not replace key researcher tasks such as producing scientific insights, analysing
      and interpreting data or drawing scientific conclusions.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Authors must disclose in the manuscript their use and a statement will be required in the published
      work.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: the authors accept responsibility for the veracity and correctness of all material in their
      work, including any computer-generated material
    quote_provenance: raw_bytes
