    quote_provenance: raw_bytes
- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: Editors and reviewers judge whether AI use is appropriate. Published articles in which AI
    use is discovered later may be retracted. At Biology Letters, the editorial office reviews AI statements
    and supplementary material and notifies authors if something is absent or needs more detail. The Editorial
    Board is consulted where needed, and manuscripts may be rejected if information is missing without suitable
    explanation. The stated AI-specific elements are consequences (retraction of published articles;
    rejection at Biology Letters) and author contact (Biology Letters notifies authors). No appeal route
    is stated.
  evidence:
  - source: ai-policy
    quote: Editors and reviewers will judge if its use is appropriate.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Published articles in which the use of such technologies is subsequently discovered may be retracted.
    quote_provenance: raw_bytes
  - source: biology-letters-announcement
    quote: The Biology Letters editorial office will be reviewing AI statements and supplementary material
      and will notify authors if something is absent or requires more detail.
    quote_provenance: raw_bytes
  - source: biology-letters-announcement
    quote: The Editorial Board will also be consulted where needed, and manuscripts may be rejected if information
      is missing without suitable explanation.
    quote_provenance: raw_bytes
- axis: audit_trail
