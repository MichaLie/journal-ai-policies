policy_architecture: prose
notes: 'Policy for all Royal Society journals. All AI use must be disclosed, the published work states
  which elements were AI-generated, AI must not be listed or cited as an author, and published articles
  in which AI use is discovered later may be retracted. Journals can ask for more. The policy says:
  "Journals reserve the right to ask authors who use AI for their corresponding prompts and outputs,
  which can be supplied as ESM files." Biology Letters announced that from 3 February 2025 it would ask
  authors who use AI for the tool name, version and date of use in their AI statement, with prompts and
  outputs as clearly labelled supplementary files.'
