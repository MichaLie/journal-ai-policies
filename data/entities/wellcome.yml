id: wellcome
name: Wellcome
type: funder
parent: null
platform: null
policy_owner: wellcome
delegates_to_journal: false
policy_architecture: rule_with_exemptions
notes: Policy on generative AI in Wellcome's grant application process, last updated 8 April 2026. It
  covers applicants and their organisations, expert reviewers and advisory committee members, and
  Wellcome's own use.
