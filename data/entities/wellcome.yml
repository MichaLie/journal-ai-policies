- id: ai-guidance
  url: https://wellcome.org/research-funding/guidance/policies-grant-conditions/use-of-generative-ai
  role: policy
  audience: all
  status: current
  authoritative: true
  fetch_method: http
  date_source: stated
  stated_date: '2026-04-08'
