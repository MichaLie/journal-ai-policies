- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: 'A trigger and consequence are stated for peer reviewers: if AIPP has reasonable grounds
    to believe AI was used to generate or perform peer review in violation of the policy, it may stop
    inviting that reviewer and seek a replacement review. Notification of the reviewer and a route of
    appeal are not stated. For authors, the author section says the journal may request the original images
    or data during review if there are concerns about their validity, and authors are expected to keep
    the original files and provide them if requested; these sentences follow the rule on generative AI
    and original data and images but do not themselves mention AI. Use of AI-generated references that
    do not exist is called a breach of publication ethics, with no consequence stated. No route of appeal
    is stated for authors.'
  evidence:
  - source: ai-policy
    quote: If AIPP has reasonable grounds to believe that AI was used to generate or perform peer review
      in violation of this policy, we may stop inviting that reviewer in the future and seek a replacement
      review.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: During the review process, the journal may request the original images or data if there are
      concerns about their validity.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Authors are expected to maintain the original image and data files during the submission and
      publishing process and provide them if requested.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Any use of AI-generated references or citations that do not exist in real sources is a breach
      of publication ethics.
    quote_provenance: browser_dom
