notes: AIP Publishing's AI policy covers authors, editors and reviewers, and says AI tools cannot be a coauthor.
  Using AI only to improve readability needs no disclosure, but uses that could affect findings or conclusions
  must be described in the Methods section. Editors and reviewers may not upload any part of a manuscript
  or review report into an AI tool that the publisher has not provided or authorised. Authors are advised
  to check a tool's terms, including how the provider may keep, reuse or redistribute uploaded or generated
  content; the page does not mention training AI models on authors' content.
