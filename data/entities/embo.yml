notes: EMBO Press sets its own AI rules for authors, published on its Springer Nature Link partner page.
  AI use should be mainly limited to improving the style, accessibility or quality of human-generated
  text and images, and any use must be disclosed in the published article, naming the parts affected and
  the tools. AI may be used to collect and analyse data if this is documented in the Methods section.
