id: mdpi
name: MDPI
type: publisher
parent: null
platform: null
policy_owner: mdpi
delegates_to_journal: true
policy_architecture: rule_with_exemptions
homepage: null
notes: 'Covers authors, reviewers and Academic Editors. Authors declare all AI use in the cover letter
  and in an Acknowledgments statement, apart from text editing such as grammar and spelling, and AI
  tools cannot be listed as authors. Reviewers may use AI only for limited language editing, which they
  disclose, and Academic Editors must not use generative AI during editorial review or decision-making.
  Journals decide one point themselves: “The inclusion of AI-generated images for purposes other than
  data visualization is at the discretion of the journal’s Editorial Board.” Authors must not agree to
  an AI tool re-using their uploaded material for training unless safeguards for copyright,
  confidentiality and privacy are in place.'
sources:
- id: ai-policy
  url: https://www.mdpi.com/ethics
  role: policy
  audience: all
  status: current
  authoritative: true
  fetch_method: browser
  date_source: none
  last_verified: '2026-11-20'
  content_sha256: null
