policy_architecture: rule_with_exemptions
homepage: null
notes: IOP Publishing's generative AI policy covers authors in IOP Publishing-owned journals and in the
  partner journals listed on the page; other partner journals follow the partners' own ethical policies.
  Authors must not upload reviewer reports to GenAI tools or use them to generate responses to reviewers,
  though they may use them to improve the language of their responses; hiding prompts for GenAI tools
  in a manuscript to manipulate peer review results in immediate rejection. Reviewers are pointed to separate
  ethical policies for reviewers, which were not reviewed here. A separate text and data mining policy
  says that, unless a licence or separate written agreement permits it, access to the publications gives
  no right to build embeddings, vector databases, retrieval or RAG systems or agentic systems from them,
  and that access through APIs, MCP servers or connectors, automated agents or other machine-to-machine
  methods needs a separate written agreement.
