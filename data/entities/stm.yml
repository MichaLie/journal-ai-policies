policy_owner: stm
delegates_to_journal: false
policy_architecture: classification_only
homepage: https://stm-assoc.org
notes: STM's September 2025 classification defines nine kinds of AI use in manuscript preparation, and
  this site uses them as its list of activities. It is advisory and leaves policy decisions to publishers;
  it carries two recommendations over from the 2023 STM Guidelines. Where it is unclear whether a tool
  counts as AI, it recommends encouraging authors to declare the tools they used and how. It also recommends
  that publishers state the level of disclosure they require, such as particular tools or the exact prompts
  used with generative AI tools.
