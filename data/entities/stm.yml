policies:
- axis: research_process_ai
  permission: not_addressed
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: 'Excluded BY CONSTRUCTION, not by oversight. The field''s only shared taxonomy draws its
    boundary to exclude exactly the workflows that now produce results.

    '
  evidence:
  - source: classification-2025
    quote: This classification addresses only the use of AI assistance for the preparation of manuscripts
      intended for publication
    quote_provenance: raw_bytes
    evidence_role: documents_absence
  - source: classification-2025
    quote: Classify uses of AI in research processes.
    quote_provenance: raw_bytes
    evidence_role: documents_absence
- axis: language_refinement
  permission: permitted
  disclosure: not_required
  disclosure_location: []
  rationale: unstated
  conditions: One of only two of the nine activities carrying an inherited permission level.
  evidence:
  - source: classification-2025
    quote: 2023 STM Guidelines recommend that disclosure is not necessary for this use of automated
      tools.
    quote_provenance: raw_bytes
- axis: passing_off
  permission: prohibited
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  evidence:
  - source: classification-2025
    quote: 2023 STM Guidelines recommend prohibiting this use of AI tools.
    quote_provenance: raw_bytes
- axis: code_presentation
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: 'In scope: tidying code you report. Explicitly OUT of scope: generating new code for use
    in the research itself, or altering its functionality.'
  evidence:
  - source: classification-2025
    quote: Using AI tools to improve the readability and clarity of code submitted as part of the manuscript
      or any associated materials
    quote_provenance: raw_bytes
    evidence_role: supports
- axis: reference_gathering
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: quality
  evidence:
  - source: classification-2025
    quote: Using AI tools to find and identify articles that are likely to be related to the research
      reported in the manuscript
    quote_provenance: raw_bytes
    evidence_role: supports
  conditions: 'In scope: finding candidate references. Explicitly OUT of scope: generating plausible-sounding
    references that do not exist.'
coherence: []
