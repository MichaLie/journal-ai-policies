id: stm
name: STM Association
type: normative_body
parent: null
platform: null
policy_owner: stm
delegates_to_journal: false
policy_architecture: classification_only
homepage: https://stm-assoc.org
notes: 'Author of the nine-activity classification that is this observatory''s comparison axis. Written
  by staff from Springer Nature (x2), Elsevier, Wiley, Taylor & Francis, CUP, BMJ, ACS and IEEE — then
  explicitly declining to harmonise the answers. The 2026 divergence is the designed output of the field''s
  only coordination mechanism. COPE Council now defers to it.

  '
sources:
- id: classification-2025
  url: https://s3.eu-west-2.amazonaws.com/stm.offloadmedia/wp-content/uploads/2025/04/23020709/STM_AI_Classification_Recs_19_Sept2025-1.pdf
  role: guidance
  audience: all
  status: current
  authoritative: true
  fetch_method: http
  date_source: stated
  stated_date: 2025-09
  last_verified: '2026-08-21'
  content_sha256: 5dd3f74ed8d9347cc13249ebf943af2586fb7234e9b2c25ccd30f44e0a81bd8c
