policies:
- axis: research_process_ai
  permission: not_addressed
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: Research-process AI is explicitly outside this manuscript-preparation classification.
  evidence:
  - source: classification-2025
    quote: This classification addresses only the use of AI assistance for the preparation of manuscripts
      intended for publication
    quote_provenance: raw_bytes
    evidence_role: documents_absence
  - source: classification-2025
    quote: We reiterate that use of AI in other stages of research processes is outside the scope of
      this classification.
    quote_provenance: raw_bytes
    evidence_role: documents_absence
- axis: language_refinement
  permission: not_addressed
  disclosure: not_required
  disclosure_location: []
  rationale: unstated
  conditions: The classification makes no recommendation on whether this activity is permitted. It marks
    the activity with a 2023 STM Guidelines recommendation that disclosure is not necessary. Policy decisions
    remain with publishers.
  evidence:
  - source: classification-2025
    quote: Refinement, correction, editing or formatting the manuscript to improve clarity of language (**)
    quote_provenance: raw_bytes
    evidence_role: documents_absence
  - source: classification-2025
    quote: 2023 STM Guidelines recommend that disclosure is not necessary for this use of automated tools.
    quote_provenance: raw_bytes
    evidence_role: documents_absence
  - source: classification-2025
    quote: 'Recommend or harmonise publisher policies around any use and/or declaration of the use of
      AI. This classification explicitly does not aim to:'
    quote_provenance: raw_bytes
    evidence_role: documents_absence
  - source: classification-2025
    quote: However, actual policy decisions about what is permitted or expected to be declared – to what
      level of detail, how, and where – remain the responsibility of publishers
    quote_provenance: raw_bytes
    evidence_role: documents_absence
