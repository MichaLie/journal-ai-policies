notes: 'ICMJE''s recommendations have separate pages on AI use by authors, reviewers and editors (Section
  V, Use of Artificial Intelligence in Publishing). Section II.A.4 says: "Authors should not list AI and
  AI-assisted technologies as an author or co-author, nor cite AI as an author." Section IV.A on references
  says: "Referencing AI-generated material as the primary source is not acceptable." The pages give no
  revision date.'
