policies:
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - cover_letter
  - acknowledgements
  - methods
  rationale: accountability
  conditions: Disclosure duty at submission, in the cover letter AND in the work itself.
  evidence:
  - source: authors-contributors
    quote: Authors who use such technology should describe, in both the cover letter and the submitted
      work in the appropriate section if applicable, how they used it.
    quote_provenance: raw_bytes
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: reproducibility
  conditions: 'The tool-and-version instruction already exists here. But the required fields are dimensioned
    for a citation, not a trace — adequate for a paragraph, meaningless for forty tool calls. The document
    contains zero occurrences of agent, agentic or autonomous, against four of "chatbot", under a Section
    V titled "Use of AI in Publishing".

    '
  evidence:
  - source: preparing-submission
    quote: including the tool used, version, and prompts where applicable.
    quote_provenance: raw_bytes
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: 'Section V.C. The first obligation anywhere on journals to disclose their own AI use —
    which converts the author/publisher asymmetry from an ethical complaint into a measurable compliance
    gap.

    '
  evidence:
  - source: ai-editors
    quote: Journals should have a policy for the use of AI in the review process and should make all
      editors, reviewers, and authors aware of this journal policy.
    quote_provenance: raw_bytes
- axis: due_process
  permission: not_addressed
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: 'No threshold for triggering review, no duty to notify the author, and no route of appeal
    is stated. The quote records what is granted instead: editorial discretion.'
  evidence:
  - source: ai-editors
    quote: Editors should be vigilant that authors may not disclose AI use when queried.
    quote_provenance: raw_bytes
    evidence_role: documents_absence
  - source: ai-authors
    quote: Nondisclosure of AI use may require corrective action and may be construed as misconduct
      in some circumstances
    quote_provenance: raw_bytes
    evidence_role: documents_absence
coherence: []
metadata_inconsistency:
- summary: The HTML title tag reads 'January 2025' while the URL and page body both say January 2026.
    Harmless to a reader; it will mislead an automated scraper.
  sources:
