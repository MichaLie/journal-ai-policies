policies:
- axis: language_refinement
  permission: permitted
  disclosure: required
  disclosure_location:
  - cover_letter
  rationale: unstated
  conditions: Spell-checking and grammar correction are generally viewed as acceptable. Journals should
    require authors to disclose AI use at submission. Authors describe the use in the cover letter and,
    if applicable, in the appropriate section of the submitted work. In all use cases, authors check the
    accuracy and validity of their content before submission. AI writing assistance is reported in the acknowledgment
    section; the guidance does not say whether spell-checking or grammar correction counts as writing assistance.
  evidence:
  - source: ai-editors
    quote: For example, using AI to spell-check and correct grammar is generally viewed as acceptable
      whereas using AI for content generation must be considered in the context of the work.
    quote_provenance: raw_bytes
  - source: ai-editors
    quote: Nonetheless, editors should query authors and authors should disclose if and how LLM and AI
      were used.
    quote_provenance: raw_bytes
  - source: ai-editors
    quote: "In all use cases, authors should check the accu\x02racy and validity of their content before\
      \ submission."
    quote_provenance: raw_bytes
  - source: ai-authors
    quote: the journal should require authors to disclose at submission whether they used AI-assisted
      technologies
    quote_provenance: raw_bytes
  - source: ai-authors
    quote: Authors who use such technology should describe, in both the cover letter and the submitted
      work in the appropriate section if applicable, how they used it
    quote_provenance: raw_bytes
  - source: authors-contributors
    quote: Use of AI for writing assistance should be reported in the acknowledgment section (see also
      Section V).
    quote_provenance: raw_bytes
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - cover_letter
  - acknowledgements
  rationale: accountability
  conditions: Describe the use in the cover letter and in the submitted work. Writing assistance is described
    in the acknowledgment section. Content generation is considered in the context of the work, and authors
    review and edit the output. Humans are responsible for any submitted material that used AI-assisted
    technologies.
  evidence:
  - source: ai-authors
    quote: Authors who use such technology should describe, in both the cover letter and the submitted
      work in the appropriate section if applicable, how they used it
    quote_provenance: raw_bytes
  - source: authors-contributors
    quote: For example, if AI was used for writing assistance, describe this in the acknowledgment section
      (see Section II.A.3).
    quote_provenance: raw_bytes
  - source: ai-authors
    quote: Authors should carefully review and edit the AI-generated content as the output can be incorrect,
      incomplete, or biased.
    quote_provenance: raw_bytes
  - source: ai-editors
    quote: using AI for content generation must be considered in the context of the work
    quote_provenance: raw_bytes
  - source: authors-contributors
    quote: Therefore, humans are responsible for any submitted material that included the use of AI-assisted
      technologies.
    quote_provenance: raw_bytes
- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - cover_letter
  - methods
  rationale: unstated
  conditions: AI used for figure generation is described in the methods and in the cover letter. Authors
    should be able to assert that images produced by AI contain no plagiarism.
  evidence:
  - source: authors-contributors
    quote: If AI was used for data collection, analysis, or figure generation, authors should describe
      this use in the methods (see Section IV.A.3.d).
    quote_provenance: raw_bytes
  - source: ai-authors
    quote: Authors should be able to assert that there is no plagiarism in their paper, including in text
      and images produced by the AI.
    quote_provenance: raw_bytes
  - source: ai-authors
    quote: Authors who use such technology should describe, in both the cover letter and the submitted
      work in the appropriate section if applicable, how they used it
    quote_provenance: raw_bytes
- axis: data_visualisation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - cover_letter
  - methods
  rationale: unstated
  conditions: AI used for figure generation is described in the methods and in the cover letter.
  evidence:
  - source: authors-contributors
    quote: If AI was used for data collection, analysis, or figure generation, authors should describe
      this use in the methods (see Section IV.A.3.d).
    quote_provenance: raw_bytes
  - source: ai-authors
    quote: Authors who use such technology should describe, in both the cover letter and the submitted
      work in the appropriate section if applicable, how they used it
    quote_provenance: raw_bytes
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - cover_letter
  - methods
  rationale: reproducibility
  conditions: Describe the use in the methods in enough detail to replicate the approach, including the
    tool, version and prompts where applicable. The cover-letter disclosure applies as well.
  evidence:
  - source: preparing-submission
    quote: Authors who used AI technology to conduct the study should describe its use in the methods section
      in sufficient detail to enable replication of the approach.
    quote_provenance: raw_bytes
  - source: preparing-submission
    quote: including the tool used, version, and prompts where applicable.
    quote_provenance: raw_bytes
  - source: authors-contributors
    quote: If AI was used for data collection, analysis, or figure generation, authors should describe
      this use in the methods (see Section IV.A.3.d).
    quote_provenance: raw_bytes
  - source: ai-authors
    quote: Authors who use such technology should describe, in both the cover letter and the submitted
      work in the appropriate section if applicable, how they used it
    quote_provenance: raw_bytes
- axis: audit_trail
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: reproducibility
  conditions: Authors who used AI to conduct the study describe its use in the methods in enough detail
    to enable replication, including the tool, version and prompts where applicable. The recommendations
    say nothing about keeping session records.
  evidence:
  - source: preparing-submission
    quote: Authors who used AI technology to conduct the study should describe its use in the methods
      section in sufficient detail to enable replication of the approach.
    quote_provenance: raw_bytes
  - source: preparing-submission
    quote: including the tool used, version, and prompts where applicable.
    quote_provenance: raw_bytes
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: confidentiality
  conditions: Editors and reviewers should not upload submitted manuscripts into AI systems where confidentiality
    cannot be assured without the authors' explicit permission. Journals should remind editors and reviewers
    that submitted manuscripts are privileged communications and that such uploading is prohibited except
    with authors' permission. Journals that use AI for copy-editing and other production purposes disclose
    this in their information to authors. Editors are responsible for the accuracy and validity of ancillary
    content the journal produces with AI, such as podcasts, educational questions and patient summaries.
    The recommendations describe no particular AI systems or tools used by journals.
  evidence:
  - source: ai-editors
    quote: Editors and reviewers should not upload submitted manuscripts into AI systems where confidentiality
      cannot be assured without authors’ explicit permission.
    quote_provenance: raw_bytes
  - source: ai-editors
    quote: "Journals should remind editors and reviewers that manuscripts submitted to journals are privileged\
      \ communications and that uploading of the manuscript to software or other AI tech\x02nologies where\
      \ confidentiality cannot be assured is pro\x02hibited except with authors’ permission."
    quote_provenance: raw_bytes
  - source: ai-editors
    quote: "If journals use AI for copy-editing and other produc\x02tion purposes, they should disclose\
      \ this in their informa\x02tion to authors."
    quote_provenance: raw_bytes
  - source: ai-editors
    quote: Journals may also be using AI/LLM for ancillary content (e.g., podcasts, educational questions,
      patient summaries).
    quote_provenance: raw_bytes
  - source: ai-editors
    quote: Editors are responsible for ensuring the accuracy and validity of this content.
    quote_provenance: raw_bytes
- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: A consequence and contact with the author are stated. Nondisclosure of AI use may require
    corrective action and may be construed as misconduct in some circumstances, with a reference to Sections
    III.A and III.B. Editors should query authors about whether and how AI was used, and should be vigilant
    that authors may not disclose AI use when queried. No threshold for review and no route of appeal are
    stated. Sections III.A and III.B were not reviewed here.
  evidence:
  - source: ai-authors
    quote: "Nondisclosure of AI use may require corrective action and may be construed as misconduct in\
      \ some cir\x02cumstances (see Sections III.A and III.B)."
    quote_provenance: raw_bytes
  - source: ai-editors
    quote: Nonetheless, editors should query authors and authors should disclose if and how LLM and AI
      were used.
    quote_provenance: raw_bytes
  - source: ai-editors
    quote: Editors should be vigilant that authors may not disclose AI use when queried.
    quote_provenance: raw_bytes
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: confidentiality
  conditions: Journals should have a policy for AI use in the review process and make editors, reviewers
    and authors aware of it. Reviewers follow the journal's AI policy or ask the journal's permission
    first. Keeping the manuscript confidential may prohibit uploading it to AI tools where confidentiality
    cannot be assured, unless the journal explicitly permits such use. The editors' page says editors
    and reviewers should not upload submitted manuscripts into such AI systems without the authors' explicit
    permission. Disclose use to the journal and check the output.
  evidence:
  - source: ai-editors
    quote: Journals should have a policy for the use of AI in the review process and should make all editors,
      reviewers, and authors aware of this journal policy.
    quote_provenance: raw_bytes
  - source: ai-reviewers
    quote: Reviewers must adhere to the journal’s stated policy on the use of AI or request permission
      from the journal prior to using AI technology to facilitate their review.
    quote_provenance: raw_bytes
  - source: ai-reviewers
    quote: reviewers must maintain the confidentiality of the manuscript, which may prohibit the uploading
      of the manuscript to software or other AI
    quote_provenance: raw_bytes
  - source: ai-reviewers
    quote: where confidentiality cannot be assured unless such use of AI is explicitly permitted by journals.
    quote_provenance: raw_bytes
  - source: ai-editors
    quote: Editors and reviewers should not upload submitted manuscripts into AI systems where confidentiality
      cannot be assured without authors’ explicit permission.
    quote_provenance: raw_bytes
  - source: ai-reviewers
    quote: Reviewers who use AI in their review should disclose its use to the journal and ensure the content
      is appropriate and valid
    quote_provenance: raw_bytes
coherence:
- axis: reviewer_use
  sources:
  - ai-reviewers
  - ai-editors
  summary: 'The reviewer page lets the journal authorise uploading a manuscript to AI where confidentiality
    cannot be assured ("unless such use of AI is explicitly permitted by journals"). The editor page says
    the same upload "is prohibited except with authors’ permission". The two pages name different parties
    who can authorise it.'
metadata_inconsistency:
- summary: 'The three Section V pages carry the HTML title tag of Section IV.A: ''ICMJE | Recommendations
    | Preparing a Manuscript for Submission to a Medical Journal''.'
  sources:
  - ai-authors
  - ai-editors
  - ai-reviewers
