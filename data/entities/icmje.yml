policy_architecture: prose
homepage: https://www.icmje.org
notes: 'Updated January 2026 with a whole new Section V. Files AI structurally INSIDE contributorship
  (II.A.4, directly after Non-Author Contributors) and NOT under conflicts of interest — which refutes
  the naive claim that guidance treats AI use as a competing interest. Section V.C is the first text
  anywhere obliging journals to disclose their own AI use.

  '
