policy_owner: elife
delegates_to_journal: false
policy_architecture: prose
homepage: https://elifesciences.org
notes: 'The natural experiment. The only organisation recorded here that permits reviewers to use AI
  — because its reviewed-preprint model means the manuscript is already public, so the confidentiality
  reason other publishers give does not apply. Remove that reason and the ban has nothing to stand on:
  the rationale, not the technology, is doing the work. Disclosure is nonetheless required. eLife is
  also the only organisation here addressing editors using AI to find reviewers.'
