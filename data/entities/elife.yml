policies:
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: Use is not prevented. Reviewers remain accountable for their reviews and must disclose any
    use of generative AI.
  evidence:
  - source: review-process-ai
    quote: While we do not prevent the use of generative artificial intelligence tools within the review
      process, editors and reviewers remain accountable for their contributions and the contents of their
      reviews. If generative AI tools are used by editors or reviewers, this must be disclosed.
    quote_provenance: raw_bytes
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: Use of generative AI within the review process is not prevented. Editors remain accountable
    for their contributions and must disclose any use of generative AI. Where it is used to suggest potential
    reviewers, the usual due diligence is expected to ensure those reviewers can contribute an objective,
    high-quality public review. The reviewer guidance does not describe any AI system or tool run by eLife
    itself.
  evidence:
  - source: review-process-ai
    quote: While we do not prevent the use of generative artificial intelligence tools within the review
      process, editors and reviewers remain accountable for their contributions and the contents of their
      reviews.
    quote_provenance: raw_bytes
  - source: review-process-ai
    quote: If generative AI tools are used by editors or reviewers, this must be disclosed.
    quote_provenance: raw_bytes
  - source: review-process-ai
    quote: If generative AI is used by editors to source suggestions for potential reviewers, we expect
      the usual due diligence to ensure that potential reviewers would be able to contribute an objective,
      high-quality public review.
    quote_provenance: raw_bytes
- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: licensing
  conditions: Use of generative AI tools to generate article content must be clearly described in the
    Materials and Methods section. The author instructions state no AI rule specific to figures within
    the manuscript. AI-generated images cannot be used as the optional striking image that highlights
    the article, because striking images must be available under the Creative Commons Attribution Licence.
  evidence:
  - source: author-instructions
    quote: Generative artificial intelligence tools such as ChatGPT or AI using large language models
      to generate article content are at an essential level just tools as, for example, imaging or statistical
      software.
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: their use must be clearly described in the Materials and Methods section.
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: Authors are encouraged to provide a striking image (preferably in colour) that we can use to
      highlight the article if it is published as a Reviewed Preprint.
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: These files must be available to use under the terms of the Creative Commons Attribution Licence
      , which means that we cannot include images generated using artificial intelligence.
    quote_provenance: raw_bytes
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: accountability
  conditions: AI tools cannot be authors. Their use must be described in the Materials and Methods section.
    Authors are responsible for the proper use of AI tools and the reporting of their output.
  evidence:
  - source: author-instructions
    quote: Whilst such AI tools might be used to aid researchers and authors in doing their work, they
      cannot be listed as or serve as co-authors of a paper, and their use must be clearly described in
      the Materials and Methods section.
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: remain accountable for their contributions, responsible for the proper use of AI tools and
      the reporting of AI tool-output
    quote_provenance: raw_bytes
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: accountability
  conditions: AI tools may be used to aid researchers and authors in doing their work. The author instructions
    treat them as tools, comparable to imaging or statistical software. Their use must be clearly described
    in the Materials and Methods section. Authors are responsible for the proper use of AI tools and the
    reporting of their output.
  evidence:
  - source: author-instructions
    quote: are at an essential level just tools as, for example, imaging or statistical software.
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: Whilst such AI tools might be used to aid researchers and authors in doing their work, they
      cannot be listed as or serve as co-authors of a paper, and their use must be clearly described in
      the Materials and Methods section.
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: remain accountable for their contributions, responsible for the proper use of AI tools and
      the reporting of AI tool-output
    quote_provenance: raw_bytes
- axis: detection_screening
  permission: permitted
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: Staff check submissions against eLife's integrity policies, including its policy on use
    of artificial intelligence, with the help of tools and services. These integrity-check tools are not
    named. The only named screening tool is Crossref Similarity Check for plagiarism. No AI-text detector
    is mentioned.
  evidence:
  - source: author-instructions
    quote: Authors are required to comply with our policies intended to safeguard the integrity of the
      work, such as our policies on image acquisition and presentation, plagiarism, and use of artificial
      intelligence.
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: Staff perform quality and integrity checks on submissions in line with these policies, aided
      by a range of tools and services.
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: Manuscripts selected by eLife for peer review may be screened for plagiarism using Crossref
      Similarity Check (powered by iThenticate software).
    quote_provenance: raw_bytes
- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: 'Trigger: staff perform quality and integrity checks on submissions in line with eLife''s
    integrity policies, which include its policy on use of artificial intelligence. No threshold for review
    is stated. Author contact: the AI section expects authors to cooperate with questions about the accuracy
    or integrity of the work, and the integrity section expects them to cooperate while eLife attempts
    to resolve questions or concerns. Consequence: if issues are identified after publication, eLife will
    investigate and, where appropriate, publish a post-publication notice. Appeal: no appeal route tied
    to AI concerns is stated. The general appeals route covers decisions not to review a submission.'
  evidence:
  - source: author-instructions
    quote: Authors are required to comply with our policies intended to safeguard the integrity of the
      work, such as our policies on image acquisition and presentation, plagiarism, and use of artificial
      intelligence.
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: Staff perform quality and integrity checks on submissions in line with these policies, aided
      by a range of tools and services.
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: are expected to cooperate with questions relating to the accuracy or integrity of any part
      of the work, including data, analyses and representation.
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: Authors are expected to cooperate while we attempt to resolve questions or concerns
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: If issues are identified post-publication, the journal will investigate and where appropriate
      publish a post-publication notice to alert readers
    quote_provenance: raw_bytes
  - source: author-instructions
    quote: If we decided against reviewing your work and you wish to appeal, you should contact the editorial
      office.
    quote_provenance: raw_bytes
