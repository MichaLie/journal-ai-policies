id: elife
name: eLife
type: publisher
parent: null
platform: elifesciences.org
policy_owner: elife
delegates_to_journal: false
policy_architecture: prose
homepage: https://elifesciences.org
notes: eLife's author instructions say generative AI tools cannot be listed as or serve as co-authors,
  and their use must be clearly described in the Materials and Methods section. Separate reviewer guidance
  does not prevent editors and reviewers from using generative AI, but they must disclose any use and
  remain accountable for their contributions. AI-generated images cannot be used as an article's striking
  image, because striking images must be available under the Creative Commons Attribution Licence.
