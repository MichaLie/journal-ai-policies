id: sage
name: Sage
type: publisher
parent: null
platform: null
policy_owner: sage
delegates_to_journal: false
policy_architecture: rule_with_exemptions
homepage: null
notes: 'Sage''s policy covers authors, reviewers and editors. It sorts AI use into three kinds: assistive
  (no disclosure needed), generative (disclosure required) and prohibited. It mentions translation only
  for materials used in the research process and says nothing about translating the manuscript. A separate
  Sage page says any AI use of Sage content, including training large language models, needs lawful access
  and a licence from Sage.'
