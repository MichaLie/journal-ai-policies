policies:
- axis: language_refinement
  permission: permitted_with_conditions
  disclosure: not_required
  disclosure_location: []
  rationale: accountability
  conditions: Assistive editing of the author’s own work.
  evidence:
  - source: ai-policy
    quote: AI tools that make suggestions to improve or enhance your own work, such as tools to improve
      language, grammar, or structure, are considered assistive AI tools and do not require disclosure
      by authors or reviewers.
    quote_provenance: raw_bytes
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  - acknowledgements
  rationale: accountability
  conditions: Verify outputs and sources. Disclosing use does not authorize prohibited activities.
  evidence:
  - source: ai-policy
    quote: The primary or partial use of AI tools and/or LLMs that produce content such as references,
      text, images, or any other content that directly impacts the research methodology, analysis, results
      and/or conclusions must be disclosed upon submission so the editorial team can evaluate the content
      generated.
    quote_provenance: raw_bytes
- axis: content_licensing
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: Publisher-stated access and reuse terms. Scope depends on content, license and purpose;
    this is not a finding about author consent or the reach of legal exceptions.
  evidence:
  - source: tdm-ai
    quote: If you wish to use Sage journals content for any AI uses including generative AI you should
      request permission
    quote_provenance: raw_bytes
coherence: []
