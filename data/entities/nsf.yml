notes: 'NSF notice on generative AI in merit review, published 14 December 2023 and last updated 21 May
  2026. Reviewers may not upload proposal content or review information to non-approved generative AI
  tools. Proposers are encouraged to state in the project description whether and how they used
  generative AI.'
