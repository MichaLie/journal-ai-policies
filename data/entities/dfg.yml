    not been read here.
policies:
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - submission_field
  rationale: accountability
  conditions: Applies to reviews of funding proposals, from 16 April 2026. AI may be used only in a supporting
    role. The guideline links such use to four principles (confidentiality, transparency, quality
    assurance and responsibility). Proposal content may be processed only in systems that guarantee secure
    and purpose-specific use. All AI-generated content must be critically reviewed. Reviewers must disclose AI use. They will indicate
    it when submitting the review in the elan portal; the stated purpose is verifiability in the later
    evaluation and decision-making process. Responsibility for the review stays with the reviewer. elan
    users must actively consent to observing the guideline when they first log in. elan users must also
    give a one-off confirmation of a declaration granting the rights needed to use proposal content,
    including its processing in AI systems in accordance with the guideline.
  evidence:
  - source: ai-guidance
    quote: 'When the guideline enters into force on 16 April 2026, there will also be technical adjustments
      to the elan portal (the DFG’s proposal processing system).'
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: 'The guideline allows the use of AI systems in the review process exclusively in a supporting
      role, linking such use to four central principles: confidentiality, transparency, quality assurance
      and responsibility.'
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: The obligation to maintain confidentiality means that proposal content may only be processed
      in systems that guarantee secure and purpose-specific use.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: The principle of transparency requires reviewers to disclose the use of AI.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Quality assurance requires the critical review of all AI-generated content.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Furthermore, when submitting their review in the elan portal, reviewers will in future be required
      to indicate whether they used an AI system when preparing the review.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: This disclosure serves to ensure verifiability in the subsequent evaluation and decision-making
      process.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Responsibility for the content of the review remains fully with the reviewer.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: From 16 April 2026 onwards, when elan users log in for the first time, they will be required
      to actively consent to observing the guideline and meeting other legal conditions in the event of
      AI use.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: 'In addition, elan users will have to provide one-off confirmation of a declaration granting
      the necessary rights to the use of proposal content, thereby ensuring legally secure processing –
      including permissible processing in AI systems in accordance with the guideline.'
    quote_provenance: raw_bytes
