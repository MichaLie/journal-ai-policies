policy_architecture: rule_with_exemptions
notes: DFG's rules cover reviewers of funding proposals and apply from 16 April 2026. AI may be used only
  in a supporting role, proposal content may be processed only in systems that guarantee secure and purpose-specific
  use, and reviewers must disclose AI use. This summary is based on DFG's announcement of 12 March 2026
  (Information for Researchers, No. 18); the full Guideline on the Use of Artificial Intelligence in the
  Review Process is linked from it and has not been read here. The announcement does not mention AI training.
sources:
- id: ai-guidance
  url: https://www.dfg.de/en/news/news-topics/announcements-proposals/2026/ifr-26-18
  role: announcement
  audience: reviewers
  status: current
  authoritative: true
  fetch_method: http
  date_source: stated
  stated_date: '2026-03-12'
