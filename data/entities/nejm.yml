notes: 'Editorial policy of the New England Journal of Medicine, whose AI rules for authors follow
  ICMJE. Authors disclose AI use at submission, AI tools cannot be listed as authors, and citing
  AI-generated material as a primary source is not acceptable. On its own use, NEJM says human editors
  make all editorial decisions, and NEJM Group offers reader features such as the AI Companion and
  licenses content so that its evidence reaches the tools clinicians and patients use; these passages do
  not mention AI training or author consent. The AI sections do not say whether other NEJM Group titles
  follow the policy.'
