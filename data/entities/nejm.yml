policies:
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - cover_letter
  - unspecified
  rationale: accountability
  conditions: Authors disclose at submission whether AI-assisted technologies were used to produce the
    work. The cover letter and the submitted work both describe the technologies used and what they produced.
    AI tools cannot be listed as authors, because authors are responsible for the accuracy, integrity and
    originality of the work. Authors review and edit all AI-produced material and must be able to assert
    that it contains no plagiarism. All quoted material must be properly attributed, with full citations.
    Citing AI-generated material as a primary source is not acceptable.
  evidence:
  - source: editorial-policies
    quote: Authors must disclose at submission of the manuscript whether AI-assisted technologies (such
      as large language models, chatbots, or image creators) were used to produce the submitted work.
    quote_provenance: browser_dom
  - source: editorial-policies
    quote: If so, both the cover letter and the submitted work should include a description of the technologies
      used and what was produced.
    quote_provenance: browser_dom
  - source: editorial-policies
    quote: Because the authors of a manuscript are responsible for the accuracy, integrity, and originality
      of the work, chatbots or other AI-assisted technologies cannot be listed as authors.
    quote_provenance: browser_dom
  - source: editorial-policies
    quote: Authors must carefully review and edit all materials produced with AI, to prevent the submission
      of authoritative-sounding output that is incorrect, incomplete, or biased.
    quote_provenance: browser_dom
  - source: editorial-policies
    quote: Authors must be able to assert that there is no plagiarism of text or images in materials produced
      by AI.
    quote_provenance: browser_dom
  - source: editorial-policies
    quote: Authors must ensure that all quoted material is properly attributed, including full citations.
    quote_provenance: browser_dom
  - source: editorial-policies
    quote: Citation of AI-generated material as a primary source is not acceptable.
    quote_provenance: browser_dom
