policies:
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - review_report
  rationale: accountability
  conditions: At their discretion, reviewers and editors may use AI tools for technical checks such as
    examining proofs, verifying references and checking internal consistency. They must critically evaluate
    any AI-assisted findings, and their assessments of novelty, importance, scientific interest and quality
    of exposition must rest on their own expertise. Reviewers remain responsible for their reports and
    recommendations. Reviewers and editors must maintain the confidentiality of the review process and
    comply with applicable legal obligations. Manuscript material may be shared only with secure or institutionally
    approved AI tools whose settings prohibit training on it. Review reports and confidential editorial
    correspondence must not be disclosed to external AI services. Reviewers name the tools and purposes
    in their confidential comments to the editors.
  evidence:
  - source: ai-guidance
    quote: Bernoulli allows reviewers and editors to use AI tools to assist in checking technical claims,
      subject to the confidentiality and data-protection safeguards specified below.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: At their discretion, reviewers and editors may use AI tools to assist with technical checks,
      such as examining proofs, verifying references, and checking internal consistency, subject to the
      confidentiality and data-protection safeguards specified below.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: However, they must critically evaluate any AI-assisted findings, and their assessments of novelty,
      importance, scientific interest, and quality of exposition must be grounded in their own expertise.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Reviewers remain responsible for the writing of their review reports and making recommendations,
      while editors remain responsible for editorial decisions and for maintaining the integrity and quality
      of the review process.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Reviewers must specify, in their confidential comments to the editors, which AI tools they
      used and for what purposes.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Reviewers and editors must maintain the confidentiality of the review process and comply with
      applicable legal obligations when using AI tools.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Any manuscript material may be shared only with secure or institutionally approved AI tools
      whose data-control settings adequately prohibit the use of manuscript content for model training.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Confidential editorial correspondence and review reports must not be disclosed to external
      AI services.
    quote_provenance: raw_bytes
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - acknowledgements
  rationale: accountability
  conditions: Authors remain fully responsible for their submissions. They must verify any AI-assisted
    material, fully understand the work they submit and keep their manuscripts comprehensible to human
    readers. The acknowledgments statement should explain whether and how AI tools were used in proof
    development, writing and exposition, and supporting tasks. A statement is required even if no AI was
    used. The editorial board decides whether the nature and extent of AI use are acceptable.
  evidence:
  - source: ai-guidance
    quote: Authors may use AI tools to assist with preparation of their manuscripts.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Authors, however, remain fully responsible for the content of their submissions, including
      correctness, originality, presentation, and intellectual integrity.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Accordingly, authors must carefully verify any AI-assisted material, fully understand the work
      they submit, and ensure that their manuscripts are comprehensible to human readers.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Authors must include a statement in the acknowledgments section describing their use of AI
      tools.The AI disclosure statement should explain whether and how AI tools were used in proof development,
      writing and exposition, and other supporting tasks, such as numerical experiments and proofreading.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Even if no AI tools were used, authors must include an AI statement clarifying this.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: The editorial board has final discretion to determine whether the nature and extent of AI use
      are acceptable.
    quote_provenance: raw_bytes
