policy_owner: bernoulli
delegates_to_journal: false
policy_architecture: rule_with_exemptions
notes: The Bernoulli Society's AI policy for Bernoulli Journal covers authors, reviewers and editors, and
  applies to submissions on or after 8 November 2026. Only humans may be listed as authors. Every submission
  needs an AI statement in the acknowledgments, even if no AI tools were used. Reviewers and editors may
  share manuscript material only with secure or institutionally approved AI tools whose settings prohibit
  training on it.
