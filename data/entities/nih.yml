notes: 'NIH''s rules are set out in two Guide notices. Peer reviewers of grant applications and R&D
  contract proposals, and members of NIH advisory councils and boards, may not use generative AI to
  analyse or write critiques (NOT-OD-23-149, 23 June 2023). For applications submitted from the 25
  September 2025 receipt date, NIH will not treat applications, or sections of them, substantially
  developed by AI as the applicants'' original ideas (NOT-OD-25-132, 17 July 2025). The same notice
  limits each Principal Investigator to six new, renewal, resubmission or revision applications per
  calendar year, except for T activity codes and R13 Conference Grant Applications.'
