- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: confidentiality
  conditions: Reviewers must not upload a submitted manuscript or any part of it into a generative AI tool.
    They must not upload their reviews into an AI tool, even to improve language and readability. Reviewers
    should not use AI as the sole mechanism for evaluating or making decisions about a manuscript.
  evidence:
  - source: ethical-best-practices
    quote: Editors, editorial office staff, or reviewers must not upload a submitted manuscript or any part
      of it into a generative AI tool, as this may violate confidentiality and proprietary rights and, where
      the paper contains personally identifiable information, may violate data privacy rights.
    quote_provenance: browser_dom
  - source: ethical-best-practices
    quote: For this reason, reviewers and editors must not upload their reviews and letters, respectively,
      into an AI tool, even if it is just for the purpose of improving language and readability.
    quote_provenance: browser_dom
  - source: ethical-best-practices
    quote: AI technologies should not be used by editors or reviewers as the sole mechanism in evaluating
      or making decisions about a manuscript.
    quote_provenance: browser_dom
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: AI-powered automation may support processing speed, validation, quality assessment and progression
    of peer review, provided the AI does not itself decide on acceptance or rejection. Editors and editorial
    office staff must not upload a submitted manuscript or any part of it into a generative AI tool. Editors
    must not upload their letters, including decision letters, into an AI tool. Editors should not use AI
    as the sole mechanism for evaluating or deciding on a manuscript. Misconduct and integrity evaluations
    should not rely solely on AI decision-making. The source does not name or describe specific publisher
    AI systems or tools.
  evidence:
  - source: ethical-best-practices
    quote: AI-powered automation to increase processing speed, validation, quality assessment, and progression
      of the peer review process may be used provided the outcome does not result in a decision by the AI
      itself on acceptance or rejection of a manuscript.
    quote_provenance: browser_dom
  - source: ethical-best-practices
    quote: The management of the editorial evaluation of a scientific manuscript is a responsibility of humans.
    quote_provenance: browser_dom
  - source: ethical-best-practices
    quote: AI technologies should not be used by editors or reviewers as the sole mechanism in evaluating
      or making decisions about a manuscript.
    quote_provenance: browser_dom
  - source: ethical-best-practices
    quote: The editor is responsible and accountable for the editorial process, the final decision, and
      the communication thereof to the authors.
    quote_provenance: browser_dom
  - source: ethical-best-practices
    quote: Editors, editorial office staff, or reviewers must not upload a submitted manuscript or any part
      of it into a generative AI tool, as this may violate confidentiality and proprietary rights and, where
      the paper contains personally identifiable information, may violate data privacy rights.
    quote_provenance: browser_dom
  - source: ethical-best-practices
    quote: For this reason, reviewers and editors must not upload their reviews and letters, respectively,
      into an AI tool, even if it is just for the purpose of improving language and readability.
    quote_provenance: browser_dom
  - source: ethical-best-practices
    quote: Evaluations of misconduct and research integrity, including those leading to expressions of concerns,
      retractions, or contacting researchers’ institutions, also should not rely solely on AI decision-making.
    quote_provenance: browser_dom
