policies:
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: accountability
  conditions: Authors disclose which AI tool they used and how, in the Materials and Methods or a similar
    section. Authors are fully responsible for all content, including parts produced by an AI tool.
  evidence:
  - source: ethical-best-practices
    quote: WKH’s Artificial Intelligence Authoring Tools and Authorship Policy permits authors to use generative
      AI and AI-assisted technologies in the writing of a manuscript, production of images or graphical
      elements of the paper, or in the collection and analysis of data.
    quote_provenance: browser_dom
  - source: ethical-best-practices
    quote: Authors must be transparent in disclosing in the Materials and Methods (or similar section) of
      the paper how the AI tool was used, and which tool was used.
    quote_provenance: browser_dom
  - source: ethical-best-practices
    quote: Authors are fully responsible for the content of their manuscript, even those parts produced
      by an AI tool, and are thus liable for any breach of publication ethics.
    quote_provenance: browser_dom
