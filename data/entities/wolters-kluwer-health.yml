notes: 'Wolters Kluwer Health has two position statements for its periodical journals: one for authors,
  and one for journals that covers authors, editors and reviewers. Both are on the Lippincott Journals
  ethical best practices page. An AI authoring tool does not meet the ICMJE standards for authorship.
  Authors must not upload an accepted or published manuscript, or any part of it, into a generative AI
  tool, as this may breach the copyright agreement or licensing terms.'
