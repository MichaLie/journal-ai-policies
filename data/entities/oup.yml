- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: Before publication, authors whose disclosed AI use does not align with journal policy are informed
    of the next steps, which may include revision. Failure to disclose AI use may be grounds for rejection.
    After publication, journals may issue corrections or, in some cases, retractions in line with industry
    standards such as COPE. A trigger and consequences are stated (disclosed use that does not align with
    journal policy, or non-disclosure; revision, rejection, correction or retraction). Author contact is stated
    before publication (authors are informed of the next steps). No appeal route is stated.
  evidence:
  - source: ai-use-disclosure
    quote: Pre-publication: where disclosed use of Gen AI Tools does not align with journal policy, authors
      will be informed of the next steps, which may include being asked to revise their manuscript accordingly.
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: Failure to disclose use of Gen AI Tools may be grounds for rejection.
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: Post publication: journals and their editorial teams can decide to take action to correct the accuracy
      of the literature in accordance with industry standards such as the Committee on Publication Ethics (COPE).
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: These actions can include corrections or in some cases retractions to address any form of misrepresentation,
      including the undisclosed involvement of Gen AI Tools.
    quote_provenance: browser_dom
