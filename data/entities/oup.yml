policies:
- axis: language_refinement
  permission: permitted
  disclosure: not_required
  disclosure_location: []
  rationale: unstated
  conditions: Improving clarity of language, such as spelling or grammar correction, needs no disclosure. Substantially
    editing, rewriting or reorganising text is typically permitted with disclosure.
  evidence:
  - source: ai-use-disclosure
    quote: Uses of Gen AI Tools permitted WITHOUT disclosure
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: Improving clarity of language (e.g. spelling or grammar correction)
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: Uses of Gen AI Tools which are typically permitted WITH disclosure
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: Substantially editing, rewriting, or reorganizing text using AI
    quote_provenance: browser_dom
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - cover_letter
  - acknowledgements
  rationale: accountability
  conditions: Substantially editing, rewriting or reorganising text is typically permitted with disclosure.
    Disclose in the cover letter and the Acknowledgements at initial submission, and update for revisions.
    Give the tool name and version, how it was used, and the author's role in directing and reviewing the output.
    Where journal guidance differs, authors should follow the journal's guidance.
  evidence:
  - source: ai-use-disclosure
    quote: Uses of Gen AI Tools which are typically permitted WITH disclosure
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: Substantially editing, rewriting, or reorganizing text using AI
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: Any use of Gen AI Tools should be disclosed both in your cover letter to editors and in the Acknowledgements
      section of manuscripts.
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: Disclosure is essential to ensure that AI-generated content is not presented as entirely human-created.
      Authors are accountable for complete and accurate disclosure.
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: This disclosure must be made at initial submission and updated as relevant for any revision(s) submitted.
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: 'When disclosing AI use in the cover letter and manuscript, the following details must be included:'
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: Name and version of the Gen AI Tool used
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: A description of how the Gen AI Tool was used (e.g. substantial editing or text generation, organization
      of document, translation of manuscript text, etc.)
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: The author’s role in directing and reviewing the work generated by the Gen AI Tool to ensure accuracy of
      the output
    quote_provenance: browser_dom
  - source: ai-use-disclosure
    quote: In the event of any variation between this policy and the journal’s specific guidance, authors should
      follow the journal’s specific guidance.
    quote_provenance: browser_dom
