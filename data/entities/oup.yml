id: oup
name: Oxford University Press (OUP journals)
type: publisher
parent: null
platform: academic.oup.com
policy_owner: oup
delegates_to_journal: true
policy_architecture: per_task_matrix
homepage: https://academic.oup.com
notes: 'Policy for authors of OUP journals, last updated 13 July 2026 and covering all content types. It
  sorts AI uses into those permitted without disclosure, those typically permitted with disclosure, and
  those not permitted. Individual journals can add their own rules. The policy says: "individual
  journals may have custom requirements, in addition to those stated here, to best serve the needs of
  their specific research communities." It adds: "In the event of any variation between this policy and
  the journal’s specific guidance, authors should follow the journal’s specific guidance." Authors
  confirm at submission that they have followed the policy.'
