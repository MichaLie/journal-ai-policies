notes: Frontiers' AI policy covers authors, editors and reviewers. Authors must disclose AI use in the
  acknowledgments, and in the methods where applicable, giving the tool's name, version, model and source.
  Editors and reviewers must not upload manuscript content to external generative AI tools; Frontiers
  provides its own AI tool for reviewers inside the review forum. The policy page also asks that clinical
  trials with AI components follow the CONSORT-AI extension and that clinical study protocols with an
  AI component follow the SPIRIT-AI extension.
