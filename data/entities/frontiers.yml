- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: 'Trigger and consequence: stated for image concerns. Frontiers’ AI review assistant (AIRA)
    is trained to detect specific types of image recycling, modification and manipulation, and concerns
    over undeclared image modifications are investigated. Failure to address the concerns leads to rejection,
    and the issue may be raised with the authors'' institutions; after publication, failure to provide
    the original images may result in retraction. No threshold beyond a raised concern is stated. Author
    contact: stated; authors are asked to provide the original images and data. Appeal route: the image-manipulation
    guidance does not refer to one; the general rebuttals and appeals policy lets authors appeal a rejection
    they believe misapplied a journal policy, considers one appeal or rebuttal per manuscript, and treats
    all decisions as final. The AI fair use and disclosure policy states no consequence for undisclosed
    AI use.'
  evidence:
  - source: ai-policy
    quote: Our artificial intelligence review assistant (AIRA) is trained to detect specific types of
      recycling, modifications, and manipulation.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Any concerns raised over undeclared image modifications will be investigated, and the authors
      will be asked to provide the original images and data
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Failure by authors to adequately address such concerns will result in rejection of the manuscript,
      and the issue may be raised with the authors' institutions.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: If it is brought to our attention post-publication, it will be investigated, and authors will
      be required to provide the original images. Failure to do so may result in retraction.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: 'Appealing compliance with policies : If you think your submission was rejected because the
      journal''s policies were misapplied or your adherence was misunderstood, you can appeal.'
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: 'Please be aware that we will not consider rebuttals or appeals under the following circumstances:
      When one appeal or rebuttal has already been evaluated for the manuscript'
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: assessment of all rebuttals and appeals remains at the discretion of the journal and all decisions
      are final.
    quote_provenance: raw_bytes
