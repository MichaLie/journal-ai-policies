policies:
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - acknowledgements
  - methods
  rationale: accountability
  conditions: Authors should not list a generative AI technology as an author or co-author, because it
    cannot be held accountable for all aspects of a manuscript. Authors remain responsible for checking
    the factual accuracy of AI-generated content and must check it is free from plagiarism. Disclosure
    goes in the Acknowledgements and, where applicable, the Methods, and must give the tool’s name, version,
    model and source.
  evidence:
  - source: ai-policy
    quote: If AI tools have been used to generate main text, then this must be clearly disclosed in the
      acknowledgments.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: If the author of a submitted manuscript has used written or visual content produced by or edited
      using a generative AI technology, such use must be acknowledged in the acknowledgments section of
      the manuscript and the methods section, if applicable.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: This explanation must list the name, version, model, and source of the generative AI technology.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Authors should not list a generative AI technology as a co-author or author of any submitted
      manuscript.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Generative AI technologies cannot be held accountable for all aspects of a manuscript and consequently
      do not meet the ICMJE criteria required for authorship.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: the author remains responsible for checking the factual accuracy of all content created using
      generative AI technology. This includes, but is not limited to, any quotes, citations, or references.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Authors must also check that any written or visual content produced by or edited using a generative
      AI technology is free from plagiarism.
    quote_provenance: raw_bytes
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - review_report
  rationale: confidentiality
  conditions: Frontiers states that it adheres to WAME, EASE and COPE guidelines on the use of AI in peer
    review. Manuscript content must not be uploaded to external generative AI tools. Any use of external
    AI tools must be discussed with the editorial team in advance and, if approved, disclosed to authors
    in the review. Frontiers provides an internal AI tool in a secure, closed environment; it should not
    be used for editorial decision-making. Reviewers and editors remain solely responsible for their reports
    and decisions.
  evidence:
