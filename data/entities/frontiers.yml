- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: confidentiality
  conditions: The policy page describes two Frontiers AI systems. An internal AI tool in the review forum,
    operating in a secure, closed environment, summarises manuscript content, highlights areas for analysis
    and helps reviewers draft feedback; it does not take part in editorial decision-making and should not
    be used for that purpose. Under the image-manipulation policy, Frontiers’ AI review assistant (AIRA)
    is trained to detect specific types of recycling, modification and manipulation. Under the heading on
    AI use by editors and reviewers, manuscript content must not be uploaded to external generative AI tools,
    to protect confidentiality and intellectual property, and academic editors remain solely responsible
    for their editorial decisions. The policy does not say whether authors are told that these Frontiers
    tools were used on their manuscript.
  evidence:
  - source: ai-policy
    quote: To support peer reviewers, we provide an internal AI tool within the review forum, operating
      in a secure, closed environment.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: It helps by summarizing manuscript content, highlighting areas for analysis, and assisting
      in drafting constructive feedback - while fully preserving author privacy.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Importantly, this AI tool does not participate in editorial decision-making, and should not
      be used for that purpose.
    quote_provenance: raw_bytes
