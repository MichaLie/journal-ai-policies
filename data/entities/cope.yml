id: cope
name: COPE
type: normative_body
parent: null
platform: null
policy_owner: cope
delegates_to_journal: false
policy_architecture: prose
homepage: https://publicationethics.org
notes: The body most publishers cite, unrevised since 13 February 2023. Its separate discussion document
  on AI in editorial decisions dates from September 2021, before ChatGPT was released. The position
  statement places a duty on authors and assigns them liability; it contains no instruction to editors
  on what to do with a disclosure once received. Live publicationethics.org returns 403 to automated
  clients, so this record is verified against a dated Internet Archive capture.
sources:
