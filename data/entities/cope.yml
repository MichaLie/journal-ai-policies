id: cope
name: COPE
type: normative_body
parent: null
platform: null
policy_owner: cope
delegates_to_journal: false
policy_architecture: prose
homepage: https://publicationethics.org
notes: COPE's position statement says AI tools cannot be listed as an author of a paper, because they cannot
  take responsibility for the submitted work and, as non-legal entities, cannot assert the presence or
  absence of conflicts of interest or manage copyright and license agreements. Authors must disclose in
  the Materials and Methods (or a similar section) how an AI tool was used and which tool, and they are
  liable for any breach of publication ethics. The statement gives editors no instruction on what to do
  with a disclosure once received. The page gives 13 February 2023 as its last-reviewed date; its change
  history lists Version 1 as published on 20 August 2024.
