policies:
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: accountability
  conditions: 'Methods placement, naming the tool — three years before ICMJE said the same. Note the
    scope: it already covers collection and analysis of data.

    '
  evidence:
  - source: position-authorship-ai
    quote: Authors who use AI tools in the writing of a manuscript, production of images or graphical
      elements of the paper, or in the collection and analysis of data, must be transparent in disclosing
      in the Materials and Methods (or similar section) of the paper how the AI tool was used
    quote_provenance: raw_bytes
  - source: position-authorship-ai
    quote: Authors are fully responsible for the content of their manuscript, even those parts produced
      by an AI tool, and are thus liable for any breach of publication ethics.
    quote_provenance: raw_bytes
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: accountability
  conditions: The statement explicitly extends to "the collection and analysis of data".
  evidence:
  - source: position-authorship-ai
    quote: Authors who use AI tools in the writing of a manuscript, production of images or graphical
      elements of the paper, or in the collection and analysis of data, must be transparent in disclosing
      in the Materials and Methods (or similar section) of the paper how the AI tool was used
    quote_provenance: raw_bytes
- axis: due_process
  permission: not_addressed
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: 'A load-bearing negative. The position statement says nothing whatsoever about what an
    editor should do with a disclosure once received.

    '
coherence: []
