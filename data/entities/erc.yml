policies:
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: non_delegation
  conditions: Applies to evaluation of grant proposals. The guidance rests on two principles, non-delegation
    of the evaluation task and protection of confidentiality. Reviewers remain fully responsible for assessing
    proposals and writing reviews. AI tools may not be used to summarise proposals, assess their scientific
    merit or generate draft evaluations. Uploading any part of a proposal to external AI systems is prohibited,
    because it would disclose sensitive information to third parties. Reviewers may use AI to improve the
    language of their reports or to search for general information, provided no proposal content or personal
    data is shared and no assessment is delegated. The press release does not address disclosure of AI
    use.
