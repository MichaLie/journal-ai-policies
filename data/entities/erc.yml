policy_architecture: rule_with_exemptions
notes: Covers reviewers of ERC grant proposals. Reviewers may use AI tools only to improve the language
  of their reports or to search for general information, without sharing proposal content or personal
  data, and may not use them to summarise proposals, assess their merit or draft evaluations. This entry
  is based on the ERC press release of 24 March 2026; the full guidelines for panel members and remote
  reviewers, and the ERC Scientific Council's position on AI use in proposal preparation, are linked from
  it but were not reviewed here.
