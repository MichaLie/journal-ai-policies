id: era
name: European Research Area living guidelines
type: normative_body
parent: null
platform: null
policy_owner: era
delegates_to_journal: false
policy_architecture: rule_with_exemptions
notes: Non-binding ERA Forum guidelines for researchers, research organisations and research funders,
  including AI use in peer review. This fourth version was published on 15 October 2026. The guidelines
  do not replace legislation or institutional, disciplinary, funder and other requirements; where specific
  legal or policy requirements apply, these take precedence. They state that AI systems are neither authors
  nor co-authors nor owners.
