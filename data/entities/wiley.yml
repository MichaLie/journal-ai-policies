platform: onlinelibrary.wiley.com
policy_owner: wiley
delegates_to_journal: true
policy_architecture: per_task_matrix
homepage: https://www.wiley.com
notes: 'Wiley''s AI guidelines cover research-process use, agentic search and disclosure; AI tools must
  not be listed as authors. The ethics guidelines leave the decision to each journal: "The final decision
  on whether using AI Technology is appropriate or permissible for a submitted manuscript or a published
  article belongs to the journal’s editor or other party responsible for the publication’s editorial policy."
  The AI guidelines add: "Check the specific requirements of your target journal, as policies vary across
  publishers and titles". Authors must make sure an AI tool''s provider gains no rights over their content,
  including the right to train on it, and should check the tool''s terms for clauses on ownership, data
  reuse, training or opt-out.'
