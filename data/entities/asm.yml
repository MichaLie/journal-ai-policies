policies:
- axis: language_refinement
  permission: permitted
  disclosure: required
  disclosure_location:
  - cover_letter
  rationale: unstated
  conditions: Improving the language, accessibility or quality of human-generated text is the use the
    page allows. Any AI use is disclosed in the cover letter at submission. Authors may be asked for the
    tool name and version, purpose, prompts and input in the manuscript.
  evidence:
  - source: generative-ai
    quote: AI tools should only be used to improve the language, accessibility, or quality of human-generated
      text.
    quote_provenance: browser_dom
  - source: generative-ai
    quote: If you use AI tools in your manuscript, it must be disclosed at submission in the cover letter.
    quote_provenance: browser_dom
  - source: generative-ai
    quote: You can and may be requested to provide additional details (name and version of AI tool, purpose,
      prompts, input) in the manuscript.
    quote_provenance: browser_dom
- axis: writing_drafting
  permission: discouraged
  disclosure: required
  disclosure_location:
  - cover_letter
  rationale: accountability
  conditions: AI tools should be used only to improve the language, accessibility or quality of
    human-generated text. Content generated entirely by AI without significant human contribution is not
    allowed. Staff may allow exceptions case by case, for example for manuscripts about AI tools or machine
    learning. Any AI use is disclosed in the cover letter at submission. Authors are responsible for the
    accuracy of text, figures and references. To keep work original and prevent plagiarism, authors should
    avoid copying content and remove biases AI tools may have introduced.
  evidence:
  - source: generative-ai
    quote: AI tools should only be used to improve the language, accessibility, or quality of human-generated
      text.
    quote_provenance: browser_dom
  - source: generative-ai
    quote: Content completely generated by an AI tool without any significant human contribution is not
      allowed in ASM journals.
    quote_provenance: browser_dom
  - source: generative-ai
    quote: Certain exceptions can be allowed, such as manuscripts specifically about AI tools or machine
      learning.
    quote_provenance: browser_dom
  - source: generative-ai
    quote: If you have questions, contact the staff, who will evaluate each case individually.
    quote_provenance: browser_dom
  - source: generative-ai
    quote: If you use AI tools in your manuscript, it must be disclosed at submission in the cover letter.
    quote_provenance: browser_dom
  - source: generative-ai
    quote: Authors are responsible for the accuracy of the text, figures, and references in their manuscript.
    quote_provenance: browser_dom
  - source: generative-ai
    quote: To maintain originality and prevent plagiarism, avoid copying content, and eliminate any biases
      potentially introduced by AI tools.
    quote_provenance: browser_dom
