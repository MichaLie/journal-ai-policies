id: asm
name: ASM Journals
type: publisher
parent: null
platform: journals.asm.org
policy_owner: asm
delegates_to_journal: false
policy_architecture: rule_with_exemptions
homepage: https://journals.asm.org
notes: ASM's Generative AI page gives guidelines for authors in ASM journals. AI tools should be used only
  to improve the language, accessibility or quality of human-generated text, and not for images, cover
  art, videos or schematics. Staff can allow exceptions case by case, for example for manuscripts about
  AI tools or machine learning. AI tools cannot be authors, and any AI use is disclosed in the cover letter
  at submission.
