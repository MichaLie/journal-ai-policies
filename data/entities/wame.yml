id: wame
name: World Association of Medical Editors
type: normative_body
parent: null
platform: null
policy_owner: wame
delegates_to_journal: false
policy_architecture: prose
notes: WAME's recommendations (revised 31 May 2023) are meant to inform editors and help them develop
  journal policies, and to help authors and reviewers attribute chatbot use. Chatbots cannot be authors.
  Chatbot help with drafting is noted in the acknowledgment; research uses are stated in the Abstract
  and Methods. WAME warns that chatbots keep the content and prompts supplied to them and may use them
  in future responses.
sources:
- id: ai-guidance
  url: https://wame.org/pdf/Chatbots-Generative-AI-and-Scholarly-Manuscripts.pdf
  role: guidance
  audience: all
  status: current
  authoritative: true
  fetch_method: http
  date_source: stated
  stated_date: '2023-05-31'
  last_verified: '2026-11-20'
  content_sha256: ae0f0362bf7fdb16befea19fc9dec0de66ef6cbaf2dfffc419c8d52870e0aaf4
policies:
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - acknowledgements
  rationale: accountability
  conditions: Indicate the extent and type of chatbot use. Note the use in the acknowledgment and specify
    all prompts used to generate new text. Authors are
    responsible for chatbot-generated material, including its accuracy. Authors specify what they have
    done to mitigate the risk of plagiarism, provide a balanced view and ensure the accuracy of all their
    references. Authors must ensure that all quoted material is appropriately attributed, with full
    citations, and that the cited sources support the chatbot's statements.
  evidence:
  - source: ai-guidance
    quote: The extent and type of use of chatbots in journal publications should be indicated.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Authors submitting a paper in which a chatbot/AI was used to draft new text should note such
      use in the acknowledgment; all prompts used to generate new text, or to convert text or text prompts
      into tables or illustrations, should be specified.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Authors of articles written with the help of a chatbot are responsible for the material generated
      by the chatbot, including its accuracy.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: They should specify what they have done to mitigate the risk of plagiarism, provide a balanced
      view, and ensure the accuracy of all their references.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: authors must ensure that all quoted material is appropriately attributed, including full citations,
      and that the cited sources support the chatbot’s statements.
    quote_provenance: raw_bytes
- axis: data_presentation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - abstract
  - methods
  rationale: reproducibility
  conditions: State the use of AI to generate tables that report results in both the Abstract and the
    Methods. For AI-generated research results, give the full prompt, the time and date of the query, and
    the AI tool and its version, to enable scientific scrutiny including replication. Specify all prompts
    used to convert text or text prompts into tables.
  evidence:
  - source: ai-guidance
    quote: When an AI tool such as a chatbot is used to carry out or generate analytical work, help report
      results (e.g., generating tables or figures), or write computer codes, this should be stated in the
      body of the paper, in both the Abstract and the Methods section.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: In the interests of enabling scientific scrutiny, including replication and identifying falsification,
      the full prompt used to generate the research results, the time and date of query, and the AI tool
      used and its version, should be provided.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: all prompts used to generate new text, or to convert text or text prompts into tables or illustrations,
      should be specified.
    quote_provenance: raw_bytes
- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: unstated
  conditions: Specify all prompts used to convert text or text prompts into illustrations. The source does
    not say where the prompts go.
  evidence:
