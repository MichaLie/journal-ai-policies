- axis: audit_trail
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: reproducibility
  conditions: For AI-generated research results, give the full prompt, the time and date of the query,
    and the AI tool and its version. Specify all prompts used to generate new text, or to convert text or
    text prompts into tables or illustrations. Identify the chatbot used and the specific prompt. The source
    does not say where these details go.
  evidence:
  - source: ai-guidance
    quote: In the interests of enabling scientific scrutiny, including replication and identifying falsification,
      the full prompt used to generate the research results, the time and date of query, and the AI tool
      used and its version, should be provided.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: all prompts used to generate new text, or to convert text or text prompts into tables or illustrations,
