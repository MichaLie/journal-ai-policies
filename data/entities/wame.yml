- axis: passing_off
  permission: prohibited
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: Authors must ensure that content reflects their own data and ideas and is not plagiarism,
    fabrication or falsification. Otherwise, offering it for publication is potentially scientific misconduct.
  evidence:
  - source: ai-guidance
    quote: It is the author’s responsibility to ensure that the content reflects the author's data and ideas
      and is not plagiarism, fabrication or falsification.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Otherwise, it is potentially scientific misconduct to offer such material for publication, irrespective
      of how it was written.
    quote_provenance: raw_bytes
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - abstract
  - methods
  rationale: reproducibility
  conditions: State the use in both the Abstract and the Methods. This covers analytical work, help reporting
    results and writing computer code.
  evidence:
  - source: ai-guidance
    quote: When an AI tool such as a chatbot is used to carry out or generate analytical work, help report
