    quote_provenance: raw_bytes
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: confidentiality
  conditions: Specify any chatbot use to authors and to each other. If reviewers use chatbots in communications
    with authors and each other, they explain how. Supplying an author's manuscript to a chatbot breaches
    confidentiality. Reviewers are responsible for chatbot-generated content and citations.
  evidence:
  - source: ai-guidance
    quote: Editors and peer reviewers should specify, to authors and each other, any use of chatbots in
      the evaluation of the manuscript and generation of reviews and correspondence.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: If they use chatbots in their communications with authors and each other, they should explain
      how they were used.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: supplying an author's manuscript to a chatbot breaches confidentiality of the submitted manuscript.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Editors and reviewers are responsible for any content and citations generated by a chatbot.
    quote_provenance: raw_bytes
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: confidentiality
  conditions: Editors specify any chatbot use in evaluating manuscripts and in correspondence, to authors
    and to reviewers. If they use chatbots in communications with authors and each other, they explain how.
    Editors are responsible for chatbot-generated content and citations. Supplying an author's manuscript
    to a chatbot breaches confidentiality. The source does not describe AI systems or tools run by WAME
    itself.
  evidence:
  - source: ai-guidance
    quote: Editors and peer reviewers should specify, to authors and each other, any use of chatbots in
      the evaluation of the manuscript and generation of reviews and correspondence.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: If they use chatbots in their communications with authors and each other, they should explain
      how they were used.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: supplying an author's manuscript to a chatbot breaches confidentiality of the submitted manuscript.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Editors and reviewers are responsible for any content and citations generated by a chatbot.
    quote_provenance: raw_bytes
- axis: detection_screening
  permission: permitted
  disclosure: not_addressed
  disclosure_location: []
  rationale: quality
  conditions: WAME calls for editors to have tools that detect AI-generated or AI-altered content. Such
    tools should be available to editors regardless of ability to pay, for the good of science and the public,
    and to help ensure the integrity of healthcare information and reduce the risk of adverse health outcomes.
    Editors need tools that help them evaluate content efficiently and accurately. It does not say whether
    authors are told about screening.
  evidence:
  - source: ai-guidance
    quote: Editors need appropriate tools to help them detect content generated or altered by AI.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Such tools should be made available to editors regardless of ability to pay for them, for the
      good of science and the public, and to help ensure the integrity of healthcare information and reducing
      the risk of adverse health outcomes.
    quote_provenance: raw_bytes
  - source: ai-guidance
    quote: Editors need access to tools that will help them evaluate content efficiently and accurately.
    quote_provenance: raw_bytes
