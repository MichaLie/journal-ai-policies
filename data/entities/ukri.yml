id: ukri
name: UK Research and Innovation
type: funder
parent: null
platform: null
policy_owner: ukri
delegates_to_journal: false
policy_architecture: rule_with_exemptions
notes: Policy on generative AI in the application and assessment process for all UKRI funding opportunities.
  It covers applicants, assessors (reviewers and panellists) and UKRI's responsibilities as a funder. Applicants
  must not use generative AI during interviews that form part of the application process. Upheld allegations
  of misconduct arising from generative AI use can lead to sanctions, including rejection of applications
  and termination of funding.
