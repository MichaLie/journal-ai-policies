id: elsevier
name: Elsevier
type: publisher
parent: null
platform: sciencedirect.com
policy_owner: elsevier
delegates_to_journal: false
policy_architecture: rule_with_exemptions
homepage: https://www.elsevier.com
notes: 'Rewrote its journals policy in June 2026, permitting reviewers supportive use of private AI tools.
  Its BOOKS policy sits behind a URL ending ''in-the-review-process'' and forbids editors using AI to
  evaluate material — secondary sources routinely quote that page as if it were the journals policy. Cell
  Press, an Elsevier imprint, is reported to serve superseded 2023 wording; Cell Press is not yet a record
  here. Re-read on 2026-09-11 against the text signed off on 2026-08-21: the record had captured five
  axes of a policy that rules on ten. Added writing, research-process, explanatory-image, data-visualisation
  and passing-off axes with quotes, and the 18 August 2026 Elsevier Connect announcement as a source.'
sources:
- id: journals-policy
