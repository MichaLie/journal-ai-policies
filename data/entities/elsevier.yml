  note: The slug says 'review process' but the page is Elsevier's BOOKS policy (13 mentions of book/chapter,
    zero of 'journal' in lower case). Secondary sources routinely quote it as if it were the journals policy.
    It is not. Recorded until 2026-09-11 as https://www.elsevier.com/about/policies-and-standards/the-use-of-generative-ai-and-ai-assisted-technologies-in-the-review-process,
    which now redirects here.
  adjudicated_sha256: 4dc53275526ff38ae22e0c5125f3319dfd182ba5103f36cf25f930243bbe6138
