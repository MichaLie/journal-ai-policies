id: elsevier
name: Elsevier
type: publisher
parent: null
platform: sciencedirect.com
policy_owner: elsevier
delegates_to_journal: false
policy_architecture: rule_with_exemptions
homepage: https://www.elsevier.com
notes: Elsevier's journals policy (updated June 2026) covers authors, reviewers and editors. Reviewers,
  and editors working outside Elsevier's editorial systems, should use only private AI tools, meaning
  tools that must not use submitted content to train or improve the AI model. It also tells authors to
  check an AI tool's terms so that the tool gains only the right to use their material to provide the
  service, and no right to train on it. The page notes that "the range of AI use varies depending on the
  journal" but does not say that journals may set their own AI rules. A separate policy for books and
  commissioned content says authors cannot use output from AI agents or deep research directly as manuscript
  text, may not upload previously published or copyrighted content into external, open AI tools, and may
  not use AI to create or alter images (except as part of research design or methods) or to produce covers
  or graphical abstracts; it also says editors and reviewers should not use generative AI to help evaluate
  material. The site's copyright notice reserves rights for AI training, but that notice is not part of
  the AI policy.
