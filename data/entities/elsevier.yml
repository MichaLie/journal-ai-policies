  role: announcement
  audience: all
  status: current
  authoritative: false
  fetch_method: http
  date_source: stated
  stated_date: '2026-08-18'
  last_verified: '2026-09-11'
  content_sha256: c7d31bf07834145832cc588fdf954ebacc57f7202bc602d6199fa93554bc626f
  note: Elsevier Connect post announcing the updated journals policy, dated 18 August 2026; the policy
    page itself states 'Policy updated June 2026'.
  adjudicated_sha256: 86d090f162405b396d08affa68404ab97aa7655fd051d87b54a71dd29a2ebdb8
policies:
- axis: language_refinement
  permission: permitted
  disclosure: not_required
  disclosure_location: []
  rationale: unstated
  conditions: Exemption is withdrawn where changes go beyond basic correction.
  evidence:
  - source: journals-policy
    quote: Basic checks of grammar, spelling and punctuation do not need a declaration statement
    quote_provenance: raw_bytes
- axis: translation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - dedicated_section
  rationale: accountability
  conditions: Output must be checked by a competent bilingual human.
  evidence:
  - source: journals-policy
    quote: by a person who has a good understanding of both languages
    quote_provenance: raw_bytes
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: confidentiality
  conditions: 'Reversed in June 2026. Permitted only with a "private" AI tool as Elsevier defines it;
    disclosure to authors is mandatory. Uploading the manuscript remains prohibited.

    '
  evidence:
  - source: journals-policy
    quote: Reviewers should not upload a submitted manuscript or any part of it into an AI tool
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: AI tools may therefore only be used in a supportive capacity, for example to improve the
      language and structure of a review report, or to assist with a background literature search
    quote_provenance: raw_bytes
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: The two policies disagree. The journals policy states Elsevier's editors have AI tools
    for reviewer identification and duplicate detection; the books policy forbids editors using AI to
    evaluate material at all. Neither tells an author which tools ran on their manuscript.
  evidence:
  - source: journals-policy
    quote: Our editors have access to AI tools that assist in identifying relevant reviewers, matching
      the scope of submissions, and detecting duplicate submissions.
    quote_provenance: raw_bytes
  - source: books-policy
    quote: Generative AI or AI-assisted technologies should not be used by editors to assist in the
      evaluation of authors' material/ manuscript
    quote_provenance: raw_bytes
    evidence_role: supports
- axis: due_process
  permission: not_addressed
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: 'No threshold for triggering review, no duty to notify the author, and no route of appeal
    is stated. The quote records what is granted instead: editorial discretion.'
  evidence:
  - source: journals-policy
    quote: Authors may be asked to provide documentation of their AI use and the original, unprocessed
      images for editorial assessment.
    quote_provenance: raw_bytes
    evidence_role: documents_absence
- axis: detection_screening
  permission: not_addressed
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: 'Author-facing policy mentions image forensics only. Check Integrity was expanded to nearly
    2,000 journals in March 2026 without appearing in the author policy.

    '
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - dedicated_section
  rationale: accountability
  conditions: Separate AI declaration statement at submission, published with the article; basic grammar
    and spelling checks exempt, substantive changes to structure or content must be declared. Output must
    not replace the authors' own judgement, analysis or interpretation.
  evidence:
  - source: journals-policy
    quote: Authors should disclose the use of AI tools for manuscript preparation in a separate AI declaration
      statement included in their manuscript upon submission.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Although AI tools may support your writing process, they must not replace your own scientific
      judgement, analysis, interpretation or intellectual contribution.
    quote_provenance: raw_bytes
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: reproducibility
  conditions: Described 'in a reproducible manner' in Methods with model or tool, version and developer.
    The policy names AI-assisted imaging and predictive modelling as examples; agentic or autonomous workflows
    are not named.
  evidence:
  - source: journals-policy
    quote: Where the use of AI tools forms part of the research design or research methods, the use of
      the tools must be described in a reproducible manner in the Methods section.
    quote_provenance: raw_bytes
- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - figure_caption
  - dedicated_section
  rationale: accountability
  conditions: Explanatory images only (flow charts, decision trees, timelines, schematic illustrations,
    workflow diagrams); tool, version and use disclosed in each caption and in the AI declaration.
  evidence:
  - source: journals-policy
    quote: Authors may use AI tools to support the creation of certain types of explanatory images for
      publication, such as flow charts, decision trees, timelines, schematic conceptual illustrations,
      or experimental workflow diagrams.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: The use of AI tools should be disclosed in the caption of each image (including the specific
      tool, version, and how the tool was used) and in the general AI disclosure statement in the article.
    quote_provenance: raw_bytes
- axis: data_visualisation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: reproducibility
  conditions: Only where the visual is directly derived from underlying data via reproducible methods
    reported in Methods; tool, version and developer disclosed there.
  evidence:
  - source: journals-policy
    quote: AI tools may be used to support the creation of data visualizations only when the visual output
      is directly derived from underlying data.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Where AI tools are used in the generation of data visualizations, authors should disclose the
      name of the model or tool, the version used, and the developer or manufacturer, in the Methods section.
    quote_provenance: raw_bytes
- axis: passing_off
  permission: prohibited
  disclosure: not_addressed
  disclosure_location: []
  rationale: quality
  conditions: Covers fabricated results, invented or altered data, figures not faithfully derived from
    data, and primary research images (microscopy, blots, scans, patient images).
  evidence:
  - source: journals-policy
    quote: AI tools must not be used to fabricate results, invent or alter underlying data, or generate
      figures that are not faithfully derived from the underlying data and methods used in the research.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: AI tools must not be used to create or alter images that represent primary observed or experimental
      data that were not directly obtained in the research.
    quote_provenance: raw_bytes
coherence:
- summary: The books policy forbids editors using AI to evaluate material, while the journals policy
    states Elsevier's editors have access to AI tools that identify reviewers and match submissions.
    Both are live; the books policy sits behind a URL ending 'in-the-review-process'.
  sources:
  - journals-policy
  - books-policy
  axis: publisher_own_use
metadata_inconsistency:
- sources:
  - journals-policy
  - announcement-2026-08
  summary: The policy page's own footer states 'Policy updated June 2026', while Elsevier Connect announced
    'Elsevier has updated its generative AI policies for journals' on 18 August 2026. Either the August
    post is a late announcement of the June revision or the page changed again without its date line.
    Cite the page as updated June 2026 per its own statement.
