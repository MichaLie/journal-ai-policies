policies:
- axis: language_refinement
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - dedicated_section
  rationale: unstated
  conditions: Basic grammar, spelling and punctuation checks need no declaration. Substantive AI changes
    to sentence structure or organization should be disclosed in the separate AI declaration statement.
    AI features within specialist disability-related assistive technology used solely for accessibility
    need no disclosure.
  evidence:
  - source: journals-policy
    quote: Improving language, clarity, and readability of text written by the authors.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Authors should disclose the use of AI tools for manuscript preparation in a separate AI declaration
      statement included in their manuscript upon submission.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Basic checks of grammar, spelling and punctuation do not need a declaration statement
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: However, when an AI tool makes substantive changes to sentence structure or organization of
      a part of the text, this should be disclosed.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: authors are not required to disclose the use of AI tools or features within specialist disability-related
      assistive technology, provided these are used solely for accessibility purposes.
    quote_provenance: raw_bytes
- axis: translation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - dedicated_section
  rationale: accountability
  conditions: Authors must review the translation for accuracy, completeness and potential bias, have
    it checked by a person who understands both languages and the scientific content, and disclose the
    use in the separate AI declaration statement. Authors remain fully accountable for the translated
    text. They should protect confidentiality, privacy and intellectual property rights and review the
    tool's terms and conditions before uploading their content.
  evidence:
  - source: journals-policy
    quote: If you use AI tools to translate text that you have written, you must carefully review the
      translation for accuracy, completeness and potential bias.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: The output should be checked by a person who has a good understanding of both languages and
      the scientific content.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: You remain fully accountable for the translated text, and you should disclose the use of AI
      tools for translations included in your manuscript.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: As with any AI use, you should ensure that confidentiality, privacy and intellectual property
      rights are protected and review the tool’s terms and conditions before uploading your content.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Authors should disclose the use of AI tools for manuscript preparation in a separate AI declaration
      statement included in their manuscript upon submission.
    quote_provenance: raw_bytes
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - review_report
  rationale: confidentiality
  conditions: Supportive use only, such as improving the language and structure of a review report or
    a background literature search, provided that confidentiality is maintained and human control and
    oversight are exercised. Reviewers should use only private AI tools as Elsevier defines them.
    Reviewers must not upload a submitted manuscript or any information from it into an AI tool. Disclosure
    goes in the review report, in the comments to the authors. Basic checks for spelling and grammar need
    no disclosure.
  evidence:
  - source: journals-policy
    quote: Reviewers should not upload a submitted manuscript or any part of it into an AI tool as this
      may violate the authors’ confidentiality and proprietary rights
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: AI tools may therefore only be used in a supportive capacity, for example to improve the language
      and structure of a review report, or to assist with a background literature search, provided that
      confidentiality is maintained and human control and oversight are exercised.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: reviewers should only use private AI tools to assist in the review process
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: reviewers must not upload submitted manuscripts, or any information from them, into AI Tools.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Reviewers should disclose AI use in their review reports, including the tool used and purpose
      of the use.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: they should include a statement directly in their report(s) (specifically in the comments to
      the authors section)
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Basic checks for spelling and grammar do not need to be disclosed.
    quote_provenance: raw_bytes
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: confidentiality
  conditions: AI tools cannot replace an editor's critical thinking, independent evaluation or final decision-making;
    editors remain fully responsible for the final decision and its communication to authors. Editors
    have private AI tools inside Elsevier's editorial systems for tasks such as identifying reviewers,
    matching scope and detecting duplicate submissions. Outside those systems, editors may use only private
    AI tools in a supportive capacity and should not upload a submitted manuscript into an AI tool, as
    this may violate the authors' confidentiality and proprietary rights. The Editors FAQ states without
    that qualification that editors must not upload submitted manuscripts into AI tools. Elsevier's teams
    use AI tools at the post-acceptance stage, including proof preparation, copy editing and identifying
    inconsistencies or inaccuracies in the final paper. The policy does not say that authors are told
    which tools ran on their manuscript.
  evidence:
  - source: journals-policy
    quote: AI tools can be helpful in assisting with certain tasks, but cannot replace an editor’s critical
      thinking, independent evaluation or final decision-making.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Editors remain fully responsible and accountable for the editorial process, the final decision
      and its communication to authors.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Through Elsevier’s editorial systems, editors have access to private AI tools that assist them
      in performing certain tasks, such as identifying relevant reviewers, matching the scope of submissions
      to their journal, and detecting duplicate submissions.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Outside of Elsevier’s editorial systems, editors may only use private AI tools (see explanation
      above) in a supportive capacity
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: academic editors should not upload a submitted manuscript or any part of it into an AI tool
      outside of Elsevier’s editorial systems, as this may violate the authors’ confidentiality and proprietary
      rights
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: academic editors must not upload submitted manuscripts, or any part of them, into AI tools.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: 'Our teams use AI tools to support them in:'
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Supporting the post-acceptance stage of publication, including proof preparation, copy editing,
      and identifying inconsistencies or inaccuracies in the final paper.
    quote_provenance: raw_bytes
- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: A consequence is stated, as inclusion of fabricated references may lead to rejection of
    a manuscript. Author contact is stated, as authors may be asked for documentation of their AI use and
    for the original, unprocessed images for editorial assessment, and should be able to provide documentation
    of their AI use if editors request it. No appeal route is stated.
  evidence:
  - source: journals-policy
    quote: Authors may be asked to provide documentation of their AI use and the original, unprocessed
      images for editorial assessment.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: If requested by editors, authors should be able to provide documentation of their use of AI
      tools.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Inclusion of fabricated references may lead to rejection of a manuscript.
    quote_provenance: raw_bytes
- axis: detection_screening
  permission: permitted
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: Elsevier states that its teams use AI tools for technical checks and research integrity
    checks on submitted papers. The books policy states that image forensics tools or specialized software
    might be applied to submitted manuscripts to identify suspected image irregularities. Neither policy
    names AI-text detection or says whether authors are told of a result.
  evidence:
  - source: journals-policy
    quote: 'Our teams use AI tools to support them in: Conducting technical checks of submitted papers,
      such as checking for adherence to submission guidelines and assessing for completeness. Performing
      research integrity checks to ensure compliance with our policies.'
    quote_provenance: raw_bytes
  - source: books-policy
    quote: Image forensics tools or specialized software might be applied to submitted manuscripts to identify
      suspected image irregularities.
    quote_provenance: raw_bytes
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - dedicated_section
  rationale: accountability
  conditions: Disclosure goes in a separate AI declaration section at the end of the manuscript, before
    the references, and is published with the article. Basic grammar, spelling and punctuation checks
    are exempt; substantive changes to sentence structure or organization should be disclosed. Output
    must not replace the authors' own judgement, analysis or interpretation. AI-generated output must
    be carefully reviewed and edited before it is included in the manuscript. Generating sections without
    genuine intellectual contribution from the author is listed as inappropriate.
  evidence:
  - source: journals-policy
    quote: Authors should disclose the use of AI tools for manuscript preparation in a separate AI declaration
      statement included in their manuscript upon submission.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: This statement will appear in the published article to ensure transparency.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: you must include a separate declaration section at the end of your manuscript, immediately
      before the references
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Basic checks of grammar, spelling and punctuation do not need a declaration statement
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: However, when an AI tool makes substantive changes to sentence structure or organization of
      a part of the text, this should be disclosed.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Ultimately, authors are responsible and accountable for the contents of their work.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Although AI tools may support your writing process, they must not replace your own scientific
      judgement, analysis, interpretation or intellectual contribution.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Any AI-generated output must be carefully reviewed and edited before being included in your
      manuscript.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: 'Examples of inappropriate use may include: Generating sections of a manuscript without genuine
      intellectual contribution from the author.'
    quote_provenance: raw_bytes
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: unstated
  conditions: Use in research design or methods must be described reproducibly in Methods, with the model
    or tool name, version and developer or manufacturer, where applicable. The FAQ says the policy does
    not prevent AI use in formal research design or research methods, including study design, code development
    and data analysis.
  evidence:
  - source: journals-policy
    quote: Where the use of AI tools forms part of the research design or research methods, the use of
      the tools must be described in a reproducible manner in the Methods section.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: This should include the name of the model or tool, the version used, and the developer or manufacturer,
      where applicable.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: This policy does not prevent the use of AI tools in formal research design or research methods,
      including but not limited to study design, code development and data analysis.
    quote_provenance: raw_bytes
- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - figure_caption
  - dedicated_section
  rationale: accountability
  conditions: Permitted for explanatory images (flow charts, decision trees, timelines, schematic illustrations,
    workflow diagrams); tool, version and use disclosed in each caption and in the AI declaration. General-purpose
    generative AI tools must not be used for graphical abstracts; authors should use dedicated scientific
    illustration tools and mention the tool in the image caption. AI-generated cover art needs prior permission
    from the journal editor and publisher. Authors are responsible for the accuracy and originality of
    all images. Images that duplicate or refer to existing copyrighted images, real people, or others'
    identifiable products or brands must not be generated. Images based on existing artwork need attribution
    and the rights holder's permission before submission.
  evidence:
  - source: journals-policy
    quote: Authors may use AI tools to support the creation of certain types of explanatory images for
      publication, such as flow charts, decision trees, timelines, schematic conceptual illustrations,
      or experimental workflow diagrams.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: The use of AI tools should be disclosed in the caption of each image (including the specific
      tool, version, and how the tool was used) and in the general AI disclosure statement in the article.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: General-purpose generative AI tools must not be used to create graphical abstracts.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Graphical abstracts ⚠ Only use dedicated scientific illustration tools Mention the tool used
      in the image caption
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Authors must obtain prior permission from the journal editor and publisher before submitting
      AI-generated cover art.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Authors are responsible for ensuring the accuracy and originality of all images submitted for
      publication.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Where images are based on existing artwork or graphics, appropriate attribution must be provided
      and permission from any relevant rights holder must be obtained before submission.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Images that duplicate or refer to existing copyrighted images, real people, or others’ identifiable
      products or brands must not be generated, nor any likeness of an individual’s voice.
    quote_provenance: raw_bytes
- axis: data_visualisation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: unstated
  conditions: Only where the visual is directly derived from underlying data via reproducible methods
    reported in Methods; tool, version and developer disclosed there.
  evidence:
  - source: journals-policy
    quote: AI tools may be used to support the creation of data visualizations only when the visual output
      is directly derived from underlying data.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Such visualizations must be created via reproducible analytical, computational, or statistical
      methods that are clearly reported within the Methods section.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Where AI tools are used in the generation of data visualizations, authors should disclose the
      name of the model or tool, the version used, and the developer or manufacturer, in the Methods section.
    quote_provenance: raw_bytes
- axis: passing_off
  permission: prohibited
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: Covers fabricated results, invented or altered data, figures not faithfully derived from
    data, and primary research images (microscopy, histology, western blots, radiology scans, patient
    images). The ban on AI alteration of primary research images includes adjustments to brightness, contrast
    or colour balance, which should be done only with established image processing software. The policy
    does not prevent AI use in formal research design or research methods, such as AI-assisted imaging
    approaches used to collect or interpret the underlying research data; such use must be described
    reproducibly in the Methods section.
  evidence:
  - source: journals-policy
    quote: AI tools must not be used to fabricate results, invent or alter underlying data, or generate
      figures that are not faithfully derived from the underlying data and methods used in the research.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: AI tools must not be used to create or alter images that represent primary observed or experimental
      data that were not directly obtained in the research.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Primary research images represent primary observed or experimental data (such as microscopy,
      histology, western blots, radiology scans, or patient images).
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: This includes adjustments to brightness, contrast, or color balance, which should only be done
      using established image processing software.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: This policy does not prevent the use of AI tools in formal research design or research methods
      (such as in AI-assisted imaging approaches used for collection and/or interpretation of the underlying
      research data or predictive modelling of clinical outcomes based on patient data).
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Where the use of AI tools forms part of the research design or research methods, the use of
      the tools must be described in a reproducible manner in the Methods section.
    quote_provenance: raw_bytes
- axis: code_presentation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - dedicated_section
  rationale: unstated
  conditions: Using AI only to improve the presentation of code, such as formatting, must be done with
    human control and oversight and reported in the AI declaration. Code written or edited with AI as
    part of the research is declared in detail in Methods.
  evidence:
  - source: journals-policy
    quote: If authors only use AI tools to improve the presentation of their code in a manuscript, for
      example, for formatting, this should still be done with human control and oversight and should be
      reported in the AI declaration.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: If authors write or edit code using AI tools as part of their research, they should declare
      this in detail in the Methods section and follow field-specific standards and guidance.
    quote_provenance: raw_bytes
- axis: reference_gathering
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: quality
  conditions: Authors should always check AI-suggested sources. Use of AI to select, collate, generate
    or edit references should be declared in the manuscript. Reference managers used without a generative
    AI option need no disclosure. Fabricated references may lead to rejection.
  evidence:
  - source: journals-policy
    quote: Yes, authors can use AI tools to help organize literature and suggest sources.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: If these or any other AI tool are used to select, collate, generate or edit references, this
      should be declared in the manuscript.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Authors should always check sources, as AI-generated references and citations can be incorrect,
      hallucinated, or fabricated.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: If these tools are used without a generative AI option to organize references, this process
      does not require disclosure.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: Inclusion of fabricated references may lead to rejection of a manuscript.
    quote_provenance: raw_bytes
- axis: audit_trail
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: reproducibility
  conditions: Authors should keep a separate record of the tool and model used and how it was used; this
    may include tool logs, prompts and outputs, and evidence of how content was reviewed and edited. Documentation
    should be provided if editors request it.
  evidence:
  - source: journals-policy
    quote: Authors should keep a separate record of which tool and model was used, and how AI tools were
      used.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: This may include retaining logs provided by the tool, saving prompts and generated outputs,
      and keeping evidence of how the content was reviewed and edited
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: If requested by editors, authors should be able to provide documentation of their use of AI
      tools.
    quote_provenance: raw_bytes
  - source: journals-policy
    quote: documenting the use of AI during manuscript preparation supports transparency and reproducibility
    quote_provenance: raw_bytes
coherence: []
metadata_inconsistency:
- sources:
  - journals-policy
  - announcement-2026-08
  summary: The policy page's closing line states 'Policy updated June 2026', while Elsevier Connect announced
    'Elsevier has updated its generative AI policies for journals' on 18 August 2026.
- sources:
  - journals-policy
  summary: The stored copy of the policy page from 1 November 2026 has editors-section wording on private
    AI tools in Elsevier's editorial systems that the 15 October 2026 copy lacks. Both copies carry the
    line 'Policy updated June 2026'.
