notes: One ACS Publications policy covers authors, editors and peer reviewers. Peer reviewers must not use
  generative AI to generate, draft or revise their reports, and editors must not hand editorial judgement
  or decisions to it. Confidential manuscript material may go only into AI tools that ACS has authorised
  and built into its editorial or peer review systems. AI-generated images cannot be used in Table of
  Contents graphics.
