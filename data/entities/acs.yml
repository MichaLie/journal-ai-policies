- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: confidentiality
  conditions: Reviewers remain responsible for all comments and recommendations and must not use generative
    AI to generate, draft or revise their reports. Confidential materials may be shared only with AI
    tools that ACS has authorized and integrated into its review systems. Sharing confidential materials
    with any other AI tool is a breach of confidentiality. ACS may respond to violations by removing a
    reviewer from the peer review process or suspending or terminating reviewer privileges.
  evidence:
  - source: ai-policy
    quote: peer reviewers remain responsible for all comments and recommendations provided during peer
      review and must not use generative AI tools to generate, draft, or revise their peer review reports.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Submissions, associated data, peer review reports, author and reviewer correspondence, and other
      materials obtained through the editorial and peer review processes constitute confidential materials.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Editors and peer reviewers must maintain the confidentiality of such materials and must not upload,
      share, or disclose them to AI tools or platforms other than those that ACS has authorized and integrated
      into its editorial or peer review system(s)
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Where confidential materials are uploaded, shared, or disclosed to an AI tool or platform other
      than an ACS-Authorized Tool, such use will constitute a breach of confidentiality and violation of
      this policy.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: In response to an editor’s or peer reviewer’s violation of this policy, ACS may take such actions
      it deems appropriate, including but not limited to removal from the peer review process and suspension
      or termination of reviewer or editor privileges.
    quote_provenance: raw_bytes
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: confidentiality
  conditions: Editors remain responsible for all editorial assessments and decisions and must not delegate
    editorial judgement or decision-making to generative AI. Confidential materials may be shared only
    with ACS-Authorized Tools integrated into its editorial or peer review systems; sharing them with any
    other AI tool is a breach of confidentiality. ACS may respond to violations by suspending or terminating
    editor privileges. The policy names ACS-Authorized Tools but does not describe these tools or how ACS
    itself uses AI on submitted manuscripts.
  evidence:
