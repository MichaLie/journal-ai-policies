    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Editors and peer reviewers must maintain the confidentiality of such materials and must not upload,
      share, or disclose them to AI tools or platforms other than those that ACS has authorized and integrated
      into its editorial or peer review system(s)
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Where confidential materials are uploaded, shared, or disclosed to an AI tool or platform other
