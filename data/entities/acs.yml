policies:
- axis: language_refinement
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - acknowledgements
  - methods
  rationale: accountability
  conditions: Improving the language, readability or organisation of the authors' own text is a permitted
    use. Authors must review and verify AI-assisted content. Disclosure is required where generative AI
    creates or substantially modifies text. Tools that only check spelling, grammar or formatting without
    generating new content are not treated as generative AI under the policy. Brief disclosures go in
    the Acknowledgments; more extensive use is described in the Methods or another appropriate section.
  evidence:
  - source: ai-policy
    quote: Permitted uses include improving the language, readability, or organization of the authors’
      own text; translating text; and supporting literature searches.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Authors must review and verify all AI-assisted content.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Authors remain fully responsible for their submission, including any AI-generated material contained
      within it.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Tools that only check spelling, grammar, or formatting without generating new content are not
      generative AI for purposes of this policy.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Authors must disclose the use of generative AI tools to create or substantially modify text,
      permitted images and figures, or other submission content.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Brief disclosures should be included in the Acknowledgments section. More extensive use of generative
      AI must be described in the Methods section or another appropriate section of the manuscript.
    quote_provenance: raw_bytes
