- axis: reference_gathering
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: Supporting literature searches is a permitted use. Generative AI may not create substantial
    amounts of literature review content. Authors must ensure appropriate attribution or citation.
  evidence:
  - source: ai-policy
    quote: Permitted uses include improving the language, readability, or organization of the authors’
      own text; translating text; and supporting literature searches.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Authors may not use generative AI to create, alter, or enhance (i) a paper’s underlying data
      or results; (ii) any image that represents research results; (iii) the substance of their scientific
      reasoning, analysis, or interpretation of results; or (iv) substantial amounts of commentary, analysis,
      or literature review content.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Authors must ensure that all submitted content is accurate, non-infringing, and free from bias,
