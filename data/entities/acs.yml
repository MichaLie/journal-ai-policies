- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - figure_caption
  - acknowledgements
  - methods
  rationale: accountability
  conditions: Use of generative AI to create or substantially modify permitted images and figures must
    be disclosed. Brief disclosures go in the Acknowledgments; more extensive use is described in the Methods
    or another appropriate section. AI-generated images and graphics also need a statement in the figure
    caption on how they were created. Authors remain fully responsible for any AI-generated material. AI-generated
    cover art is permitted with disclosure and confirmation that the tool's terms allow commercial use,
    that the authors hold enough rights to grant ACS use, and that the artwork does not infringe third-party
    rights. AI-generated images cannot be used in Table of Contents graphics, as these have no caption
    or disclosure mechanism for transparent attribution.
