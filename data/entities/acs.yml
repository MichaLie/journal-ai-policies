- axis: data_visualisation
  permission: prohibited
  disclosure: required
  disclosure_location:
  - methods
  - figure_caption
  rationale: unstated
  conditions: Generative AI may not create, alter or enhance any image that represents research results.
    The restriction does not apply where AI or machine learning is part of the research methodology, such
    as AI-based image reconstruction, if fully described in the Methods section with original data available
    on request. Standard image processing is permitted if applied to the entire image without obscuring,
    removing or introducing features, and must be disclosed in the Methods section or figure caption.
    Disclosure applies only to these permitted exceptions.
  evidence:
  - source: ai-policy
    quote: Authors may not use generative AI to create, alter, or enhance (i) a paper’s underlying data
      or results; (ii) any image that represents research results;
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: The above restriction does not apply where AI or machine learning is part of the research methodology
      (e.g., predictive modeling, AI-based image reconstruction, or AI-predicted structures), provided
      the use is fully described in the Methods section and the original data are made available to editors
      and reviewers on request.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Standard image processing is permitted if it is applied to the entire image, does not obscure,
      remove, or introduce features, and is disclosed in the Methods section or figure caption.
    quote_provenance: raw_bytes
