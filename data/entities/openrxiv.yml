policy_architecture: prose
notes: 'openRxiv''s approach to AI for bioRxiv and medRxiv, published on 20 October 2026 as eight
  principles. Authors must be verifiable human beings affiliated with an organisation, and may use AI in
  drafting and research if they critically review and stand behind the work; the posts set no disclosure
  requirement. Automated tools support screening, staff make all decisions, and authors can appeal a
  decline. openRxiv provides a dedicated resource for machine access and text mining and expects all
  users of its content to respect the authors'' chosen licences; the posts do not mention AI training or
  author consent.'
