policies:
- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - figure_caption
  - dedicated_section
  rationale: accountability
  conditions: Explanatory figures need tool/version/use. Cover art is prohibited except when AI is integral
    to the research; general-purpose image tools cannot produce graphical abstracts.
  evidence:
  - source: ai-policy
    quote: Allows use of generative AI tools in the creation of explanatory images, in line with Elsevier
      policy.
    quote_provenance: browser_dom
- axis: language_refinement
  permission: permitted_with_conditions
  disclosure: not_required
  disclosure_location: []
  rationale: accountability
  conditions: This is an exemption for basic checking, not all drafting.
  evidence:
  - source: ai-policy
    quote: The declaration does not apply to the use of basic tools, such as tools used to check grammar,
      spelling, and references.
    quote_provenance: browser_dom
