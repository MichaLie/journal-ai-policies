    quote_provenance: raw_bytes
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  - acknowledgements
  rationale: quality
  conditions: Section 4.1.4 allows AIGC to improve readability, clarify the logic of the content, recommend
    sentence patterns, summarise publications and generate the literature review section. It should not
    write the entire text, interpret data or draw scientific conclusions. Because of the risk of inaccuracies,
    bias and omissions, summaries should be checked against the original publication. Tasks related to
    scientific or intellectual contributions, especially writing the critical parts of the paper, should
    be carried out by the researchers themselves. Section 4.2.3 requires detailed disclosure in sections
    such as Methods, Notes, Acknowledgments or Appendices when tools were used to write any part of the
    manuscript.
  evidence:
  - source: guideline-v3-en
    quote: AIGC can be used as a reference for researchers to improve the readability of the text, clarify
      the logic of the content, and recommend sentence patterns
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: Also, AIGC can be used to summa- rize other scholarly publications during the research process
      or to generate the literature review section. However, it should not be used to write the entire
      text, interpret data, or draw scienti�ic conclusions.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: Due to the risk of inaccuracies, bias and omissions, summaries for research and literature
      review purposes should always be thoroughly checked against the original publication
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: All tasks related to scien- ti�ic or intellectual contributions should be carried out by the
      researchers themselves, especially the writing of the critical parts of the paper.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: If an author has used such tools to write any part of the manuscript, they must provide open,
      transparent, and detailed disclosure in sections such as Methods, Notes, Acknowledgments, or Appendices.
    quote_provenance: raw_bytes
- axis: data_visualisation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: quality
  conditions: Section 4.1.3 allows AIGC help with choosing chart types and adjusting chart styles. Researchers
    should ensure that chart adjustments keep the data authentic and accurate. Critical images that present
    research findings and data must come from the authentic research process and original data, and must
    not be directly generated or altered with AIGC tools. The image-processing rules in Section 4.1.3
    cover photography and scientific diagrams. Adjustments of brightness, contrast or colour balance are
    acceptable only when applied uniformly to the whole image without obscuring or removing information.
    Enhancing, obscuring, moving, removing or introducing a specific feature within an image is not acceptable.
    Researchers who create or change image content with AIGC must describe what was created or altered
    and how the tool was used. Section 4.2.3 lists charts among the AIGC-generated content to disclose.
  evidence:
  - source: guideline-v3-en
    quote: AIGC tools can recommend the most suitable type of statistical graph for the application scenario.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: researchers can use AIGC tools to help adjust chart styles according to the amount of data
    quote_provenance: raw_bytes
  - source: guideline-v3-en
