policies:
- axis: reference_gathering
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location: []
  rationale: accountability
  conditions: 'Section 4.1.1: verify every source and retain human-led selection. Deep research outputs
    need the same checks.'
  evidence:
  - source: guideline-v3-en
    quote: 'Literature research: AIGC tools can be used to collect reference literature based on keywords
      or topics, classi- fy and review the literature, summarize the conclusions, and provide references
      for researchers;'
    quote_provenance: raw_bytes
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: 'Section 4.2.4.2: follow the commissioning journal. Support must enhance the reviewer’s
    own comments; the text also forbids processing content under review and restricts public-tool uploads.'
  evidence:
  - source: guideline-v3-en
    quote: During the manuscript review process, reviewers must determine whether AIGC tools can be used
      based on the policies of the commissioning party (e.g., journals or publishers). If journal policies
      explicitly prohibit their use, AIGC tools must not be employed.
    quote_provenance: raw_bytes
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  - acknowledgements
  rationale: accountability
  conditions: Section 4.1.4 allows literature-review assistance, not whole-paper writing or replacement
    of scientific judgment. Section 4.2.3 requires disclosure.
  evidence:
  - source: guideline-v3-en
    quote: Also, AIGC can be used to summa- rize other scholarly publications during the research process
      or to generate the literature review section. However, it should not be used to write the entire
      text, interpret data, or draw scienti�ic conclusions.
    quote_provenance: raw_bytes
- axis: data_visualisation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location: []
  rationale: accountability
  conditions: Section 4.1.3 permits chart formatting and data-grounded examples. Experimental images must
    come from research; graphical abstracts are prohibited and cover art needs prior permission.
  evidence:
  - source: guideline-v3-en
    quote: 'Statistical chart and diagram format processing and optimization: When processing and optimizing
      statisti- cal charts, researchers can use AIGC tools to help adjust chart styles according to the
      amount of data and speci�ic needs.'
    quote_provenance: raw_bytes
- axis: audit_trail
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  - acknowledgements
  rationale: accountability
  conditions: Section 4.2.3 specifies user, tool/version, time/date, prompts, affected parts and ideas.
    Its template describes attached records; section 4.3.1 addresses supplementary archiving. This is
    more specific than a tool-name declaration, not a blanket demand to publish every session.
  evidence:
  - source: guideline-v3-en
    quote: The user; the arti�icial intelligence technology or system (version number required); the time
      and date of use; prompts and questions used for content generation or optimization;
    quote_provenance: raw_bytes
- axis: detection_screening
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: 'Section 4.3.2: account for false positives and evaluate detections in context. This is
    guidance on detection, not evidence that ISTIC screens submissions.'
  evidence:
  - source: guideline-v3-en
    quote: The detection results should be used as an auxiliary supporting basis in a comprehensive evaluation
    quote_provenance: raw_bytes
coherence: []
