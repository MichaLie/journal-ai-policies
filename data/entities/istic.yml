      author obtains prior permission from the journal editor and publisher, can demonstrate that all
      necessary rights have been cleared for the use of the relevant material, and ensures that there
      is correct content attribution.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: as well as editori- al illustrations such as drawings, cartoons, or other 2D or 3D visual representations.
    quote_provenance: raw_bytes
