- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: Section 4.1.2 allows AIGC help choosing statistical methods and lets researchers use AIGC
    to interpret data, calculate statistical indicators and perform simple data analysis. Researchers
    assess AIGC's statistical-analysis suggestions and check them with other reliable tools or subject
    experts before accepting them. The data used
    should be collected from the researchers' own experiments or obtained through other legitimate means.
    AIGC cannot replace the researcher's own interpretation of the data, and researchers verify the results
    of statistical analysis. Section 4.1.4, on text writing, states that AIGC should not be used to interpret
    data. Section 4.1.1 asks researchers who use AIGC to collect viewpoint information to monitor and
    control it and to clean it up if necessary. Section 4.2.1 forbids letting AIGC autonomously initiate,
    execute or generate research outcomes without direct human supervision and guidance. It adds that
    AIGC tools cannot be held accountable for published works or research designs, and it stresses the
    need for human oversight and responsibility throughout the research process. Section 4.2.3 requires
    disclosure of AIGC use.
  evidence:
  - source: guideline-v3-en
    quote: Researchers can use AIGC to select the most appropriate method of analysis or statistical analysis;
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: researchers need to assess the feasibility of the statistical analysis suggestions provided by
      AIGC, evaluate them with other reliable statistical analysis and data mining tools, or seek guidance
      and assistance from the subject experts
