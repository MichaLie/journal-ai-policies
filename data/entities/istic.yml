policies:
- axis: reference_gathering
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: 'Section 4.1.1 applies the accountability principle: researchers verify every suggestion
    and reference and make human-led decisions on what to include. For deep research tools they verify
    the reliability of literature databases and review the outputs. Section 4.1.6 allows AIGC to help
    identify sources and generate citations only as an auxiliary tool, and authors are responsible for
    the reliability, accuracy and relevance of AIGC-generated citations. Section 4.2.3 requires disclosure
    of AIGC use.'
  evidence:
  - source: guideline-v3-en
    quote: AIGC tools can be used to collect reference literature based on keywords or topics
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: Researchers using AIGC to support their literature review must carefully review and verify
      the authenticity of each suggestion and reference provided, and make human-led decisions on what
      to include in their research.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: In accordance with the accountability principle, researchers should critically assess these
      outputs
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: the deep research capabilities introduced by major AIGC tools have become powerful instruments
      for literature collection and analysis
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: When utilizing these tools, it is essential to verify the reliability of literature databases
      and conduct careful review of output results
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: Authors are responsible for ensuring that any citations generated by AIGC tools are reliable,
      accurate, and relevant.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: While AIGC can assist researchers in identifying sources of citations and automatically generate
      citations that conform to the citation format of academic papers based on the litera- ture information
      provided by the authors, it should only be used as an auxiliary tool.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: The use of AIGC should be fully and accurately disclosed.
    quote_provenance: raw_bytes
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: confidentiality
  conditions: 'Section 4.2.4.2: reviewers follow the commissioning journal''s policy. Within it they may
    use AIGC to extract key information for reviewing and to help draft comments. The same section says
    tools may only enhance reviewers'' comments and may not process the content under review. Reviewers
    must ensure their feedback is accurate, truthful and impartial and reflects their own professional
    judgement. Without explicit permission, reviewers must not upload full manuscripts, core arguments,
    key data or other sensitive content to public tools, to prevent information leakage. Section 3.1 asks
    peer reviewers to disclose AIGC use.'
  evidence:
  - source: guideline-v3-en
    quote: During the manuscript review process, reviewers must determine whether AIGC tools can be used
      based on the policies of the commissioning party (e.g., journals or publishers). If journal policies
      explicitly prohibit their use, AIGC tools must not be employed.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: Within the bounds of journal policies, reviewers may responsibly utilize AIGC tools to extract
      key information for the purpose of reviewing or assisting in the drafting of review comments.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: It is important to note that AIGC tools may only be used to enhance reviewers' comments, not
      to process the content under review.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: Reviewers must ensure their feedback remains accurate, truthful, and impartial, and verify
      that their comments fully and speci�ically re�lect their profession- al judgment.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: Without explicit permission, reviewers must not upload full manuscripts, core arguments, key
      data, or other sensitive content to public AIGC tools to prevent information leakage.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: all application users (including researchers, authors, editors, peer reviewers, and readers,
      etc.) should be aware of and explicitly disclose the use of AIGC in their work.
    quote_provenance: raw_bytes
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: confidentiality
  conditions: Section 4.2.4.1 recommends that journals and publishers set clear AIGC policies and organise
    regular training so that editors and reviewers apply the technology in a transparent, standardised
    and responsible manner. Where feasible, journals or publishers should provide or recommend localised
    deployment tools that comply with data-security and ethical standards. Section 4.3.2 advises journals
    and editors to pay attention to security when using tools to detect AIGC-generated content, to prevent
    information leakage and misuse of data. Section 3.1 asks all users, editors included, to disclose
    AIGC use. The guideline names no specific AI system or tool used by journals or publishers.
  evidence:
  - source: guideline-v3-en
    quote: It is recommended that commissioning client (journals and publishers) establish clear policies
      for the use of AIGC
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: regular specialized training should be organized to ensure that editors and reviewers apply
