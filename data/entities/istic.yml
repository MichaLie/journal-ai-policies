homepage: null
notes: Guidance from the Institute of Scientific and Technical Information of China (ISTIC) with Elsevier,
  Springer Nature, Wiley, Taylor & Francis, Wolters Kluwer and Cambridge University Press, for authors,
  editors and reviewers. Version 3.0 presents itself as a reference tool that does not prevail over individual
  publishers' policies. Section 4.2.4.3 lets authors use AIGC tools to structure responses to reviewers
  unless the journal prohibits it, but forbids uploading the review report, any part of it or identifiable
  details from it to public AIGC tools. Section 4.1.5 asks authors to agree any use of a manuscript for
  AI training in advance with co-authors and stakeholders such as funders or publishers, and to check
  an AI tool's terms so that the tool gains only the right to use their material to provide the service.
  China's national standard GB/Z 290-2026 is listed separately.
