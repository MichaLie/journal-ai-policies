- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: unstated
  conditions: 'Section 4.1.3: generative AI may not be used to produce graphical abstracts. Cover art
    may be allowed case by case with prior permission from the journal editor and publisher, cleared rights
    and correct attribution. The image-processing rules in Section 4.1.3 cover editorial illustrations
    such as drawings and cartoons. Enhancing, obscuring, moving, removing or introducing a specific feature
    within an image is not acceptable. Brightness, contrast or colour changes are acceptable only when
    applied uniformly to the entire image. Adding legends and image annotations is acceptable. Researchers
    who create or change image content with AIGC must describe what was created or altered and how the
    tool was used.'
  evidence:
