policy_architecture: rule_with_exemptions
homepage: null
notes: 'Three editions: v1.0 September 2023, v2.0 September 2024, v3.0 December 2025, co-signed by Elsevier,
  Springer Nature, Wiley, Taylor & Francis, Wolters Kluwer and Cambridge University Press. It requires
  disclosure detail that English-language policy does not, including archiving AI session records. NOT
  a standard: it explicitly disclaims precedence over publisher policy and carries no standard number.
  A separate Chinese national guidance project on the same subject is registered and still under approval.
  Several verdicts here rest on the English v3.0 text; the Chinese edition is quoted where the English
  does not cover the point.'
