    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: Where feasible, journals or publishers should proactive- ly provide or recommend localized
      deployment tools that comply with data security and ethical standards
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: Journals and editors are advised to pay attention to security when using new tools to detect
