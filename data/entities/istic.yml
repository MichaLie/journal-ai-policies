- axis: language_refinement
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: confidentiality
  conditions: Section 4.1.5 allows AIGC as a language reviewer. A manuscript submitted to public AIGC,
    or to private services with low data security and confidentiality standards, may become part of a
    training corpus. Authors should check that the tool's terms do not grant it rights to train on their
    material, and agree any use for AI training with co-authors and stakeholders in advance. Authors must
    also ensure the tool imposes no constraints on the use of its outputs that could restrict publication
    of the article. Section 3.2, on privacy and data security, warns that any content input into AIGC
    tools may be collected. It advises against submitting sensitive information such as personal identifiers,
    research participant data or unpublished research materials, and requires authors to comply with the
    privacy policies, data security protocols and confidentiality requirements of their target publication
    venue. Section 4.2.3 requires disclosure of AIGC use.
  evidence:
  - source: guideline-v3-en
    quote: AIGC can serve as a high-standard language reviewer, improving the readability and writing
      quality of manuscripts, and thus removing language barriers in the dissemination of research.
    quote_provenance: raw_bytes
