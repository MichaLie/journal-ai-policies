  - source: guideline-v3-en
    quote: Similarly, amendments such as adding legends and image annotations are also acceptable.
    quote_provenance: raw_bytes
  - source: guideline-v3-en
    quote: When researchers create or change image content using AIGC tools, they are required to provide
