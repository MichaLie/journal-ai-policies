policies:
- axis: audit_trail
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  - acknowledgements
  rationale: reproducibility
  conditions: 'Six mandatory disclosure elements: the user; the AI system WITH VERSION NUMBER; the date
    and time of use; the prompts and questions used; the parts of the text written or co-written by
    AI; and the ideas arising from that use. Version 3.0 additionally requires naming the specific sections
    assisted, quoting the actual prompts, and ARCHIVING THE AI SESSION RECORDS AS AN ATTACHMENT.

    '
  evidence:
  - source: guideline-v3-en
    quote: detailing disclosure and declaration requirements during the manuscript submission phase
    quote_provenance: raw_bytes
- axis: writing_drafting
  permission: prohibited
  disclosure: required
  disclosure_location:
  - methods
  - acknowledgements
  rationale: accountability
  conditions: AI must not generate research hypotheses, write the whole paper, interpret data or draw
    scientific conclusions. Non-disclosure was made misconduct in v2.0 — over a year before ICMJE said
    the same.
  evidence:
  - source: guideline-v2-zh
    quote: 研究人员使用AIGC直接生成的稿件文字等资料必须提供明确的披露和声明，否则将构成学术不端行为。
    quote_provenance: raw_bytes
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: control
  conditions: 'NOTE: this sentence comes from the third edition''s list of changes, not from its normative
    text. It establishes that the guideline addresses journal, publisher and reviewer responsibilities
    — not what those responsibilities are.'
  evidence:
  - source: guideline-v3-en
    quote: emphasizing the responsibilities of relevant parties (including journals/publishers and reviewers)
      during the review process.
    quote_provenance: raw_bytes
