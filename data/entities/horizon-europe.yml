delegates_to_journal: false
policy_architecture: prose
notes: Covers applicants and expert evaluators of Horizon Europe funding proposals. Applicants may use
  generative AI to prepare a proposal but must disclose which tools they used and how, and remain fully
  responsible for the content; evaluators must not delegate the evaluation to AI tools. The applicant
  guidance is in Part B of the application form template (version 5.0, 5 November 2025), and the evaluator
  rules are in the standard briefing for experts (version 14.0, 15 April 2026). In relevant topics, evaluators
  also answer whether the project itself uses or develops AI-based systems; that question concerns the
  funded research.
