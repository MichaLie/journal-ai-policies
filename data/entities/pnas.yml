policies:
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  - acknowledgements
  rationale: accountability
  conditions: Identify tool/model and verify all outputs.
  evidence:
  - source: ai-policy
    quote: Use of AI and generative AI software, such as large language models (e.g., ChatGPT), during
      the research process must be disclosed in the Materials and Methods section (or Acknowledgments,
      if no Materials and Methods section is available) of the manuscript.
    quote_provenance: browser_dom
- axis: detection_screening
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: PNAS publicly names Pangram for AI-text detection and iThenticate for similarity checks.
    Naming a tool is not a claim of accuracy.
  evidence:
  - source: ai-policy
    quote: Pangram to detect content generated by AI
    quote_provenance: browser_dom
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: Publicly described reviewer/editor matching; no inferred per-manuscript disclosure requirement.
  evidence:
  - source: ai-policy
    quote: Prophy to assist matching submissions to editors and potential reviewers, and Web of Science
      Reviewer Locator to identify potential reviewers.
    quote_provenance: browser_dom
