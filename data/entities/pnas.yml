id: pnas
name: PNAS
type: journal
parent: null
platform: null
policy_owner: pnas
delegates_to_journal: false
policy_architecture: prose
homepage: null
notes: 'PNAS requires authors to disclose AI use in the research process in the Materials and Methods
  section, and says limited AI use for illustrative images may be acceptable if the figure legend
  describes it. It names the software that may use AI in its editorial assessment and peer review, including Pangram to detect
  AI-generated content. Only selected AI passages of the policy page are covered here.'
sources:
- id: ai-policy
  url: https://www.pnas.org/author-center/editorial-and-journal-policies
  role: policy
  audience: all
  status: current
  authoritative: true
  fetch_method: browser
  date_source: none
  last_verified: '2026-11-20'
  content_sha256: null
  note: 'Selected AI passages copied from the live page in a browser on 11 November 2026; no direct
    download or full-page copy is held.'
policies:
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  - acknowledgements
  rationale: unstated
  conditions: Disclose AI use in the research process in the Materials and Methods section, or in Acknowledgments
    if there is no Materials and Methods section.
  evidence:
  - source: ai-policy
    quote: Use of AI and generative AI software, such as large language models (e.g., ChatGPT), during
      the research process must be disclosed in the Materials and Methods section (or Acknowledgments,
      if no Materials and Methods section is available) of the manuscript.
    quote_provenance: browser_dom
- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - figure_caption
  rationale: unstated
  conditions: Limited use to generate, edit or enhance illustrative images that convey concepts or explain
    processes may be acceptable. The figure legend must briefly describe the creative process, name the
    tool(s) and say whether AI generated, edited or enhanced any visual elements.
  evidence:
  - source: ai-policy
    quote: Limited use of generative AI to generate, edit, or enhance illustrative images that convey concepts
      or explain processes may be acceptable.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: A brief description of the creative process must be provided in the figure legend, identifying
      the generative AI tool(s) used and explaining whether AI was used to generate, edit, or enhance any
      visual elements.
    quote_provenance: browser_dom
- axis: detection_screening
  permission: permitted
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: PNAS names Pangram for detecting AI-generated content and iThenticate for text-similarity
    screening, as software that may leverage AI.
  evidence:
  - source: ai-policy
    quote: As part of the journal's editorial assessment and peer review process, PNAS uses software that
      may leverage artificial intelligence (AI), such as iThenticate to screen for text similarity to published
      works, Pangram to detect content generated by AI
    quote_provenance: browser_dom
- axis: publisher_own_use
  permission: permitted
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: 'PNAS names Prophy for matching submissions to editors and potential reviewers, and Web of
    Science Reviewer Locator for identifying potential reviewers, as software that may leverage AI.
    These passages describe the publisher''s systems and set no rules for editors'' own use of AI tools.'
  evidence:
  - source: ai-policy
    quote: As part of the journal's editorial assessment and peer review process, PNAS uses software that
      may leverage artificial intelligence (AI)
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Prophy to assist matching submissions to editors and potential reviewers, and Web of Science
      Reviewer Locator to identify potential reviewers.
    quote_provenance: browser_dom
coherence: []
