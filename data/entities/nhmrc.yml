notes: 'Australian funder policy on generative AI in grant applications and peer review, dated 28 April
  2026 and applying to all peer review for NHMRC MREA grant schemes from that date. Applicants may use
  generative AI as a support tool under human oversight; the policy does not ask them to declare it.
  Peer reviewers may use it to refine their review comments, and using it to evaluate, critique or score
  applications is inappropriate. Breaches are managed under NHMRC''s Policy on Research Integrity.'
