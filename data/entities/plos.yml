id: plos
name: PLOS
type: publisher
parent: null
platform: journals.plos.org
policy_owner: plos
delegates_to_journal: false
policy_architecture: rule_with_exemptions
homepage: https://plos.org
notes: 'PLOS''s policy covers authors, reviewers and editors. Language improvements need no disclosure,
  disclosure is recommended for translation and required for analysis code and figures, and a cover
  letter needs none. Editors and reviewers disclose any AI use in the review form or decision letter so
  that authors can see it, and disclosing AI use does not negatively affect review or editorial
  decisions. The policy warns that, depending on a tool''s terms, data uploaded to it may be ingested
  into the tool''s training dataset.'
sources:
- id: ethical-publishing-practice
  url: https://journals.plos.org/plosone/s/ethical-publishing-practice
  role: policy
  audience: all
  status: current
  authoritative: true
  fetch_method: http
  date_source: hash
  stated_date: null
  last_verified: '2026-11-20'
  content_sha256: 6f878ecf4128454bd387d02b78ba275c7ffda6b02d7ce81309750d33d72f4751
  adjudicated_sha256: 7a1eecac7d3d753a8e3f62e9fee79b105088fdbeac527161ff0563042adcd7d0
  note: 'The page gives no revision date.'
policies:
- axis: language_refinement
  permission: permitted
  disclosure: not_required
  disclosure_location: []
  rationale: unstated
  conditions: The exemption covers correcting spelling or grammar and rephrasing content for clarity or
    conciseness.
  evidence:
  - source: ethical-publishing-practice
    quote: We do not require disclosure of AI use for language improvements, such as to correct spelling
      or grammar, or to rephrase content for clarity or conciseness.
    quote_provenance: raw_bytes
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  - acknowledgements
  rationale: accountability
  conditions: Authors are accountable for the reliability of all content they submit, and articles should
    report the authors’ own work and ideas. Disclosures name the tools, describe how they were used and
    which content was affected, and describe how the outputs were evaluated. Methods and Acknowledgements
    are alternative locations; figure-specific use belongs in the legend.
  evidence:
  - source: ethical-publishing-practice
    quote: AI tools may be used to support development or revision of a PLOS submission.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: articles should report the listed authors’ own work and ideas, and AI tools cannot be listed
      as authors.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Whether or not AI tools are used, authors are accountable for responsible stewardship of their
      research records and outputs, and for the reliability of all content they submit to PLOS.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Any AI use to generate or revise content for a PLOS submission, or to support research reported
      in a PLOS article, must be clearly disclosed as outlined in the AI use disclosures section of this
      policy.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: For AI use by authors, disclosures should be in the body of the article, either in a dedicated
      section of the Methods, in the Acknowledgement section, or in the relevant figure legend(s).
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: 'AI use disclosures should include all of the following: the name(s) of any tools used, a description
      of how the tool(s) was/were used, and which aspects of the study, article contents, data, supporting
      files, review, or decision letter were affected, and a description of how the user evaluated the
      validity of the tool’s outputs.'
    quote_provenance: raw_bytes
- axis: translation
  permission: permitted
  disclosure: encouraged
  disclosure_location:
  - methods
  - acknowledgements
  rationale: quality
  conditions: Disclosure is recommended to preempt concerns but is expressly not compulsory.
  evidence:
  - source: ethical-publishing-practice
    quote: If an AI tool has been used for language translation, we recommend this be disclosed in order
      to preempt concerns, but this is not strictly required.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: For AI use by authors, disclosures should be in the body of the article, either in a dedicated
      section of the Methods, in the Acknowledgement section, or in the relevant figure legend(s).
    quote_provenance: raw_bytes
- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - figure_caption
  rationale: accountability
  conditions: Illustrative figures must not misrepresent primary research outputs, introduce invalid content
    or put personal or sensitive data at risk. Authors are responsible for checking the accuracy and validity
    of AI-generated figure content and its compliance with the PLOS policy on licences and copyright.
    Disclose use in the figure legend.
  evidence:
  - source: ethical-publishing-practice
    quote: Yes, provided AI-generated content is not used to misrepresent primary research outputs and
      the use of AI does not introduce invalid content or place any personal or sensitive data at risk.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: For example, authors can use AI-generated figures for illustrative purposes or to summarize
      results, but should be aware that depending on the AI tool’s terms and conditions any data uploaded
      to the tool may be ingested into the AI tool’s training dataset and exposed to future users.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Any AI use for figure preparation should be clearly disclosed in the figure legend.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Authors are responsible for checking the accuracy and validity of AI-generated figure content,
      and for ensuring that any AI-generated content complies with the PLOS policy on Licenses and Copyright
    quote_provenance: raw_bytes
- axis: data_visualisation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - figure_caption
  rationale: accountability
  conditions: Figures summarizing results are allowed if they do not misrepresent primary research outputs,
    introduce invalid content or put personal or sensitive data at risk. Authors are responsible for checking
    the accuracy and validity of AI-generated figure content. Disclose use in the figure legend.
  evidence:
  - source: ethical-publishing-practice
    quote: Yes, provided AI-generated content is not used to misrepresent primary research outputs and
      the use of AI does not introduce invalid content or place any personal or sensitive data at risk.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: For example, authors can use AI-generated figures for illustrative purposes or to summarize
      results, but should be aware that depending on the AI tool’s terms and conditions any data uploaded
      to the tool may be ingested into the AI tool’s training dataset and exposed to future users.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Any AI use for figure preparation should be clearly disclosed in the figure legend.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Authors are responsible for checking the accuracy and validity of AI-generated figure content,
      and for ensuring that any AI-generated content complies with the PLOS policy on Licenses and Copyright
    quote_provenance: raw_bytes
- axis: passing_off
  permission: prohibited
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: Fabrication or misrepresentation of primary research data is a breach of publication ethics.
  evidence:
  - source: ethical-publishing-practice
    quote: The use of AI tools and technologies to fabricate or otherwise misrepresent primary research
      data is unacceptable and will be considered by PLOS to be a breach of publication ethics.
    quote_provenance: raw_bytes
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  - acknowledgements
  rationale: accountability
  conditions: Includes generation or development of analysis scripts or software code. Disclosures name
    the tools, describe how they were used and which aspects of the study were affected, and describe
    how the outputs were evaluated. Authors are accountable for responsible stewardship of their research
    records and outputs.
  evidence:
  - source: ethical-publishing-practice
    quote: Any AI use to generate or revise content for a PLOS submission, or to support research reported
      in a PLOS article, must be clearly disclosed as outlined in the AI use disclosures section of this
      policy.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Do I need to disclose AI use for generation or development of analysis scripts or software
      code? Yes.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: 'AI use disclosures should include all of the following: the name(s) of any tools used, a description
      of how the tool(s) was/were used, and which aspects of the study, article contents, data, supporting
      files, review, or decision letter were affected, and a description of how the user evaluated the
      validity of the tool’s outputs.'
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: For AI use by authors, disclosures should be in the body of the article, either in a dedicated
      section of the Methods, in the Acknowledgement section, or in the relevant figure legend(s).
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Whether or not AI tools are used, authors are accountable for responsible stewardship of their
      research records and outputs, and for the reliability of all content they submit to PLOS.
    quote_provenance: raw_bytes
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - review_report
  - decision_letter
  rationale: confidentiality
  conditions: Editorial board members and reviewers must not upload submissions, submission summaries
    or comments that would reveal unpublished submissions to generative AI tools. AI tools cannot serve
    as peer reviewers or decision-issuing editors and should not be used to summarize or evaluate submission
    content. Other use is allowed only if it does not put manuscript confidentiality at risk or misrepresent
    the reviewer’s or editor’s own intellectual contribution. Editors and reviewers disclose use in the
    review form or decision letter, so that authors can see it.
  evidence:
  - source: ethical-publishing-practice
    quote: AI tools cannot serve as peer reviewers or as decision-issuing editors, and should not be used
      by reviewers or editors to summarize or evaluate submission content.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Editorial board members and reviewers must not upload submissions, submission summaries, or
      any comments that would reveal information about unpublished submissions to generative AI tools,
      web platforms, databases, or other services.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: AI tools can only be used in peer review for purposes that (i) do not place the confidentiality
      of manuscript content or data at risk, AND (ii) would not misrepresent the reviewer’s or editor’s
      own intellectual contributions.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: For AI use by editors or reviewers, the disclosure should be in the review form or decision
      letter so that the information about AI use is available to authors when they receive their decision
      letter.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Uploading submission content or summaries to an AI tool places the confidentiality of that
      content at risk
    quote_provenance: raw_bytes
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - decision_letter
  rationale: quality
  conditions: PLOS uses AI tools for submission checks, screening and integrity investigations, and may
    integrate them into other publishing processes, communications and author services. It vets these
    tools against internal standards for efficacy and data security. The source describes the purposes
    of these tools but not the tools themselves, and does not say that their use on an article is disclosed.
    AI tools cannot serve as decision-issuing editors, and editors should not use them to summarize or
    evaluate submission content. Editorial board members must not upload submissions, submission summaries
    or revealing comments to generative AI tools. Any AI use by an editor must be disclosed in the decision
    letter.
  evidence:
  - source: ethical-publishing-practice
    quote: AI tools cannot serve as peer reviewers or as decision-issuing editors, and should not be used
      by reviewers or editors to summarize or evaluate submission content.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Editorial board members and reviewers must not upload submissions, submission summaries, or
      any comments that would reveal information about unpublished submissions to generative AI tools,
      web platforms, databases, or other services.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Any AI use by a reviewer or editor must be disclosed as discussed in the AI use disclosures section
      of this policy.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: For AI use by editors or reviewers, the disclosure should be in the review form or decision
      letter so that the information about AI use is available to authors when they receive their decision
      letter.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: PLOS uses AI tools to support submission checks, screening, and integrity investigations, and
      we may also integrate AI tools to further support our publishing processes, communications, and
      author services.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: We carefully vet all AI tools used by PLOS to ensure that they meet strict internal standards
      for efficacy and data security.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: In evaluating new tools and other options for process improvements, we place high priority
      on ensuring that we uphold the quality and integrity of our services, and that we protect personal
      and submission data in secure environments.
    quote_provenance: raw_bytes
- axis: detection_screening
  permission: permitted
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: The policy expressly allows AI detection at article level; it does not say every submission
    is screened or promise individual notification.
  evidence:
  - source: ethical-publishing-practice
    quote: We may use available AI detection tools in article-level checks or assessments, and we follow
      up if editors, reviewers, staff, or readers report concerns about undisclosed AI use.
    quote_provenance: raw_bytes
- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: 'Trigger and consequence: stated. PLOS follows up when editors, reviewers, staff or readers
    report concerns about undisclosed AI use. Such concerns may prompt an integrity investigation, delay
    peer review, or lead to rejection, retraction or an Expression of Concern, and PLOS may inform the
    authors’ institution(s) or require institutional assurances. No threshold for review is stated. Author
    contact: not stated; authors with concerns about a decision or review comments are asked to contact
    the journal office. Appeal route: the AI section does not point to one; the general policy says appeals
    of editorial decisions follow the PLOS pre-publication and post-publication appeal policies. AI use
    disclosures do not negatively affect the review or editorial decision.'
  evidence:
  - source: ethical-publishing-practice
    quote: We may use available AI detection tools in article-level checks or assessments, and we follow
      up if editors, reviewers, staff, or readers report concerns about undisclosed AI use.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Concerns about undisclosed or unacceptable AI use by authors may prompt an integrity investigation,
      delay peer review, and/or lead to editorial action on the article such as a rejection, retraction,
      or publication of an Expression of Concern.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: We may also inform the authors’ institution(s) of our concerns or require institutional assurances
      as to the reliability of an affected article’s content.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Will AI use disclosures negatively affect my article’s review or editorial decision? No.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: If you have concerns about your submission’s decision or review comments, please contact the
      journal office.
    quote_provenance: raw_bytes
  - source: ethical-publishing-practice
    quote: Appeals of editorial decisions should be submitted as outlined in our pre-publication and post-publication
      appeal policies.
    quote_provenance: raw_bytes
coherence: []
