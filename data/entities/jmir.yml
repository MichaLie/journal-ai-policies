notes: 'Summary of JMIR Publications'' generative AI policy for authors, applying to any JMIR
  Publications journal. Authors declare AI use through a dedicated question at submission and at each
  resubmission, and generative AI should never be listed as an author. The page names a 2023 editorial
  in the Journal of Medical Internet Research, written for authors, peer reviewers and editors, as the
  full policy. That editorial''s rules for reviewers and editors are not covered here.'
