policies:
- axis: audit_trail
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - submission_field
  - dedicated_section
  rationale: accountability
  conditions: Declare at submission and each resubmission. Retain the complete prompts, responses and
    conversations, with supplementary materials as instructed.
  evidence:
  - source: ai-policy
    quote: We ask authors to keep the complete original prompts, responses, and transcripts on file and
      to submit all generative AI conversations used in the preparation of the manuscript as a Multimedia
      Appendix, so reviewers and readers can assess the extent of AI-generated content in the manuscript.
    quote_provenance: raw_bytes
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - submission_field
  - dedicated_section
  rationale: accountability
  conditions: AI-generated text must be identified as such. The October 2026 update replaces acknowledgments
    with a dedicated disclosure statement.
  evidence:
  - source: ai-policy
    quote: We do allow the use of generative AI in ideation, but ask for full disclosure on the extent
      of use of generative AI in the ideation or writing process.
    quote_provenance: raw_bytes
