id: isc
name: ISC AI disclosure initiative
type: normative_body
policy_owner: isc
notes: A joint initiative of the International Science Council (ISC), COPE, STM and the Global Young Academy
  (GYA) to develop a global reporting standard for AI disclosure in research, the Vancouver Standard.
  It is still being developed and is not yet an adopted standard. The second consultation round (July
  to October 2026) has closed; the third is planned to open in January 2027.
