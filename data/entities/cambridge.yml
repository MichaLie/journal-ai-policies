notes: 'Cambridge sets one general rule for any AI use: it must be declared and explained, authors are accountable
  for it, and it must not breach Cambridge''s plagiarism policy. AI does not meet Cambridge''s requirements
  for authorship, and AI and LLM tools may not be listed as an author. Individual journals may add their
  own requirements. The policy says: "Please note, individual journals may have more specific requirements
  or guidelines for upholding this policy."'
