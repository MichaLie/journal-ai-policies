- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  - unspecified
  rationale: accountability
  conditions: AI use in the course of research is acknowledged in the contributor section and described
    more fully in the methods section. Disclosure also covers other work by the authors that underpins
    the submitted content. Authors are responsible for AI-produced content. Only humans are recognised
    as authors, since they must be accountable for the work.
  evidence:
  - source: ai-policy
    quote: Include an acknowledgement of AI use in the ‘contributor’ section of written material. If the
      AI use was in the course of research, a fuller description should be included in the methods section.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: We expect authors or others who are creating content to disclose and describe use of AI technologies
      in (a) any content which is submitted to us, (b) any other work by the authors which underpins or
      is otherwise connected with the content submitted to us
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Authors and contributors are responsible for content produced by AI technology in their work.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: BMJ only recognises humans as being capable of authorship since they must be accountable for
      the work.
    quote_provenance: raw_bytes
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: confidentiality
  conditions: The policy's principles also apply to the use of AI in peer review comments. Reviewers who
    use AI to improve word processing and language declare this when submitting their reports. Reviewers
    should not put unpublished manuscripts, or information about them, into publicly available AI tools
    where the security of confidential information cannot be guaranteed.
  evidence:
  - source: ai-policy
    quote: The same principles apply to the use of AI in peer review comments submitted to journals and
      any other advice or material sent to us.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: If reviewers use AI technology to improve word processing and language, they should declare
      this when submitting their reports.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: reviewers should preserve the confidentiality of the peer review process by not putting unpublished
      manuscripts that they are reviewing for BMJ Journals (or information about them) into publicly available
      AI tools
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: the security of the confidential information cannot be guaranteed.
    quote_provenance: raw_bytes
- axis: audit_trail
  permission: permitted_with_conditions
  disclosure: encouraged
  disclosure_location:
  - unspecified
  rationale: unstated
  conditions: Authors are asked to consider supplying a summary of AI input, output and how the output was
    reviewed, as supplementary files or additional information for the editor.
  evidence:
  - source: ai-policy
    quote: Consider including a summary of the input, output, and the way in which the AI output was reviewed
      on the part of the authors as supplementary files or additional information for the editor to review.
    quote_provenance: raw_bytes
- axis: detection_screening
  permission: permitted
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: BMJ may use screening tools before publication, systematically or case by case, and may also
    use them after publication. Notification of authors is not stated.
  evidence:
  - source: ai-policy
    quote: We may, on a systematic or case by case basis, use screening tools pre-publication to assist
      with the identification of content generated (in whole or in part) through AI technologies.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: We may also use such tools post-publication.
    quote_provenance: raw_bytes
- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: BMJ considers whether the way AI was used and declared is reasonable and consistent with
    its publication policies and practice. Trigger and consequence are stated, as content may be rejected
    or changed after publication on the basis of inadequate declaration or the circumstances of use. Contact
    with the author is stated, as the editor may ask for more information or for information to be added
    to the content. A route of appeal is not stated.
  evidence:
  - source: ai-policy
    quote: BMJ will consider whether the way in which AI was used and declared is reasonable and consistent
      with its publication policies and practice.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: The editor may ask for more information and/or for information to be added to the content for
      internal use and/or for publication.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Content may be rejected or be subject to post-publication changes on the basis of inadequate
      declaration or on the particular circumstances of its use.
    quote_provenance: raw_bytes
