id: bmj
name: BMJ
type: publisher
parent: null
platform: null
policy_owner: bmj
delegates_to_journal: false
policy_architecture: rule_with_exemptions
homepage: null
notes: One AI policy covers all BMJ titles, content types and formats, and is built on transparent declaration.
  Authors describe in the contributor section what AI was used, why and how, and are also expected to
  disclose AI use in key cited sources, to the best of their knowledge. The site's copyright notice reserves
  rights including for AI training; this notice is separate from the AI-use policy.
sources:
- id: ai-policy
  url: https://www.bmj.com/content/ai-use
  role: policy
  audience: all
  status: current
  authoritative: true
  fetch_method: http
  date_source: none
  last_verified: '2026-11-11'
  content_sha256: c1bc68ca35d0e3f661f940f212215c1962a19c41079cd6b22a197d985900b100
  note: Downloaded directly on 11 November 2026. Automated downloads were blocked on 20 November 2026, so every
    quoted sentence was checked on the live page in a browser that day.
policies:
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: AI use is described in the contributor section, stating what was used, why and how. Editors
    consider whether the use is suitable. Authors are responsible for AI-produced content. Only humans
    are recognised as authors, since they must be accountable for the work.
  evidence:
  - source: ai-policy
    quote: BMJ will consider content where AI technologies are used.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Where AI technology has been used this should be clearly described. Editors will consider the
      suitability of the use outlined.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Include an acknowledgement of AI use in the ‘contributor’ section of written material.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: 'Transparent declaration includes a description of: a) What AI technology was used (the name
      of the technology) b) Why this AI technology was used (the reason for its use) c) How the AI technology
      was used (what the task of the technology was)'
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Authors and contributors are responsible for content produced by AI technology in their work.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: BMJ only recognises humans as being capable of authorship since they must be accountable for
      the work.
    quote_provenance: raw_bytes
