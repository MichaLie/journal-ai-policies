id: jama-network
name: JAMA Network
type: publisher
parent: null
platform: jamanetwork.com
policy_owner: jama-network
delegates_to_journal: false
policy_architecture: per_task_matrix
homepage: https://jamanetwork.com
notes: Publisher of JAMA and the JAMA Network specialty journals (American Medical Association). One instructions-for-authors
  page serves every title, so the AI rules are network-wide. Revised guidance was published as an editorial
  on 2026-08-10 (Flanagin, Perlis, Bibbins-Domingo; doi:10.1001/jama.2026.16613, Crossref-verified 2026-09-11)
  with a table grading fourteen use types; the instructions page was updated 2026-07-29 to add the prohibition
  on drafting Opinion pieces, Letters and Comments. Alongside Science / AAAS it is one of two publishers
  here ruling on AI-drafted responses to reviewers (not permitted). Live jamanetwork.com returns 403 to
  automated clients; both sources are dated Internet Archive captures.
sources:
