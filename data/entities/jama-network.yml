    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: 'If AI, LLM, or chatbots were used to assist with content creation, revision, or formatting,
      the following should be reported in the Acknowledgment section: Name of the AI software platform,
      program, or tool Version and extension numbers Manufacturer Date(s) of use'
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: report each recommended guideline element with sufficient detail to enable reproducibility
    quote_provenance: raw_bytes
- axis: reviewer_use
  permission: prohibited
  disclosure: not_addressed
  disclosure_location: []
  rationale: confidentiality
  conditions: 'The table marks peer review as not acceptable use: entering a manuscript or the reviewer''s
    summary into an external AI tool or LLM is a violation of confidentiality. The instructions tell reviewers
    not to submit confidential manuscripts, abstracts or other text into a chatbot, language model or
    similar tool.'
  evidence:
  - source: editorial-2026-08
    quote: Peer review No Entering an author’s manuscript or the reviewer’s summary of the manuscript
      into an external AI tool or LLM is a violation of confidentiality
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Reviewers are instructed to not submit confidential manuscripts, abstracts, or other text into
      a chatbot, language model, or similar tool.
    quote_provenance: raw_bytes
- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: Trigger and consequence are stated, as content may be rejected or subject to postpublication
    corrective action if incomplete disclosure or failure to disclose AI use is detected during the editorial
    process or after publication. Contact with the author is stated in the Image Integrity section, which
    also holds the rule on AI-created or AI-manipulated clinical images; when inappropriate images or image
    adjustments are detected, authors are asked for an explanation and for the image as originally captured.
    This step covers all inappropriate images and is not limited to AI. The AI provisions do not point
    to a route of appeal; the instructions give a general appeals route for decisions.
  evidence:
  - source: instructions-for-authors
    quote: If incomplete disclosure or failure to disclose use of AI is detected during the editorial
      process or after publication, content may be rejected or subject to postpublication corrective action.
    quote_provenance: raw_bytes
  - source: editorial-2026-08
    quote: If incomplete disclosure or failure to disclose use of AI is detected during the editorial
      process or after publication, content may be rejected or subject to postpublication corrective action.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: The submission of clinical images and clinical illustrations created or manipulated by artificial
      intelligence, machine learning tools, or similar technologies is not permitted, unless part of formal
      research design or methods, which must be fully disclosed.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: When inappropriate images or image adjustments are detected by the journal staff, authors will
      be asked for an explanation and will be requested to submit the image as originally captured prior
      to any adjustment, cropping, or labeling.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Authors may appeal decisions. All appeals are reviewed by the editor in chief, on a case-by-case
      basis, or a designated editor if the editor in chief is recused from the review.
    quote_provenance: raw_bytes
