- axis: reference_gathering
  permission: discouraged
  disclosure: required
  disclosure_location:
  - methods
  - acknowledgements
  rationale: quality
  conditions: The table grades AI use for bibliographic references 'Discouraged'. The instructions say
    AI should not be used to generate or format references, as these tools may cause problems with the
    accuracy and integrity of cited references, and that standard reference managers may be used instead.
    AI-assisted literature search is acceptable if fully described in Methods for research reports and
    in the Acknowledgment for other manuscripts, with authors checking accuracy and taking full responsibility.
  evidence:
  - source: editorial-2026-08
    quote: Bibliographic references Discouraged AI tools may cause problems with the accuracy and integrity
      of cited references; standard reference managers may be used instead
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: AI, LLM, and chatbots should not be used to generate or format references as these tools may
      cause problems with the accuracy and integrity of cited references; standard reference managers
      may be used instead.
    quote_provenance: raw_bytes
  - source: editorial-2026-08
    quote: Literature search Yes, provided the use is fully described in the Methods section for reports
      of research and the Acknowledgment section for other types of manuscripts and that authors check
      for accuracy and take full responsibility for all content
    quote_provenance: raw_bytes
- axis: illustrative_images
  permission: prohibited
  disclosure: required
  disclosure_location:
  - methods
  - figure_caption
  rationale: quality
  conditions: Scope is clinical images and clinical illustrations, and clinical video and audio. The exception
    is use as part of formal research design or methods, which must be fully disclosed; the instructions
    name the Methods section for AI use that is part of formal research design or methods. The editorial
    permits replacing nonclinically relevant background in photographs with a solid colour; the adjustment
    and the AI or software (name and version) must be described in the figure legend, and the original unedited
    photographs provided for editorial review. The stated ground is concern about accuracy, clinical fidelity
    and demographic representational bias in AI-generated images. No figure-specific rule is given for non-clinical
    illustrations. The Reproduced and Re-created Material paragraph discourages AI-created content unless
    it is part of formal research design or methods, and it is unclear which journals it covers.
  evidence:
  - source: instructions-for-authors
    quote: Submission of clinical images and clinical illustrations created or manipulated by AI, LLM,
      and chatbots is not permitted, unless part of formal research design or methods, which must be fully
      disclosed.
    quote_provenance: raw_bytes
  - source: editorial-2026-08
    quote: This policy also applies to the submission of clinical video and audio files.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Authors should report the use of artificial intelligence, language models, machine learning,
      or similar technologies to create content or assist with writing or editing of manuscripts in the
      Acknowledgment section or Methods section if this is part of formal research design or methods.
    quote_provenance: raw_bytes
  - source: editorial-2026-08
    quote: We also share concerns about the accuracy, clinical fidelity, and demographic representational
      bias in AI-generated images.
    quote_provenance: raw_bytes
  - source: editorial-2026-08
    quote: Replacement of nonclinically relevant background with a solid color in photographs is permitted.
      Any such adjustment or background replacement must be fully described in the figure legend along
      with indication of the AI or software (name and version number) used, and the original unedited
      photographs must be provided for editorial review.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: The submission and publication of content created by artificial intelligence, language models,
      machine learning, or similar technologies is discouraged, unless part of formal research design
      or methods, and is not permitted without clear description of the content that was created and the
      name of the model or tool, version and extension numbers, and manufacturer.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: 'Include: JNO and JHF Exclude: All other journals Comments: Paragraph ("Please verify that
      all information and materials...") The submission and publication of content created by artificial
      intelligence'
    quote_provenance: raw_bytes
