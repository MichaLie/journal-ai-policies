policies:
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - acknowledgements
  rationale: accountability
  conditions: Use to assist content creation, revision and formatting must be reported in the Acknowledgment
    with tool, version, manufacturer, dates of use, what it was used on, and confirmation of author responsibility.
    Authors must review and confirm the accuracy of AI-generated content and take full responsibility for
    it. Drafting Opinion manuscripts, Letters to the Editor, online Comments, A Piece of My Mind essays
    and poems with AI is not permitted. Using AI for author responses to peer reviewer and editor comments
    is not acceptable. In the Reproduced and Re-created Material section, the instructions state that submitting
    and publishing AI-created content is discouraged unless part of formal research design or methods, and
    is not permitted without a clear description of the content and the tool. On the page this passage follows
    per-journal Include/Exclude markers, so it is unclear which journals it covers. The editorial calls
    author responsibility for the accuracy of all content a foundational tenet. AI tools do not qualify
    for authorship.
  evidence:
  - source: instructions-for-authors
    quote: Use of AI, LLMs, chatbots, or similar technologies to assist with content creation, revision,
      and formatting must be reported in the Acknowledgment section.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Use of AI, LLM, and chatbots to draft Opinion manuscripts, Letters to the Editor, and Online
      Comments is not permitted.
    quote_provenance: raw_bytes
  - source: editorial-2026-08
    quote: Manuscript preparation Yes, provided the use is fully described in the Acknowledgment section
      and authors check for accuracy and take full responsibility for all content
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Use of AI, LLM, and chatbots to draft poems is not permitted.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: The submission and publication of content created by artificial intelligence, language models,
      machine learning, or similar technologies is discouraged, unless part of formal research design
      or methods, and is not permitted without clear description of the content that was created and the
      name of the model or tool, version and extension numbers, and manufacturer.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: This should include a description of the content that was created or edited and the name of
      the language model or tool, version and extension numbers, manufacturer, date(s) of use, and confirmation
      that the authors take responsibility for the integrity of the content generated.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Authors must review and confirm the accuracy of all content generated by artificial intelligence
      (AI), large language models (LLMs), chatbots, or similar technologies and must be accountable and
      take full responsibility for all content.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: occasional pieces express views and opinions on the myriad issues that affect the profession.
      Use of AI, LLM, and chatbots to draft this manuscript type is not permitted.
    quote_provenance: raw_bytes
  - source: editorial-2026-08
    quote: Author response to peer reviewer and editor comments No Author’s insights are prioritized
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: 'Include: JNO and JHF Exclude: All other journals Comments: Paragraph ("Please verify that
      all information and materials...") The submission and publication of content created by artificial
      intelligence'
    quote_provenance: raw_bytes
  - source: editorial-2026-08
    quote: our guidance reaffirms the foundational tenet that authors must be responsible for the accuracy
      of all content submitted to journals, whether AI generated or assisted or produced solely by humans.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Nonhuman artificial intelligence, language models, machine learning, or similar technologies
      do not qualify for authorship.
    quote_provenance: raw_bytes
- axis: language_refinement
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - acknowledgements
  rationale: accountability
  conditions: AI use to assist with writing, editing or revision is reported in the Acknowledgment. The
    editorial table marks AI checking of grammar or spelling as acceptable with no disclosure needed;
    the instructions exempt basic tools for checking grammar or spelling. AI checking of grammar and spelling
    is permitted only after the initial text is written by humans. Authors must take full responsibility
    for any content changed by such tools.
  evidence:
  - source: instructions-for-authors
    quote: Authors should report the use of artificial intelligence, language models, machine learning,
      or similar technologies to create content or assist with writing or editing of manuscripts in the
      Acknowledgment section
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Use of AI, LLMs, chatbots, or similar technologies to assist with content creation, revision,
      and formatting must be reported in the Acknowledgment section.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Note this guidance does not apply to basic tools for checking grammar or spelling.
    quote_provenance: raw_bytes
  - source: editorial-2026-08
    quote: Use of AI tools and software to check grammar and spelling or for translation is permitted,
      but only after the initial text is written by humans.
    quote_provenance: raw_bytes
  - source: editorial-2026-08
    quote: Checking grammar or spelling Yes No disclosure needed
    quote_provenance: raw_bytes
  - source: editorial-2026-08
    quote: Authors must understand the risks of putting their content into an AI model and take full responsibility
      for any content changed by such tools.
    quote_provenance: raw_bytes
