policies:
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - acknowledgements
  rationale: accountability
  conditions: Not permitted at all for Opinion manuscripts, Letters to the Editor and online Comments
    ('human insights are prioritized'). Acknowledgment must name tool, version, manufacturer, dates of
    use, what it was used on, and confirm author responsibility.
  evidence:
  - source: instructions-for-authors
    quote: Use of AI, LLMs, chatbots, or similar technologies to assist with content creation, revision,
      and formatting must be reported in the Acknowledgment section.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Use of AI, LLM, and chatbots to draft Opinion manuscripts, Letters to the Editor, and Online
      Comments is not permitted.
    quote_provenance: raw_bytes
- axis: language_refinement
  permission: permitted
  disclosure: not_required
  disclosure_location: []
  rationale: unstated
  conditions: Only after the initial text is written by humans.
  evidence:
  - source: instructions-for-authors
    quote: Note this guidance does not apply to basic tools for checking grammar or spelling.
    quote_provenance: raw_bytes
  - source: editorial-2026-08
    quote: Use of AI tools and software to check grammar and spelling or for translation is permitted,
      but only after the initial text is written by humans.
    quote_provenance: raw_bytes
- axis: translation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - acknowledgements
  rationale: accountability
  conditions: Table row; warns against entering content into public translation tools.
  evidence:
  - source: editorial-2026-08
    quote: Translation Yes, provided the use is fully described in the Acknowledgment section and authors
      check for accuracy and take full responsibility for all content
    quote_provenance: raw_bytes
- axis: reference_gathering
  permission: discouraged
  disclosure: not_addressed
  disclosure_location: []
  rationale: quality
  conditions: The editorial's table grades this 'Discouraged'; the instructions say 'should not'.
  evidence:
  - source: instructions-for-authors
    quote: AI, LLM, and chatbots should not be used to generate or format references as these tools may
      cause problems with the accuracy and integrity of cited references; standard reference managers
      may be used instead.
    quote_provenance: raw_bytes
- axis: illustrative_images
  permission: prohibited
  disclosure: required
  disclosure_location:
  - methods
  rationale: quality
  conditions: Scope is clinical images and clinical illustrations (and clinical video/audio); the sole
    exception is use as part of formal research design or methods, which must be fully disclosed. Non-clinical
    explanatory figures are not addressed.
  evidence:
  - source: instructions-for-authors
    quote: Submission of clinical images and clinical illustrations created or manipulated by AI, LLM,
      and chatbots is not permitted, unless part of formal research design or methods, which must be fully
      disclosed.
    quote_provenance: raw_bytes
- axis: data_visualisation
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - figure_caption
  rationale: accountability
  conditions: Name and version number of the AI or software in the figure legend.
  evidence:
  - source: editorial-2026-08
    quote: Use of AI to generate graphic visualization of research data or results is permitted, provided
      that the AI or software (name and version number) used is included in the figure legend.
    quote_provenance: raw_bytes
- axis: passing_off
  permission: prohibited
  disclosure: not_addressed
  disclosure_location: []
  rationale: quality
  conditions: Table row in the editorial.
  evidence:
  - source: editorial-2026-08
    quote: Presenting AI-generated data as if it were original research from non-AI sources No
    quote_provenance: raw_bytes
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: reproducibility
  conditions: Follow the relevant reporting guideline; describe each use in Methods; for LLM studies give
    platform, version, manufacturer, dates and prompts; for ML give training/validation data, metrics,
    bias and subgroup analyses; data-sharing statement including code.
  evidence:
  - source: editorial-2026-08
    quote: Research Yes, provided the use is fully described in the Methods section and reporting guidance
      is followed and authors take full responsibility for all content
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Describe how AI was used for specific aspects of the study (eg, to generate or refine study
      hypotheses, assist in the generation of a list of adjustment variables, create graphs to show visual
      relationships).
    quote_provenance: raw_bytes
- axis: audit_trail
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  - acknowledgements
  rationale: reproducibility
  conditions: 'For research use: prompts, their sequence and revisions, dates, platform and version in
    Methods. For manuscript preparation: tool, version, manufacturer and dates in the Acknowledgment.
    No requirement to archive session records.'
  evidence:
  - source: instructions-for-authors
    quote: For studies using LLMs, provide the name of the platform or program, tool, version, and manufacturer;
      specify dates and prompt(s) used and their sequence and any revisions to prompts in response to
      initial outputs.
    quote_provenance: raw_bytes
- axis: reviewer_use
  permission: prohibited
  disclosure: not_addressed
  disclosure_location: []
  rationale: confidentiality
  conditions: Stated in the author-facing table; JAMA Network's separate reviewer instructions are not
    held here. The same table also bars AI-drafted author responses to reviewer and editor comments.
  evidence:
  - source: editorial-2026-08
    quote: Entering an author’s manuscript or the reviewer’s summary of the manuscript into an external
      AI tool or LLM is a violation of confidentiality
    quote_provenance: raw_bytes
- axis: due_process
  permission: not_addressed
  disclosure: not_addressed
  disclosure_location: []
  rationale: control
  conditions: A sanction is stated (rejection or post-publication correction) but no threshold for suspicion,
    no duty to notify the author and no route of appeal.
  evidence:
  - source: instructions-for-authors
    quote: If incomplete disclosure or failure to disclose use of AI is detected during the editorial
      process or after publication, content may be rejected or subject to postpublication corrective action.
    quote_provenance: raw_bytes
    evidence_role: documents_absence
- axis: detection_screening
  permission: not_addressed
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: Both sources speak of non-disclosure being 'detected' but neither says whether AI-text screening
    is run or whether authors are told.
coherence: []
