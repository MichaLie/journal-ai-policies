homepage: https://jamanetwork.com
notes: Covers authors in JAMA and the JAMA Network specialty journals, published by the American Medical
  Association. Revised guidance appeared as an editorial on 10 August 2026 (Flanagin, Perlis, Bibbins-Domingo;
  doi:10.1001/jama.2026.16613) with a table grading fourteen kinds of AI use, and was added to the journals'
  Instructions for Authors. The table marks AI use in peer review, and for author responses to peer reviewer
  and editor comments, as not acceptable. The JAMA Instructions for Authors page labels its sections with
  the journals they include or exclude. The site's copyright notice reserves rights for AI training, but
  that notice is not part of the AI policy.
