    quote_provenance: raw_bytes
- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: reproducibility
  conditions: Follow the relevant reporting guideline; describe each use in Methods; for LLM studies give
    platform, version, manufacturer, dates and prompts; for ML give training/validation data, metrics,
    bias and subgroup analyses; data-sharing statement including code. Avoid identifiable patient information
    in text, tables and figures. If copyrighted content was entered into the AI model, include the permission
    or licence and describe it in Methods; state rights to publish AI-generated content in Methods or
    in the figure or multimedia legend.
  evidence:
  - source: editorial-2026-08
    quote: Research Yes, provided the use is fully described in the Methods section and reporting guidance
      is followed and authors take full responsibility for all content
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Describe how AI was used for specific aspects of the study (eg, to generate or refine study
      hypotheses, assist in the generation of a list of adjustment variables, create graphs to show visual
      relationships).
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Follow relevant reporting guidelines for specific study designs when they exist and report
      each recommended guideline element with sufficient detail to enable reproducibility.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: For studies using LLMs, provide the name of the platform or program, tool, version, and manufacturer;
      specify dates and prompt(s) used and their sequence and any revisions to prompts in response to
      initial outputs.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: For studies reporting ML and algorithm development, include details about data sets used for
      development, training, and validation.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Indicate the metric used to evaluate the performance of the algorithms, including bias, discrimination,
      calibration, reclassification, and others as appropriate.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Indicate, when appropriate, if sensitivity analyses were performed to explore the performance
      of the AI model in vulnerable or underrepresented subgroups.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Provide a data sharing statement, including if code will be shared.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: Avoid inclusion of identifiable patient information in text, tables, and figures.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: If content protected by copyright was entered into the AI model by authors, include a copy
      of the permission or license from the copyright owner and describe this permission/license in the
      Methods section.
    quote_provenance: raw_bytes
  - source: instructions-for-authors
    quote: If content (text, images, multimedia) generated by AI is included in a submitted manuscript
      or supplemental material, indicate rights or permissions to publish that content as determined by
      the AI service or owner in the Methods section or in the legend(s) of any AI-generated figures or
      multimedia.
    quote_provenance: raw_bytes
