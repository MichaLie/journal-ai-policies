policies:
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - cover_letter
  - methods
  - acknowledgements
  rationale: accountability
  conditions: Methods describes use and prompts; acknowledgments identifies the tool/model. Copyediting
    is exempt.
  evidence:
  - source: ai-policy
    quote: If GenAI tools have been used when generating any part of the manuscript (for example when
      drafting text, translating content, formatting data, creating or editing figures, visualising results,
      refining code, or compiling references) this must be declared at submission within the cover letter.
    quote_provenance: browser_dom
- axis: passing_off
  permission: prohibited
  disclosure: not_addressed
  disclosure_location: []
  rationale: accountability
  conditions: Generated content cannot stand in for nonmachine research data.
  evidence:
  - source: ai-policy
    quote: We do not permit the presentation of any kind of content generated by AI tools as though it
      were original research data/results from nonmachine sources.
    quote_provenance: browser_dom
