policies:
- axis: language_refinement
  permission: permitted
  disclosure: not_required
  disclosure_location: []
  rationale: unstated
  conditions: Use of an LLM or other AI tool for AI-assisted copy editing does not need to be declared.
  evidence:
  - source: ai-policy
    quote: The use of an LLM (or other AI-tool) for “AI assisted copy editing” purposes does not need to
      be declared.
    quote_provenance: browser_dom
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - cover_letter
  - methods
  - acknowledgements
  rationale: accountability
  conditions: Declare use at submission in the cover letter. A Methods statement should describe how the
    tool was used, including prompts, and the tool name and model or version go in the Acknowledgements.
    Without a Methods section, all details go in the Acknowledgements. A recommended Acknowledgements
    statement names the tool, version and purpose, and states that the authors reviewed and edited the
    output. Authors are fully responsible for AI-produced content. The RSC states that it set out its AI
    policies to ensure openness and clarity for its community.
  evidence:
  - source: ai-policy
    quote: If GenAI tools have been used when generating any part of the manuscript (for example when
      drafting text, translating content, formatting data, creating or editing figures, visualising results,
      refining code, or compiling references) this must be declared at submission within the cover letter.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Authors should also include a statement within the Experimental/Materials and Methods section
      outlining how the tool was used, including prompts.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Details of the AI tool such as the name and specific model or version (e.g., GPT-4 or Claude 3.5
      Sonnet) should be included in the Acknowledgements section.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: If there is no Experimental/Materials and Methods section, all details must be included in the
      Acknowledgements section.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: 'Recommended statement in Acknowledgements section:'
    quote_provenance: browser_dom
  - source: ai-policy
    quote: During the preparation of this manuscript/study, the author(s) used [tool name, version information]
      for the purposes of [description of use].
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Authors are fully responsible and accountable for the content of their article, including any
      parts produced by an AI tool.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: The authors have reviewed and edited the output and take full responsibility for the content
      of this publication.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: To ensure openness and clarity for our community, we have set out artificial intelligence
      policies guided by the principles shared by STM and the Committee on Publication Ethics (COPE) in
      their position statement.
    quote_provenance: browser_dom
