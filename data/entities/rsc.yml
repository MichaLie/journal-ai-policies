- axis: research_process_ai
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - methods
  rationale: unstated
  conditions: Stated in the image creation and editing section, as the exception to the image-alteration
    ban. Where AI tools form part of the research design or methods, such as AI-assisted imaging used to
    generate or interpret research data, authors must describe the process in the Methods, including how
    the tool was used, its name, version and manufacturer. Authors should follow the tool's usage
    policies and ensure correct attribution. Original, unaltered images may be requested.
  evidence:
  - source: ai-policy
    quote: GenAI or AI-assisted tools must not be used to alter images in submitted manuscripts.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: The only exception is where AI tools form part of the research design or methods, for example,
      AI-assisted imaging used to generate or interpret research data.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: In these cases, authors must describe the process clearly in the Experimental/Materials and Methods
      section, including how the tool was used, its name, version, and manufacturer.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Authors should follow the tool’s usage policies and ensure correct attribution.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Where requested, authors may need to provide original, unaltered images or raw composites for
      editorial review.
    quote_provenance: browser_dom
- axis: passing_off
  permission: prohibited
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: AI-generated content must not be presented as original research data or results from nonmachine
    sources. AI tools must not be used to alter images in submitted manuscripts, apart from basic adjustments
    that do not hide or remove original information. The exception to the image ban is AI that forms part
    of the research design or methods, such as AI-assisted imaging, which must be described in the Methods.
  evidence:
  - source: ai-policy
    quote: We do not permit the presentation of any kind of content generated by AI tools as though it
      were original research data/results from nonmachine sources.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: GenAI or AI-assisted tools must not be used to alter images in submitted manuscripts.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Basic adjustments such as brightness, contrast or colour balance are acceptable, provided they
      do not hide or remove original information.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: The only exception is where AI tools form part of the research design or methods, for example,
      AI-assisted imaging used to generate or interpret research data.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: In these cases, authors must describe the process clearly in the Experimental/Materials and Methods
      section, including how the tool was used, its name, version, and manufacturer.
    quote_provenance: browser_dom
- axis: detection_screening
  permission: permitted
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: The RSC may use image forensics or specialist software to check images for irregularities.
    The AI sections name no AI-text detection tool. If undisclosed AI use is suspected, the RSC may
    contact the author for further information.
  evidence:
  - source: ai-policy
    quote: We may use image forensics or specialist software to check for irregularities.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: If AI usage is suspected and not disclosed, the RSC reserves the right to contact the author
      for further information.
    quote_provenance: browser_dom
- axis: due_process
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: Stated in the AI sections are a trigger, contact with the author and a consequence. If undisclosed
    AI use is suspected, the RSC may contact the author for further information. If concerns are not
    addressed satisfactorily, the manuscript may be withdrawn, rejected or retracted. The AI sections state
    no threshold for suspicion and no route of appeal.
  evidence:
  - source: ai-policy
    quote: If AI usage is suspected and not disclosed, the RSC reserves the right to contact the author
      for further information.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: If concerns are not addressed satisfactorily, the manuscript may be withdrawn, rejected or retracted.
    quote_provenance: browser_dom
