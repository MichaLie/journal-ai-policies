- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - cover_letter
  - methods
  - figure_caption
  - acknowledgements
  rationale: accountability
  conditions: Declare use at submission in the cover letter. A Methods statement should describe how the
    tool was used, including prompts; without a Methods section, all details go in the Acknowledgements.
    Graphics made with AI for illustrative or aesthetic purposes also need a brief description in the
    figure caption and the tool name and model or version in the Acknowledgements. The tool should be
    trained on licensed datasets and the output must be cleared for commercial reuse. Authors are fully
    responsible for the output and should check its accuracy. AI-generated images of identifiable people
    are not acceptable. A replacement image without people or with non-identifiable people should be
    used. The RSC states that it set out its AI policies to ensure openness and clarity for its community.
  evidence:
  - source: ai-policy
    quote: If GenAI tools have been used when generating any part of the manuscript (for example when
      drafting text, translating content, formatting data, creating or editing figures, visualising results,
      refining code, or compiling references) this must be declared at submission within the cover letter.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Authors should also include a statement within the Experimental/Materials and Methods section
      outlining how the tool was used, including prompts.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: If there is no Experimental/Materials and Methods section, all details must be included in
      the Acknowledgements section.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Where graphics have been created using AI for illustrative or aesthetic purposes only, a brief
      description of AI use should be included in the figure caption to explain to readers how the image
      was created.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Details of the AI tool such as the name and specific model or version should be included in the
      Acknowledgements section.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Any AI tool used during image creation should be trained on licensed datasets and the output must
      be cleared for commercial reuse.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Images containing identifiable people which have been generated using any AI tool are not acceptable.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: Authors are fully responsible and accountable for the output and should check its accuracy.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: A replacement image without people or with non-identifiable people should be used.
    quote_provenance: browser_dom
  - source: ai-policy
    quote: To ensure openness and clarity for our community, we have set out artificial intelligence
      policies guided by the principles shared by STM and the Committee on Publication Ethics (COPE) in
      their position statement.
    quote_provenance: browser_dom
