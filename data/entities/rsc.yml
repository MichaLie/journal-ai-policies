policy_owner: rsc
delegates_to_journal: false
policy_architecture: rule_with_exemptions
homepage: null
notes: 'The RSC sets out its AI rules for authors in three sections of its author responsibilities page:
  authorship, disclosure and transparency, and image creation and editing. AI tools cannot be listed as
  an author, and the RSC follows the COPE position statement on AI and authorship. Any generative AI use
  in preparing the manuscript must be declared in the cover letter at submission; AI-assisted copy editing
  need not be declared.'
