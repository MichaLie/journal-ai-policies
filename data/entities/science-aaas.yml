policies:
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - review_report
  rationale: confidentiality
  evidence:
  - source: editorial-policies
    quote: Reviewers may not enter any part of the manuscript into an LLM or other AI tool because this
      could breach the confidentiality of the manuscript.
    quote_provenance: raw_bytes
  - source: editorial-policies
    quote: However, reviewers may use AI tools to revise their own writing, provided that the system does
      not save or use inputs to train the model and that such use is transparently declared in the review.
    quote_provenance: raw_bytes
  conditions: Reviewers may revise their own writing if the tool neither saves inputs nor uses them for
    training, and they disclose this in the review. Entering any manuscript content remains prohibited.
    This corrects the former blanket prohibition in this record; the exception was already present in
    the stored source.
- axis: illustrative_images
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - submission_field
  rationale: accountability
  conditions: Prior editor permission required; exceptions case-by-case and disclosed at submission.
  evidence:
  - source: editorial-policies
    quote: AI-generated images and other multimedia are not permitted in the Science journals without
      explicit permission from the editors.
    quote_provenance: raw_bytes
- axis: due_process
  permission: not_addressed
  disclosure: not_addressed
  disclosure_location: []
  rationale: control
  conditions: 'No threshold for triggering review, no duty to notify the author, and no route of appeal
    is stated. The quote records what is granted instead: editorial discretion.'
  evidence:
  - source: editorial-policies
    quote: Editors may decline to move forward with manuscripts if AI is used inappropriately.
    quote_provenance: raw_bytes
    evidence_role: documents_absence
- axis: publisher_own_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: accountability
  conditions: The AI-use matrix asks the editorial office to post its own AI tools on the journal website.
    We looked for such a posting on the editorial-policies page on 2026-08-21 and did not find one; the
    individual Science-family journal sites were not checked, so this is a gap in our looking, not an
    established absence.
  evidence:
  - source: editorial-policies
    quote: The Science journals use the Crossref Similarity Check service to detect plagiarism and follow
      guidelines from the Committee on Publication Ethics (COPE) in dealing with cases of suspected plagiarism.
    quote_provenance: raw_bytes
coherence: []
