policies:
- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - review_report
  rationale: confidentiality
  evidence:
  - source: editorial-policies
    quote: Reviewers may not enter any part of the manuscript into an LLM or other AI tool because this
      could breach the confidentiality of the manuscript.
    quote_provenance: raw_bytes
  - source: editorial-policies
    quote: However, reviewers may use AI tools to revise their own writing, provided that the system does
      not save or use inputs to train the model and that such use is transparently declared in the review.
    quote_provenance: raw_bytes
  - source: editorial-policies
    quote: Reviewers are solely accountable for outputs created with the help of generative AI tools.
    quote_provenance: raw_bytes
  conditions: Reviewers must not enter any part of the manuscript into an AI tool. They may use AI to revise
    their own writing if the system neither saves inputs nor uses them for training, and they declare this
    in the review. Reviewers are solely accountable for outputs created with generative AI tools.
- axis: illustrative_images
  permission: prohibited
  disclosure: required
  disclosure_location:
  - unspecified
  rationale: unstated
  conditions: AI-generated images and other multimedia need explicit permission from the editors. Exceptions,
    such as images or videos in manuscripts about AI or machine learning, are judged case by case and should
    be disclosed at submission. The journals say this position may change with copyright law and industry
    standards.
  evidence:
  - source: editorial-policies
    quote: AI-generated images and other multimedia are not permitted in the Science journals without
      explicit permission from the editors.
    quote_provenance: raw_bytes
  - source: editorial-policies
    quote: Exceptions may be granted in certain situations—e.g., for images and/or videos in manuscripts
      specifically about AI and/or machine learning.
    quote_provenance: raw_bytes
  - source: editorial-policies
    quote: Such exceptions will be evaluated on a case-by-case basis and should be disclosed at the time
      of submission.
    quote_provenance: raw_bytes
  - source: editorial-policies
    quote: our position on AI-generated multimedia may change with the evolution of copyright law and industry
      standards on ethical use.
    quote_provenance: raw_bytes
- axis: writing_drafting
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - cover_letter
  - methods
  - acknowledgements
  rationale: accountability
  conditions: AI tools may not be listed as authors or coauthors, and sources cited in Science journal content
    may not be authored or coauthored by AI tools. Authors should note AI use in the cover letter and in
    the methods or acknowledgments section. The location and details of the declaration depend on use case,
    as set out in the linked AI usage guidelines. Authors are accountable for the accuracy of the work and
    for ensuring there is no plagiarism. They must ensure all sources are appropriately cited and should
    review the work for bias introduced by AI. Editors may decline manuscripts where AI is used inappropriately.
  evidence:
  - source: editorial-policies
    quote: AI-assisted technologies [such as large language models (LLMs), chatbots, and image creators]
      do not meet the Science journals’ criteria for authorship and therefore may not be listed as authors
      or coauthors, nor may sources cited in Science journal content be authored or coauthored by AI tools.
    quote_provenance: raw_bytes
  - source: editorial-policies
    quote: Authors who use AI-assisted technologies as components of their research study or as aids in
      the writing or presentation of the manuscript should note this in the cover letter and in the methods
      section or acknowledgments section of the manuscript
    quote_provenance: raw_bytes
  - source: editorial-policies
    quote: the location and details of the declaration will depend on use case; see our AI usage guidelines
      for specifics
    quote_provenance: raw_bytes
  - source: editorial-policies
    quote: Authors are accountable for the accuracy of the work and for ensuring that there is no plagiarism.
    quote_provenance: raw_bytes
  - source: editorial-policies
    quote: They must also ensure that all sources are appropriately cited and should carefully review the
      work to guard against bias that may be introduced by AI.
    quote_provenance: raw_bytes
  - source: editorial-policies
    quote: Editors may decline to move forward with manuscripts if AI is used inappropriately.
    quote_provenance: raw_bytes
