homepage: https://www.science.org
notes: The Science journals' editorial policies cover AI use by authors and reviewers. AI tools cannot
  be authors, and AI-generated images need explicit permission from the editors. Authors who use AI in
  the research or as an aid in writing or presenting the manuscript should note this in the cover letter
  and in the methods or acknowledgments. The page points to separate AI usage guidelines for details by
  use case; those guidelines are not yet included here, so some activities are not yet assessed.
