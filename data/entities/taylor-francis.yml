- axis: reviewer_use
  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: confidentiality
  conditions: Reviewers may use generative AI to improve review language. They must not upload unpublished
    manuscripts or associated files into AI tools or use AI to generate review reports. They should not
    use generative AI for analysis or to summarise submitted articles.
  evidence:
  - source: ai-policy
    quote: However, Generative AI may be utilised to assist with improving review language.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: As such, peer reviewers must not upload unpublished manuscripts or project proposals, including
      any associated files, images, or information, into Generative AI tools.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Reviewers must not use artificial intelligence tools to generate manuscript and proposal review
      reports, including LLM based tools like ChatGPT.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: The use of manuscripts in Generative AI systems may give rise to risks around confidentiality,
      infringement of proprietary rights and data and other risks.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Peer reviewers are chosen experts in their fields and should not be using Generative AI for analysis
      or to summarise submitted articles or portions thereof in the creation of their reviews.
    quote_provenance: raw_bytes
