policy_owner: taylor-francis
delegates_to_journal: true
policy_architecture: rule_with_exemptions
homepage: null
notes: 'The policy says individual journals may restrict AI use further: "Note that some journals may
  not allow use of Generative AI tools beyond language improvement, therefore authors are advised to review
  the “Instructions for authors” on the journal homepage prior to submission." Book authors must ask their
  editorial contacts to approve any planned AI use, at the proposal stage or during writing; an approved
  statement goes in the preface or introduction of the book. The policy warns that generative AI providers
  may reuse input or output data, for example for AI training.'
