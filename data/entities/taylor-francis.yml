- axis: passing_off
  permission: prohibited
  disclosure: not_addressed
  disclosure_location: []
  rationale: unstated
  conditions: Generative AI must not be used to create or manipulate outputs of research or clinical testing,
    including adding, removing or concealing features in an image. Authors should not submit manuscripts
    that use synthetic data to substitute missing data without robust methodology. Such cases may be subject
    to editorial investigation.
  evidence:
  - source: ai-policy
    quote: Taylor & Francis does not permit the use of Generative AI in the creation or manipulation of
      outputs of research or clinical testing, for example, research results, clinical samples and diagnostic
      images.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: The term “manipulation” includes augmenting, concealing, moving, removing, or introducing a specific
      feature within an image or figure.
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Synthetic data generation to substitute missing data without robust methodology
    quote_provenance: raw_bytes
  - source: ai-policy
