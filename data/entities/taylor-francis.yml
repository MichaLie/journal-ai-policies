  rationale: accountability
  conditions: Generated text must be rigorously revised and checked for accuracy. Authors should not submit
    AI-generated content that is inaccurate, including abstracts or supplemental materials. Authors are responsible
    for ensuring that submitted content is created by the author. Articles need an AI usage statement
    naming the tool and version, how it was used and why. Some journals may not allow AI use beyond
    language improvement.
