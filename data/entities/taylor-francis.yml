  permission: permitted_with_conditions
  disclosure: not_addressed
  disclosure_location: []
  rationale: confidentiality
  conditions: Editors may use generative AI tools where they have been informed that the tool and the
    proposed use are authorised. Otherwise they should check with their Taylor & Francis contact first.
    Editors must not upload unpublished manuscripts or associated files into generative AI tools. The source
    does not describe Taylor & Francis's own AI systems or tools.
  evidence:
