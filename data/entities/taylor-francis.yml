- axis: language_refinement
  permission: permitted_with_conditions
  disclosure: required
  disclosure_location:
  - dedicated_section
  rationale: accountability
  conditions: Supported with tools that respect data security, confidentiality and copyright protection.
    Articles need an AI usage statement naming the tool and version, how it was used and why.
  evidence:
  - source: ai-policy
    quote: Taylor & Francis supports the responsible use of Generative AI tools that respect high standards
      of data security, confidentiality, and copyright protection in cases such as
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: Copyediting, language improvement and translations
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: 'Authors must clearly acknowledge within the article or book any use of Generative AI tools through
      a statement that includes: the full name of the tool used (with version number), how it was used and
      the reason for use.'
    quote_provenance: raw_bytes
  - source: ai-policy
    quote: For article submissions, a specific statement of AI usage disclosure must be included.
    quote_provenance: raw_bytes
  - source: ai-policy
